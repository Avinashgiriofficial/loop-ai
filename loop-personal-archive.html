<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOOP — Personal Archive &amp; Reminders</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      --bg-page: #0A1228;
      --text-primary: #EDEFF5;
      --text-muted: #9AA6C0;
      --panel-bg: rgba(16, 27, 58, 0.88);
      --panel-border: #26365F;
      --subpanel-bg: rgba(10, 18, 40, 0.86);
      --subpanel-border: #26365F;
      --brass-accent: #D4AE5E;
      --brass-soft: rgba(212, 174, 94, 0.14);
      --brass-border: rgba(212, 174, 94, 0.44);
      --verdigris: #6CCBB2;
      --verdigris-soft: rgba(108, 203, 178, 0.14);
      --input-bg: rgba(10, 18, 40, 0.94);
      --input-border: #26365F;
      --btn-primary-bg: #D4AE5E;
      --btn-primary-hover: #E0BE74;
      --btn-primary-text: #0A1228;
      --btn-secondary-bg: rgba(16, 27, 58, 0.88);
      --btn-secondary-text: #EDEFF5;
      --brass-glow: rgba(212, 174, 94, 0.14);
      --amber-card-bg: #271E12;
      --amber-card-border: #D4AE5E;
      --highlight-green-bg: rgba(22, 48, 43, 0.82);
      --highlight-green-border: #6CCBB2;
      --highlight-brass-bg: rgba(45, 34, 18, 0.9);
      --highlight-brass-border: #D4AE5E;
    }
    html.light {
      --bg-page: #ECEFF2;
      --text-primary: #101B33;
      --text-muted: #4E5B78;
      --panel-bg: rgba(255, 255, 255, 0.84);
      --panel-border: #CBD3E1;
      --subpanel-bg: rgba(246, 248, 250, 0.94);
      --subpanel-border: #CBD3E1;
      --brass-accent: #A67C2E;
      --brass-soft: rgba(166, 124, 46, 0.12);
      --brass-border: rgba(166, 124, 46, 0.45);
      --verdigris: #1E8A6E;
      --verdigris-soft: rgba(30, 138, 110, 0.12);
      --input-bg: rgba(255, 255, 255, 0.96);
      --input-border: #CBD3E1;
      --btn-primary-bg: #A67C2E;
      --btn-primary-hover: #8E6822;
      --btn-primary-text: #FFFFFF;
      --btn-secondary-bg: rgba(255, 255, 255, 0.94);
      --btn-secondary-text: #101B33;
      --brass-glow: rgba(166, 124, 46, 0.10);
      --amber-card-bg: #FDF6E7;
      --amber-card-border: #A67C2E;
      --highlight-green-bg: rgba(30, 138, 110, 0.11);
      --highlight-green-border: #1E8A6E;
      --highlight-brass-bg: #FDF6E7;
      --highlight-brass-border: #A67C2E;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: var(--font-sans);
      background-color: var(--bg-page);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.22s ease, color 0.22s ease;
    }
    .font-serif-display { font-family: var(--font-serif); }
    .fluted-surface {
      background-image: repeating-linear-gradient(
        90deg,
        rgba(212, 174, 94, 0.035) 0px, rgba(212, 174, 94, 0.035) 1px,
        transparent 1px, transparent 18px,
        rgba(255, 255, 255, 0.018) 18px, rgba(255, 255, 255, 0.018) 28px,
        transparent 28px, transparent 44px
      );
    }
    html.light .fluted-surface {
      background-image: repeating-linear-gradient(
        90deg,
        rgba(166, 124, 46, 0.045) 0px, rgba(166, 124, 46, 0.045) 1px,
        transparent 1px, transparent 18px,
        rgba(16, 27, 51, 0.025) 18px, rgba(16, 27, 51, 0.025) 28px,
        transparent 28px, transparent 44px
      );
    }
    .fluted-navy-sidebar {
      background-color: #0A1228;
      background-image: repeating-linear-gradient(
        90deg,
        rgba(212, 174, 94, 0.04) 0px, rgba(212, 174, 94, 0.04) 1px,
        transparent 1px, transparent 18px,
        rgba(255, 255, 255, 0.02) 18px, rgba(255, 255, 255, 0.02) 28px,
        transparent 28px, transparent 44px
      );
    }
    .neo-panel {
      background-color: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
    }
    .neo-subpanel {
      background-color: var(--subpanel-bg);
      border: 1px solid var(--subpanel-border);
      border-radius: 12px;
    }
    .neo-muted { color: var(--text-muted); }
    .neo-brass-text { color: var(--brass-accent); }
    .neo-verdigris-text { color: var(--verdigris); }
    .neoclassical-arch { border-radius: 9999px 9999px 16px 16px; }
    .btn-primary {
      background-color: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.12s ease, opacity 0.15s ease;
    }
    .btn-primary:hover:not(:disabled) { background-color: var(--btn-primary-hover); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-secondary {
      background-color: var(--btn-secondary-bg);
      color: var(--btn-secondary-text);
      border: 1px solid var(--input-border);
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }
    .btn-secondary:hover { border-color: var(--brass-accent); }
    .neo-input {
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-primary);
    }
    .neo-input::placeholder { color: var(--text-muted); opacity: 0.72; }
    .pricing-card-glow {
      border-color: var(--panel-border);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .pricing-card-glow:hover {
      border-color: var(--brass-accent) !important;
      box-shadow: 0 0 32px rgba(212, 174, 94, 0.22);
    }
    .pricing-card-plus {
      border-color: var(--brass-border);
      box-shadow: 0 0 22px rgba(212, 174, 94, 0.10);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .pricing-card-plus:hover {
      border-color: var(--brass-accent) !important;
      box-shadow: 0 0 36px rgba(212, 174, 94, 0.26);
    }
    @keyframes scanSweep {
      0% { top: 2%; opacity: 0.95; }
      95% { top: 96%; opacity: 0.95; }
      100% { top: 98%; opacity: 0; }
    }
    .scan-beam {
      position: absolute; left: 0; right: 0; z-index: 20;
      pointer-events: none;
      animation: scanSweep 2.4s linear forwards;
    }
    @media (prefers-reduced-motion: reduce) {
      .scan-beam { animation: none !important; }
    }
  </style>
</head>
<body class="min-h-screen fluted-surface">
  <div id="root-app"></div>

  <div id="certificate-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"
    class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#0A1228]/70 backdrop-blur-xs">
    <div id="certificate-modal-card" class="w-full max-w-xl neo-panel shadow-2xl overflow-hidden">
      <div class="pt-2 px-2">
        <div class="border-t-[4px] border-double" style="border-color: var(--brass-accent);"></div>
      </div>
      <div class="px-6 py-4 border-b flex items-center justify-between gap-3" style="border-color: var(--panel-border);">
        <div>
          <h2 id="modal-title" class="font-serif-display text-2xl font-bold"></h2>
          <p id="modal-subtitle" class="text-xs mt-0.5 neo-muted"></p>
        </div>
        <button type="button" id="modal-close-top" aria-label="Close" class="p-2 rounded-lg btn-secondary">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div id="modal-body" class="p-6 space-y-4 max-h-[70vh] overflow-y-auto"></div>
      <div class="px-6 py-3.5 border-t flex items-center justify-between gap-3" style="border-color: var(--panel-border);">
        <span id="modal-footer-note" class="text-xs neo-muted"></span>
        <button type="button" id="modal-close-bottom" class="px-4 py-2 rounded-[10px] text-xs btn-primary">Close</button>
      </div>
    </div>
  </div>

  <div id="toast-banner" role="status" aria-live="polite"
    class="hidden fixed bottom-5 right-5 z-50 flex items-center gap-2.5 px-4 py-3 rounded-[12px] bg-[#101B3A] border border-[#D4AE5E] text-[#EDEFF5] shadow-xl text-sm font-medium">
    <svg class="w-4 h-4 text-[#6CCBB2] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" />
    </svg>
    <span id="toast-message">Action completed</span>
  </div>

  <script>
  (function () {
    'use strict';

    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const REF_TODAY = new Date(2026, 10, 26); // for display consistency with original design
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    // ------------------------------------------------------------------
    // API CLIENT (cookie session + CSRF)
    // ------------------------------------------------------------------
    function getCookie(name) {
      const m = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/([.$?*|{}()[\]\\/+^])/g, '\\$1') + '=([^;]*)'));
      return m ? decodeURIComponent(m[1]) : null;
    }

    async function api(path, options = {}) {
      const method = (options.method || 'GET').toUpperCase();
      const headers = Object.assign({}, options.headers || {});
      if (!headers['Content-Type'] && options.body && !(options.body instanceof FormData) && !(options.body instanceof Blob)) {
        headers['Content-Type'] = 'application/json';
      }
      if (method !== 'GET' && method !== 'HEAD' && method !== 'OPTIONS') {
        const csrf = getCookie('loop_csrf');
        if (csrf) headers['X-CSRF-Token'] = csrf;
      }
      const opts = {
        method,
        credentials: 'include',
        headers,
      };
      if (options.body !== undefined) {
        opts.body = (typeof options.body === 'string' || options.body instanceof FormData || options.body instanceof Blob)
          ? options.body
          : JSON.stringify(options.body);
      }
      const res = await fetch(path, opts);
      let data = null;
      const ct = res.headers.get('content-type') || '';
      if (ct.includes('application/json')) {
        try { data = await res.json(); } catch (_) { data = null; }
      } else if (ct.includes('application/zip') || ct.includes('octet-stream')) {
        data = await res.blob();
      } else if (res.status !== 204) {
        try { data = await res.text(); } catch (_) { data = null; }
      }
      if (!res.ok) {
        const detail = (data && (data.detail || data.message || data.msg)) || res.statusText || 'Request failed';
        const err = new Error(typeof detail === 'string' ? detail : JSON.stringify(detail));
        err.status = res.status;
        err.data = data;
        throw err;
      }
      return data;
    }

    // ------------------------------------------------------------------
    // STATE
    // ------------------------------------------------------------------
    const state = {
      bootstrapping: true,
      route: 'landing',
      appTab: 'today',
      lightMode: false,
      mobileMenuOpen: false,

      isAuthenticated: false,
      devDemoEnabled: false,
      userId: null,
      userName: '',
      userEmail: '',
      permissionsGranted: false,

      authEmailInput: '',
      authPasswordInput: '',
      authConsentChecked: false,
      authErrors: {},
      authBusy: false,

      permissions: {
        documentAccess: true,
        notifications: true,
        microphone: false,
        leadTime: '2 days before',
        leadDays: 2
      },
      channels: { emailDigest: true, pushNotifications: true, smsFallback: false },
      consents: { localParsing: true, patternInsights: true, modelTraining: false },
      timezone: 'Asia/Kolkata',

      landingAmbiguousChoice: null,
      openFaqIndex: 0,
      waitlistMessage: '',

      records: [],
      recordsLoading: false,
      selectedRingItemId: null,

      addInputTab: 'file',
      uploadError: '',
      pastedText: '',
      isRecording: false,
      recordingSeconds: 0,
      mediaRecorder: null,
      recordedChunks: [],

      // live document review (real API)
      activeDocId: null,
      scanDoc: null, // mapped draft for UI
      isScanning: false,
      scanStage: 0,
      selectedChoiceId: null,
      draftIssuer: '',
      draftCategory: 'Bill',
      draftAmount: '',
      draftAmountMinor: null,
      draftCurrency: 'INR',
      draftDueDate: '',
      draftTitle: '',
      draftReminderTiming: '2 days before',
      draftLeadDays: 2,
      draftChoices: [],
      draftEvidence: [],
      draftSummary: '',
      draftOverallConfidence: 0,
      pollTimer: null,

      vaultSearch: '',
      vaultFilter: 'All',

      askQuery: '',
      askResult: null,
      askBusy: false,

      busyAction: false
    };

    let toastTimeout = null;
    let recordingInterval = null;

    // ------------------------------------------------------------------
    // HELPERS
    // ------------------------------------------------------------------
    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function showToast(message) {
      const banner = document.getElementById('toast-banner');
      const msgEl = document.getElementById('toast-message');
      msgEl.textContent = message;
      banner.classList.remove('hidden');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => banner.classList.add('hidden'), 3500);
    }

    function syncTheme() {
      document.documentElement.classList.toggle('light', state.lightMode);
    }

    function logoSvgHtml(sizeClass = 'w-8 h-9') {
      return `<svg viewBox="0 0 36 42" fill="none" class="${sizeClass} shrink-0" aria-hidden="true">
        <path d="M3 39V17C3 8.71573 9.71573 2 18 2C26.2843 2 33 8.71573 33 17V39H3Z" stroke="var(--brass-accent)" stroke-width="2" />
        <path d="M9.5 39V17.5C9.5 12.8056 13.3056 9 18 9C22.6944 9 26.5 12.8056 26.5 17.5V39" stroke="var(--brass-accent)" stroke-width="1.35" stroke-opacity="0.85" />
        <circle cx="18" cy="17.5" r="2" fill="var(--brass-accent)" />
      </svg>`;
    }

    function formatDisplayDate(isoDate) {
      if (!isoDate) return '';
      const parts = String(isoDate).slice(0, 10).split('-').map(Number);
      if (parts.length !== 3 || parts.some(isNaN)) return isoDate;
      return `${parts[2]} ${MONTHS[parts[1] - 1]} ${parts[0]}`;
    }

    function daysFromToday(isoDate) {
      if (!isoDate) return 0;
      const parts = String(isoDate).slice(0, 10).split('-').map(Number);
      if (parts.length !== 3 || parts.some(isNaN)) return 0;
      const target = new Date(parts[0], parts[1] - 1, parts[2]);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return Math.round((target - today) / 86400000);
    }

    function formatAmount(minor, currency) {
      if (minor == null) return '—';
      const major = Number(minor) / 100;
      if (currency === 'INR' || !currency) {
        return '₹' + major.toLocaleString('en-IN', { maximumFractionDigits: 2 });
      }
      return currency + ' ' + major.toLocaleString('en-US', { maximumFractionDigits: 2 });
    }

    function parseAmountToMinor(text) {
      if (text == null || text === '') return null;
      const cleaned = String(text).replace(/[^\d.]/g, '');
      if (!cleaned) return null;
      const n = parseFloat(cleaned);
      if (isNaN(n)) return null;
      // If user typed whole rupees like 3420, treat as major units
      return Math.round(n * 100);
    }

    function leadDaysFromLabel(label) {
      if (!label) return 2;
      if (label.includes('1 day')) return 1;
      if (label.includes('3 day')) return 3;
      if (label.includes('1 week') || label.includes('7')) return 7;
      return 2;
    }

    function labelFromLeadDays(d) {
      if (d === 1) return '1 day before';
      if (d === 3) return '3 days before';
      if (d === 7) return '1 week before';
      return '2 days before';
    }

    function mapApiRecord(r) {
      const primaryIso = r.due_date || r.checkin_date || (r.due_at ? String(r.due_at).slice(0, 10) : null);
      const days = daysFromToday(primaryIso);
      return {
        id: r.id,
        title: r.title,
        issuer: r.issuer,
        amount: formatAmount(r.amount_minor, r.currency),
        amountMinor: r.amount_minor,
        currency: r.currency || 'INR',
        dueDate: primaryIso,
        dueDateDisplay: formatDisplayDate(primaryIso),
        daysFromToday: days,
        category: r.category,
        status: r.status === 'paid' ? 'Paid' : 'Confirmed',
        reminderTiming: labelFromLeadDays(r.reminder_lead_days),
        reminderLeadDays: r.reminder_lead_days,
        reminderAt: r.reminder_at,
        reminderStatus: r.reminder_status,
        sourceType: r.source_type || 'Document',
        savedAt: r.approved_at ? formatDisplayDate(String(r.approved_at).slice(0, 10)) : '',
        referenceCode: r.reference_code,
        summarySnippet: r.summary_snippet || '',
        snippet: r.summary_snippet || `${r.title} from ${r.issuer}`,
        billDate: r.bill_date,
        bookingDate: r.booking_date,
        paymentDate: r.payment_date,
        checkinDate: r.checkin_date,
        dueAt: r.due_at,
        evidenceFields: r.evidence_fields || [],
        originalFileUrl: r.original_file_url || null,
        raw: r
      };
    }

    function getSortedRecords() {
      return [...state.records].sort((a, b) => a.daysFromToday - b.daysFromToday);
    }

    function getCategoryBadgeHtml(category) {
      if (category === 'Bill') {
        return `<span class="text-xs font-medium px-2.5 py-0.5 rounded-full border" style="background-color: var(--brass-soft); color: var(--brass-accent); border-color: var(--brass-border);">${escapeHtml(category)}</span>`;
      }
      if (category === 'Booking') {
        return `<span class="text-xs font-medium px-2.5 py-0.5 rounded-full border" style="background-color: rgba(154,166,192,0.12); color: var(--text-primary); border-color: var(--panel-border);">${escapeHtml(category)}</span>`;
      }
      return `<span class="text-xs font-medium px-2.5 py-0.5 rounded-full border" style="background-color: var(--verdigris-soft); color: var(--verdigris); border-color: var(--highlight-green-border);">${escapeHtml(category)}</span>`;
    }

    function applySettingsFromApi(settings) {
      if (!settings) return;
      state.timezone = settings.timezone || state.timezone;
      if (settings.permissions) {
        state.permissions.documentAccess = !!settings.permissions.document_access;
        state.permissions.notifications = !!settings.permissions.notifications;
        state.permissions.microphone = !!settings.permissions.microphone;
        state.permissions.leadDays = settings.permissions.lead_days || 2;
        state.permissions.leadTime = labelFromLeadDays(state.permissions.leadDays);
        state.draftLeadDays = state.permissions.leadDays;
        state.draftReminderTiming = state.permissions.leadTime;
      }
      if (settings.channels) {
        state.channels.emailDigest = !!settings.channels.email_digest;
        state.channels.pushNotifications = !!settings.channels.push_notifications;
        state.channels.smsFallback = !!settings.channels.sms_fallback;
      }
      if (settings.consents) {
        state.consents.localParsing = !!settings.consents.local_parsing;
        state.consents.patternInsights = !!settings.consents.pattern_insights;
        state.consents.modelTraining = !!settings.consents.model_training;
      }
      state.permissionsGranted = !!settings.permissions_granted;
    }

    function applyUserFromApi(user, settings) {
      if (!user) {
        state.isAuthenticated = false;
        state.userId = null;
        state.userName = '';
        state.userEmail = '';
        state.permissionsGranted = false;
        state.records = [];
        return;
      }
      state.isAuthenticated = true;
      state.userId = user.id;
      state.userEmail = user.email || '';
      state.userName = user.name || (user.email || '').split('@')[0] || 'User';
      state.permissionsGranted = !!user.permissions_granted;
      applySettingsFromApi(settings);
    }

    // ------------------------------------------------------------------
    // DATA LOADERS
    // ------------------------------------------------------------------
    async function loadSession() {
      try {
        const me = await api('/api/v1/auth/me');
        state.devDemoEnabled = !!me.dev_demo_enabled;
        if (me.authenticated && me.user) {
          applyUserFromApi(me.user, me.settings);
        } else {
          applyUserFromApi(null);
        }
      } catch (e) {
        console.warn('Session check failed', e);
        applyUserFromApi(null);
      }
    }

    async function loadRecords() {
      if (!state.isAuthenticated) {
        state.records = [];
        return;
      }
      state.recordsLoading = true;
      try {
        const data = await api('/api/v1/records');
        state.records = (data.items || []).map(mapApiRecord);
        if (!state.selectedRingItemId || !state.records.find(r => r.id === state.selectedRingItemId)) {
          const sorted = getSortedRecords().filter(r => r.status !== 'Paid');
          state.selectedRingItemId = sorted[0] ? sorted[0].id : (state.records[0] ? state.records[0].id : null);
        }
      } catch (e) {
        console.error(e);
        showToast(e.message || 'Could not load records');
      } finally {
        state.recordsLoading = false;
      }
    }

    // ------------------------------------------------------------------
    // ROUTER
    // ------------------------------------------------------------------
    function navigateTo(targetRoute, targetAppTab) {
      if (targetAppTab) state.appTab = targetAppTab;

      if (targetRoute === 'app') {
        if (!state.isAuthenticated) {
          state.route = 'login';
          history.replaceState(null, '', '#/login');
          render();
          window.scrollTo({ top: 0, behavior: 'auto' });
          return;
        }
        if (!state.permissionsGranted) {
          state.route = 'permissions';
          history.replaceState(null, '', '#/permissions');
          render();
          window.scrollTo({ top: 0, behavior: 'auto' });
          return;
        }
      }
      if (targetRoute === 'permissions' && !state.isAuthenticated) {
        state.route = 'login';
        history.replaceState(null, '', '#/login');
        render();
        window.scrollTo({ top: 0, behavior: 'auto' });
        return;
      }

      state.route = targetRoute;
      state.mobileMenuOpen = false;
      const hashMap = {
        landing: '#/',
        login: '#/login',
        signup: '#/signup',
        permissions: '#/permissions',
        app: state.appTab === 'today' ? '#/app' : `#/app/${state.appTab}`
      };
      const nextHash = hashMap[targetRoute] || '#/';
      if (window.location.hash !== nextHash) history.replaceState(null, '', nextHash);
      render();
      window.scrollTo({ top: 0, behavior: 'auto' });

      if (targetRoute === 'app' && state.isAuthenticated) {
        loadRecords().then(() => render());
      }

      else if (raw === '/permissions') state.route = state.isAuthenticated ? 'permissions' : 'login';

        const sub = raw.split('/')[2] || 'today';
        if (['today', 'add', 'vault', 'ask', 'settings'].includes(sub)) state.appTab = sub;
        if (!state.isAuthenticated) state.route = 'login';
        else if (!state.permissionsGranted) state.route = 'permissions';
        else state.route = 'app';

        state.route = 'landing';

            const data = await api('/api/v1/auth/dev-demo-signin', { method: 'POST', body: {} });
            applyUserFromApi(data.user, null);
            await loadSession();
            showToast('Demo session started');
            navigateTo(state.permissionsGranted ? 'app' : 'permissions', 'today');
          } catch (e) {
            state.authErrors = { form: e.message || 'Demo sign-in failed' };
            state.authBusy = false;
            render();
          }
        });
      }

      const form = document.getElementById('auth-form');
      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const errs = {};
          const emailVal = state.authEmailInput.trim();
          if (!emailVal || !emailVal.includes('@')) errs.email = 'Enter a valid email address.';
          if (state.authPasswordInput.length < 6) errs.password = 'Use at least 6 characters.';
          if (mode === 'signup' && !state.authConsentChecked) errs.consent = 'Please accept the privacy consent.';
          state.authErrors = errs;
          if (Object.keys(errs).length) { render(); return; }

          state.authBusy = true;
          render();
          try {
            await api('/api/v1/auth/me'); // CSRF
            let data;
            if (mode === 'signup') {
              data = await api('/api/v1/auth/signup', {
                method: 'POST',
                body: { email: emailVal, password: state.authPasswordInput, consent_accepted: true }
              });
              if (data.email_confirmation_required) {
                state.authErrors = { form: data.message || 'Check your email to confirm, then log in.' };
                state.authBusy = false;
                render();
                return;
              }
            } else {
              data = await api('/api/v1/auth/login', {
                method: 'POST',
                body: { email: emailVal, password: state.authPasswordInput }
              });
            }
            applyUserFromApi(data.user, null);
            await loadSession();
            state.authBusy = false;
            showToast(mode === 'signup' ? 'Account created' : 'Signed in');
            navigateTo(state.permissionsGranted ? 'app' : 'permissions', 'today');
          } catch (err) {
            state.authErrors = { form: err.message || 'Authentication failed' };
            state.authBusy = false;
            render();
          }
        });
      }
    }

    function buildThirtyDayRingSvg(itemsWithin30, selectedItem) {
      const size = 320, cx = 160, cy = 160, radius = 120;
      const brassColor = state.lightMode ? '#A67C2E' : '#D4AE5E';
      const verdigrisColor = state.lightMode ? '#1E8A6E' : '#6CCBB2';
      const trackColor = state.lightMode ? '#CBD3E1' : '#26365F';
      const ringBg = state.lightMode ? '#FFFFFF' : '#0A1228';
      let ticksSvg = '';
      for (let day = 0; day < 30; day++) {
        const angleDeg = -90 + day * 12;
        const rad = (angleDeg * Math.PI) / 180;
        const isWeek = day % 7 === 0;
        const r1 = isWeek ? radius - 11 : radius - 6;
        ticksSvg += `<line x1="${(cx + r1 * Math.cos(rad)).toFixed(2)}" y1="${(cy + r1 * Math.sin(rad)).toFixed(2)}" x2="${(cx + radius * Math.cos(rad)).toFixed(2)}" y2="${(cy + radius * Math.sin(rad)).toFixed(2)}" stroke="${isWeek ? brassColor : trackColor}" stroke-width="${isWeek ? 1.9 : 1.1}" stroke-linecap="round" />`;
      }
      const markersSvg = itemsWithin30.map(item => {
        const days = Math.max(0, Math.min(29, item.daysFromToday));
        const angleDeg = -90 + days * 12;
        const rad = (angleDeg * Math.PI) / 180;
        const mx = (cx + radius * Math.cos(rad)).toFixed(2);
        const my = (cy + radius * Math.sin(rad)).toFixed(2);
        const isSelected = selectedItem && selectedItem.id === item.id;
        return `<g role="button" tabindex="0" data-select-ring-id="${item.id}" class="cursor-pointer">
          ${isSelected ? `<circle cx="${mx}" cy="${my}" r="15" fill="${brassColor}" fill-opacity="0.18" />` : ''}
          <circle cx="${mx}" cy="${my}" r="${isSelected ? 7.5 : 5.5}" fill="${brassColor}" stroke="${ringBg}" stroke-width="1.8" />
        </g>`;
      }).join('');

      return `
        <div class="flex flex-col items-center">
          <div class="relative w-full max-w-[310px] aspect-square flex items-center justify-center">
            <svg viewBox="0 0 ${size} ${size}" class="w-full h-full overflow-visible">
              <circle cx="${cx}" cy="${cy}" r="${radius + 12}" fill="none" stroke="${trackColor}" stroke-width="1" />
              <circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="${trackColor}" stroke-width="1.8" />
              ${ticksSvg}
              <circle cx="${cx}" cy="${cy - radius}" r="6" fill="${verdigrisColor}" stroke="${ringBg}" stroke-width="1.8" />
              <text x="${cx}" y="${cy - radius - 14}" text-anchor="middle" fill="${verdigrisColor}" font-size="11" font-weight="600">Today</text>
              ${markersSvg}
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-12 pointer-events-none">
              ${selectedItem ? `
                <span class="font-serif-display text-6xl font-bold leading-none">${selectedItem.daysFromToday}</span>
                <span class="text-xs font-medium mt-1 neo-muted">${selectedItem.daysFromToday === 1 ? 'day left' : 'days left'}</span>
                <p class="font-serif-display text-lg font-bold leading-tight mt-2 line-clamp-2">${escapeHtml(selectedItem.title)}</p>
                <span class="text-xs mt-1 font-medium neo-brass-text">${escapeHtml(selectedItem.dueDateDisplay)} · ${escapeHtml(selectedItem.amount)}</span>
              ` : `<p class="font-serif-display text-xl font-bold">All caught up</p>`}
            </div>
          </div>
          ${selectedItem ? `<div class="mt-2"><button type="button" id="mark-paid-btn" data-mark-paid-id="${selectedItem.id}" class="px-4 py-2 rounded-[10px] text-xs btn-secondary">Mark as paid</button></div>` : ''}
          <div class="flex flex-wrap items-center justify-between w-full pt-4 mt-4 border-t text-xs neo-muted" style="border-color: var(--brass-border);">
            <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full" style="background-color: var(--verdigris);"></span><span>Today</span></span>
            <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full" style="background-color: var(--brass-accent);"></span><span>Approved (next 30 days)</span></span>
          </div>
        </div>`;
    }

    function resetScanState() {
      if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
      state.activeDocId = null;
      state.scanDoc = null;
      state.isScanning = false;
      state.scanStage = 0;
      state.selectedChoiceId = null;
      state.uploadError = '';
      state.draftIssuer = '';
      state.draftCategory = 'Bill';
      state.draftAmount = '';
      state.draftAmountMinor = null;
      state.draftCurrency = 'INR';
      state.draftDueDate = '';
      state.draftTitle = '';
      state.draftChoices = [];
      state.draftEvidence = [];
      state.draftSummary = '';
      state.draftOverallConfidence = 0;
      state.draftLeadDays = state.permissions.leadDays || 2;
      state.draftReminderTiming = labelFromLeadDays(state.draftLeadDays);
    }

    function applyDraftFromApi(draft) {
      state.scanDoc = draft;
      state.draftTitle = draft.title || '';
      state.draftIssuer = draft.issuer || '';
      state.draftCategory = draft.category || 'Bill';
      state.draftCurrency = draft.currency || 'INR';
      state.draftAmountMinor = draft.amount_minor;
      state.draftAmount = draft.amount_minor != null ? formatAmount(draft.amount_minor, draft.currency) : '';
      state.draftSummary = draft.summary_snippet || '';
      state.draftOverallConfidence = draft.overall_confidence || 0;
      state.draftEvidence = draft.evidence_fields || [];
      state.draftChoices = draft.choices || [];
      state.draftLeadDays = draft.default_lead_days || state.permissions.leadDays || 2;
      state.draftReminderTiming = labelFromLeadDays(state.draftLeadDays);

      const dates = draft.dates || {};
      const primary = dates.due_date || dates.checkin_date || null;
      if (primary) state.draftDueDate = primary;
      if (draft.resolved_choice_id) {
        state.selectedChoiceId = draft.resolved_choice_id;
        const match = (draft.choices || []).find(c => c.id === draft.resolved_choice_id);
        if (match && match.iso_date) state.draftDueDate = match.iso_date;
      }
    }

    async function pollDocumentUntilReady(docId) {
      state.isScanning = true;
      state.scanStage = 1;
      state.activeDocId = docId;
      render();

      const poll = async () => {
        try {
          const st = await api(`/api/v1/documents/${docId}/status`);
          const stage = st.scan_stage || 0;
          state.scanStage = Math.min(3, stage);
          if (st.status === 'needs_review') {
            if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
            const draft = await api(`/api/v1/documents/${docId}/draft`);
            applyDraftFromApi(draft);
            state.scanStage = 4;
            state.isScanning = false;
            render();
            return true;
          }
          if (st.status === 'failed') {
            if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
            state.isScanning = false;
            state.uploadError = st.error_code ? `Processing failed: ${st.error_code}` : 'Processing failed';
            state.scanDoc = null;
            render();
            return true;
          }
          render();
          return false;
        } catch (e) {
          if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
          state.isScanning = false;
          state.uploadError = e.message || 'Status check failed';
          render();
          return true;
        }
      };

      const done = await poll();
      if (!done) {
        state.pollTimer = setInterval(async () => {
          const finished = await poll();
          if (finished && state.pollTimer) {
            clearInterval(state.pollTimer);
            state.pollTimer = null;
          }
        }, 1500);
      }
    }

    async function submitPastedText() {
      const text = state.pastedText.trim();
      if (text.length < 8) {
        state.uploadError = 'Paste a longer bill or confirmation snippet.';
        render();
        return;
      }
      state.uploadError = '';
      state.isScanning = true;
      state.scanStage = 0;
      render();
      try {
        const res = await api('/api/v1/documents/text', {
          method: 'POST',
          body: { text, title: 'Pasted Document' }
        });
        await pollDocumentUntilReady(res.doc_id);
      } catch (e) {
        state.isScanning = false;
        state.uploadError = e.message || 'Upload failed';
        render();
      }
    }

    async function submitFile(file) {
      if (!file) return;
      state.uploadError = '';
      state.isScanning = true;
      state.scanStage = 0;
      render();
      try {
        const mime = file.type || 'application/pdf';
        const urlRes = await api('/api/v1/documents/upload-url', {
          method: 'POST',
          body: { filename: file.name, mime_type: mime, size_bytes: file.size }
        });
        const putRes = await fetch(urlRes.upload_url, {
          method: 'PUT',
          headers: { 'Content-Type': mime },
          body: file,
          credentials: 'include'
        });
        if (!putRes.ok) throw new Error('File upload failed');
        await api(`/api/v1/documents/${urlRes.doc_id}/confirm-upload`, { method: 'POST', body: {} });
        await pollDocumentUntilReady(urlRes.doc_id);
      } catch (e) {
        state.isScanning = false;
        state.uploadError = e.message || 'Upload failed';
        render();
      }
    }

    async function submitVoiceBlob(blob) {
      state.uploadError = '';
      state.isScanning = true;
      state.scanStage = 0;
      render();
      try {
        const fd = new FormData();
        fd.append('file', blob, 'voice.webm');
        const csrf = getCookie('loop_csrf');
        const res = await fetch('/api/v1/documents/voice', {
          method: 'POST',
          credentials: 'include',
          headers: csrf ? { 'X-CSRF-Token': csrf } : {},
          body: fd
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || 'Voice upload failed');
        await pollDocumentUntilReady(data.doc_id);
      } catch (e) {
        state.isScanning = false;
        state.uploadError = e.message || 'Voice upload failed';
        render();
      }
    }

    async function executeAsk(questionText) {
      const q = (questionText !== undefined ? questionText : state.askQuery).trim();
      if (questionText !== undefined) state.askQuery = questionText;
      if (!q || state.askBusy) return;
      state.askBusy = true;
      state.askResult = null;
      render();
      try {
        const data = await api('/api/v1/ask', {
          method: 'POST',
          body: { query: q, category: state.vaultFilter === 'All' ? 'All' : state.vaultFilter }
        });
        let source = null;
        if (data.source_record_id) {
          source = state.records.find(r => r.id === data.source_record_id) || null;
        }
        state.askResult = {
          found: !!data.found,
          fullAnswer: data.answer || (data.found ? '' : "I couldn't find that in your saved records."),
          source
        };
      } catch (e) {
        state.askResult = { found: false, fullAnswer: e.message || 'Ask failed', source: null };
      } finally {
        state.askBusy = false;
        render();
      }
    }

    // ------------------------------------------------------------------
    function bindDashboardEvents() {
      document.querySelectorAll('[data-go-route]').forEach(btn => {
        btn.addEventListener('click', () => navigateTo(btn.getAttribute('data-go-route')));
      });
      document.querySelectorAll('[data-app-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
          const tab = btn.getAttribute('data-app-tab');
          if (tab === 'add') resetScanState();
          navigateTo('app', tab);
        });
      });

      const t1 = document.getElementById('dash-theme-toggle');
      const t2 = document.getElementById('dash-mobile-theme-toggle');
      const toggleTheme = () => { state.lightMode = !state.lightMode; render(); };
      if (t1) t1.addEventListener('click', toggleTheme);
      if (t2) t2.addEventListener('click', toggleTheme);
      const mobileMenuBtn = document.getElementById('dash-mobile-menu-btn');
      if (mobileMenuBtn) mobileMenuBtn.addEventListener('click', () => { state.mobileMenuOpen = !state.mobileMenuOpen; render(); });

      const todayAdd = document.getElementById('today-add-btn');
      if (todayAdd) todayAdd.addEventListener('click', () => { resetScanState(); navigateTo('app', 'add'); });

      document.querySelectorAll('[data-select-ring-id], [data-select-row-id]').forEach(el => {
        el.addEventListener('click', () => {
          state.selectedRingItemId = el.getAttribute('data-select-ring-id') || el.getAttribute('data-select-row-id');
          render();
        });
      });

      const markPaid = document.getElementById('mark-paid-btn');
      if (markPaid) {
        markPaid.addEventListener('click', async () => {
          const id = markPaid.getAttribute('data-mark-paid-id');
          try {
            await api(`/api/v1/records/${id}/status`, { method: 'PATCH', body: { status: 'paid' } });
            showToast('Marked as paid');
            await loadRecords();
            render();
          } catch (e) {
            showToast(e.message || 'Update failed');
          }
        });
      }

      // Add tab
      document.querySelectorAll('[data-add-tab]').forEach(btn => {
        btn.addEventListener('click', () => { state.addInputTab = btn.getAttribute('data-add-tab'); render(); });
      });
      const closeErr = document.getElementById('close-upload-error');
      if (closeErr) closeErr.addEventListener('click', () => { state.uploadError = ''; render(); });

      const chooseFile = document.getElementById('choose-file-btn');
      const fileInput = document.getElementById('file-upload-input');
      if (chooseFile && fileInput) {
        chooseFile.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
          const file = e.target.files && e.target.files[0];
          if (file) submitFile(file);
        });
      }
      const pasteArea = document.getElementById('paste-doc-textarea');
      if (pasteArea) pasteArea.addEventListener('input', e => { state.pastedText = e.target.value; });
      const extractBtn = document.getElementById('extract-text-btn');
      if (extractBtn) extractBtn.addEventListener('click', () => submitPastedText());

      const voiceBtn = document.getElementById('toggle-voice-btn');
      if (voiceBtn) {
        voiceBtn.addEventListener('click', async () => {
          if (!state.isRecording) {
            try {
              const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
              state.recordedChunks = [];
              const mr = new MediaRecorder(stream);
              state.mediaRecorder = mr;
              mr.ondataavailable = (ev) => { if (ev.data.size) state.recordedChunks.push(ev.data); };
              mr.onstop = () => {
                stream.getTracks().forEach(t => t.stop());
                const blob = new Blob(state.recordedChunks, { type: 'audio/webm' });
                submitVoiceBlob(blob);
              };
              mr.start();
              state.isRecording = true;
              state.recordingSeconds = 0;
              recordingInterval = setInterval(() => { state.recordingSeconds += 1; render(); }, 1000);
              render();
            } catch (e) {
              showToast('Microphone permission denied');
            }
          } else {
            state.isRecording = false;
            if (recordingInterval) clearInterval(recordingInterval);
            if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') state.mediaRecorder.stop();
            render();
          }
        });
      }

      document.querySelectorAll('[data-date-choice-id]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const choiceId = btn.getAttribute('data-date-choice-id');
          try {
            const res = await api(`/api/v1/documents/${state.activeDocId}/resolve-choice`, {
              method: 'POST',
              body: { choice_id: choiceId }
            });
            state.selectedChoiceId = res.resolved_choice_id;
            state.draftDueDate = res.primary_date;
            render();
          } catch (e) {
            showToast(e.message || 'Could not resolve choice');
          }
        });
      });

      const titleIn = document.getElementById('draft-title-input');
      if (titleIn) titleIn.addEventListener('input', e => { state.draftTitle = e.target.value; });
      const issuerIn = document.getElementById('draft-issuer-input');
      if (issuerIn) issuerIn.addEventListener('input', e => { state.draftIssuer = e.target.value; });
      const catSel = document.getElementById('draft-category-select');
      if (catSel) catSel.addEventListener('change', e => { state.draftCategory = e.target.value; });
      const amtIn = document.getElementById('draft-amount-input');
      if (amtIn) amtIn.addEventListener('input', e => {
        state.draftAmount = e.target.value;
        state.draftAmountMinor = parseAmountToMinor(e.target.value);
      });
      const dueIn = document.getElementById('draft-duedate-input');
      if (dueIn) dueIn.addEventListener('change', async (e) => {
        state.draftDueDate = e.target.value;
        state.selectedChoiceId = 'manual';
        if (state.activeDocId && state.draftDueDate) {
          try {
            await api(`/api/v1/documents/${state.activeDocId}/resolve-choice`, {
              method: 'POST',
              body: { manual_iso_date: state.draftDueDate }
            });
          } catch (_) {}
        }
        render();
      });
      const leadSel = document.getElementById('draft-lead-select');
      if (leadSel) leadSel.addEventListener('change', e => {
        state.draftLeadDays = Number(e.target.value);
        state.draftReminderTiming = labelFromLeadDays(state.draftLeadDays);
      });

      const approveBtn = document.getElementById('approve-reminder-btn');
      if (approveBtn) {
        approveBtn.addEventListener('click', async () => {
          if (!state.activeDocId) return;
          state.busyAction = true;
          render();
          try {
            const body = {
              title: state.draftTitle || undefined,
              issuer: state.draftIssuer.trim(),
              category: state.draftCategory,
              amount_minor: state.draftAmountMinor,
              currency: state.draftCurrency || 'INR',
              primary_date: state.draftDueDate,
              lead_days: state.draftLeadDays
            };
            await api(`/api/v1/documents/${state.activeDocId}/approve`, { method: 'POST', body });
            showToast('Reminder approved');
            resetScanState();
            await loadRecords();
            state.busyAction = false;
            navigateTo('app', 'today');
          } catch (e) {
            state.busyAction = false;
            showToast(e.message || 'Approve failed');
            render();
          }
        });
      }

      const dismissBtn = document.getElementById('dismiss-scan-btn');
      if (dismissBtn) {
        dismissBtn.addEventListener('click', async () => {
          if (state.activeDocId) {
            try { await api(`/api/v1/documents/${state.activeDocId}/dismiss`, { method: 'POST', body: {} }); } catch (_) {}
          }
          resetScanState();
          render();
        });
      }

      // Vault
      const vaultSearch = document.getElementById('vault-search-input');
      if (vaultSearch) {
        vaultSearch.addEventListener('input', e => {
          state.vaultSearch = e.target.value;
          render();
          const refreshed = document.getElementById('vault-search-input');
          if (refreshed) { refreshed.focus(); refreshed.setSelectionRange(refreshed.value.length, refreshed.value.length); }
        });
      }
      document.querySelectorAll('[data-vault-filter]').forEach(btn => {
        btn.addEventListener('click', () => { state.vaultFilter = btn.getAttribute('data-vault-filter'); render(); });
      });
      document.querySelectorAll('[data-open-record-id]').forEach(btn => {
        btn.addEventListener('click', () => openRecordModal(btn.getAttribute('data-open-record-id')));
      });

      // Ask
      const askForm = document.getElementById('ask-loop-form');
      const askIn = document.getElementById('ask-loop-input');
      if (askIn) askIn.addEventListener('input', e => { state.askQuery = e.target.value; });
      if (askForm) askForm.addEventListener('submit', e => { e.preventDefault(); executeAsk(); });
      document.querySelectorAll('[data-ask-preset]').forEach(btn => {
        btn.addEventListener('click', () => executeAsk(btn.getAttribute('data-ask-preset')));
      });

      // Settings
      const signOutBtn = document.getElementById('sign-out-btn');
      if (signOutBtn) {
        signOutBtn.addEventListener('click', async () => {
          try { await api('/api/v1/auth/logout', { method: 'POST', body: {} }); } catch (_) {}
          applyUserFromApi(null);
          showToast('Signed out');
          navigateTo('landing');
        });
      }
      const saveCh = document.getElementById('save-channels-btn');
      if (saveCh) {
        saveCh.addEventListener('click', async () => {
          const email = document.getElementById('ch-email');
          const push = document.getElementById('ch-push');
          try {
            await api('/api/v1/settings', {
              method: 'PATCH',
              body: {
                channels: {
                  email_digest: email ? email.checked : true,
                  push_notifications: push ? push.checked : true
                }
              }
            });
            state.channels.emailDigest = email ? email.checked : true;
            state.channels.pushNotifications = push ? push.checked : true;
            showToast('Channels saved');
          } catch (e) {
            showToast(e.message || 'Save failed');
          }
        });
      }
      const exportBtn = document.getElementById('export-data-btn');
      if (exportBtn) {
        exportBtn.addEventListener('click', async () => {
          try {
            const blob = await api('/api/v1/account/export');
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `loop-archive-${new Date().toISOString().slice(0, 10)}.zip`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Archive exported');
          } catch (e) {
            showToast(e.message || 'Export failed');
          }
        });
      }
      const resetDemo = document.getElementById('reset-demo-data-btn');
      if (resetDemo) {
        resetDemo.addEventListener('click', async () => {
          try {
            await api('/api/v1/dev/reset-demo-data', { method: 'POST', body: {} });
            await loadRecords();
            showToast('Demo data reset');
            render();
          } catch (e) {
            showToast(e.message || 'Reset failed');
          }
        });
      }
    }

    // ------------------------------------------------------------------
    // MASTER RENDER
    // ------------------------------------------------------------------
    function render() {
      syncTheme();
      const root = document.getElementById('root-app');
      if (state.bootstrapping) {
        root.innerHTML = `<div class="min-h-screen flex items-center justify-center"><p class="neo-muted text-sm">Loading LOOP…</p></div>`;
        return;
      }
      if (state.route === 'landing') {
        root.innerHTML = renderLandingPage();
        bindLandingEvents();
      } else if (state.route === 'login') {
        root.innerHTML = renderAuthPage('login');
        bindAuthEvents('login');
      } else if (state.route === 'signup') {
        root.innerHTML = renderAuthPage('signup');
        bindAuthEvents('signup');
      } else if (state.route === 'permissions') {
        root.innerHTML = renderPermissionsPage();
        bindPermissionsEvents();
      } else {
        let tabHtml = '';
        if (state.appTab === 'today') tabHtml = renderTodayTab();
        else if (state.appTab === 'add') tabHtml = renderAddTab();
        else if (state.appTab === 'vault') tabHtml = renderVaultTab();
        else if (state.appTab === 'ask') tabHtml = renderAskTab();
        else if (state.appTab === 'settings') tabHtml = renderSettingsTab();
        root.innerHTML = renderDashboardShell(tabHtml);
        bindDashboardEvents();
      }
    }

    document.getElementById('modal-close-top').addEventListener('click', closeCertificateModal);
    document.getElementById('modal-close-bottom').addEventListener('click', closeCertificateModal);
    document.getElementById('certificate-modal').addEventListener('click', (e) => {
      if (e.target.id === 'certificate-modal') closeCertificateModal();
    });

    window.addEventListener('hashchange', () => {
      syncFromHash();
      render();
      if (state.route === 'app' && state.isAuthenticated) loadRecords().then(() => render());
    });

    // Boot
    (async function boot() {
      state.bootstrapping = true;
      render();
      await loadSession();
      syncFromHash();
      // If OAuth redirected to /#/app or /#/permissions, respect that
      if (state.isAuthenticated && state.permissionsGranted && (state.route === 'login' || state.route === 'signup' || state.route === 'landing')) {
        // stay on landing unless hash says otherwise — syncFromHash already handled
      }
      if (state.isAuthenticated && state.route === 'app') {
        await loadRecords();
      }
      state.bootstrapping = false;
      render();
    })();
  })();
  </script>
</body>
</html>
