<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOOP — Personal Archive &amp; Reminders</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      --bg-page: #0A1228;
      --text-primary: #EDEFF5;
      --text-muted: #9AA6C0;
      --panel-bg: rgba(16, 27, 58, 0.88);
      --panel-border: #26365F;
      --subpanel-bg: rgba(10, 18, 40, 0.86);
      --subpanel-border: #26365F;
      --brass-accent: #D4AE5E;
      --brass-soft: rgba(212, 174, 94, 0.14);
      --brass-border: rgba(212, 174, 94, 0.44);
      --verdigris: #6CCBB2;
      --verdigris-soft: rgba(108, 203, 178, 0.14);
      --input-bg: rgba(10, 18, 40, 0.94);
      --input-border: #26365F;
      --btn-primary-bg: #D4AE5E;
      --btn-primary-hover: #E0BE74;
      --btn-primary-text: #0A1228;
      --btn-secondary-bg: rgba(16, 27, 58, 0.88);
      --btn-secondary-text: #EDEFF5;
      --amber-card-bg: #271E12;
      --amber-card-border: #D4AE5E;
      --highlight-green-bg: rgba(22, 48, 43, 0.82);
      --highlight-green-border: #6CCBB2;
      --highlight-brass-bg: rgba(45, 34, 18, 0.9);
      --highlight-brass-border: #D4AE5E;
    }

    html.light {
      --bg-page: #ECEFF2;
      --text-primary: #101B33;
      --text-muted: #4E5B78;
      --panel-bg: rgba(255, 255, 255, 0.84);
      --panel-border: #CBD3E1;
      --subpanel-bg: rgba(246, 248, 250, 0.94);
      --subpanel-border: #CBD3E1;
      --brass-accent: #A67C2E;
      --brass-soft: rgba(166, 124, 46, 0.12);
      --brass-border: rgba(166, 124, 46, 0.45);
      --verdigris: #1E8A6E;
      --verdigris-soft: rgba(30, 138, 110, 0.12);
      --input-bg: rgba(255, 255, 255, 0.96);
      --input-border: #CBD3E1;
      --btn-primary-bg: #A67C2E;
      --btn-primary-hover: #8E6822;
      --btn-primary-text: #FFFFFF;
      --btn-secondary-bg: rgba(255, 255, 255, 0.94);
      --btn-secondary-text: #101B33;
      --amber-card-bg: #FDF6E7;
      --amber-card-border: #A67C2E;
      --highlight-green-bg: rgba(30, 138, 110, 0.11);
      --highlight-green-border: #1E8A6E;
      --highlight-brass-bg: #FDF6E7;
      --highlight-brass-border: #A67C2E;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
      background-color: var(--bg-page);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.22s ease, color 0.22s ease;
    }
    .font-serif-display { font-family: var(--font-serif); }
    .fluted-surface {
      background-image: repeating-linear-gradient(
        90deg, rgba(212,174,94,0.035) 0px, rgba(212,174,94,0.035) 1px,
        transparent 1px, transparent 18px, rgba(255,255,255,0.018) 18px,
        rgba(255,255,255,0.018) 28px, transparent 28px, transparent 44px
      );
    }
    html.light .fluted-surface {
      background-image: repeating-linear-gradient(
        90deg, rgba(166,124,46,0.045) 0px, rgba(166,124,46,0.045) 1px,
        transparent 1px, transparent 18px, rgba(16,27,51,0.025) 18px,
        rgba(16,27,51,0.025) 28px, transparent 28px, transparent 44px
      );
    }
    .fluted-navy-sidebar {
      background-color: #0A1228;
      background-image: repeating-linear-gradient(
        90deg, rgba(212,174,94,0.04) 0px, rgba(212,174,94,0.04) 1px,
        transparent 1px, transparent 18px, rgba(255,255,255,0.02) 18px,
        rgba(255,255,255,0.02) 28px, transparent 28px, transparent 44px
      );
    }
    .neo-panel {
      background-color: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
    }
    .neo-subpanel {
      background-color: var(--subpanel-bg);
      border: 1px solid var(--subpanel-border);
      border-radius: 12px;
    }
    .neo-muted { color: var(--text-muted); }
    .neo-brass-text { color: var(--brass-accent); }
    .neo-verdigris-text { color: var(--verdigris); }
    .neoclassical-arch { border-radius: 9999px 9999px 16px 16px; }
    .btn-primary {
      background-color: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, opacity 0.15s ease;
    }
    .btn-primary:hover:not(:disabled) { background-color: var(--btn-primary-hover); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-secondary {
      background-color: var(--btn-secondary-bg);
      color: var(--btn-secondary-text);
      border: 1px solid var(--input-border);
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }
    .btn-secondary:hover { border-color: var(--brass-accent); }
    .neo-input {
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-primary);
    }
    .neo-input::placeholder { color: var(--text-muted); opacity: 0.72; }
    @keyframes scanSweep {
      0% { top: 2%; opacity: 0.95; }
      95% { top: 96%; opacity: 0.95; }
      100% { top: 98%; opacity: 0; }
    }
    .scan-beam {
      position: absolute; left: 0; right: 0; z-index: 20; pointer-events: none;
      animation: scanSweep 2.2s linear infinite;
    }
  </style>
</head>
<body class="min-h-screen fluted-surface">
  <div id="root-app"></div>

  <!-- CERTIFICATE / SOURCE MODAL -->
  <div id="certificate-modal" role="dialog" aria-modal="true" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#0A1228]/75 backdrop-blur-sm">
    <div class="w-full max-w-xl neo-panel shadow-2xl overflow-hidden">
      <div class="pt-2 px-2"><div class="border-t-[4px] border-double" style="border-color: var(--brass-accent);"></div></div>
      <div class="px-6 py-4 border-b flex items-center justify-between gap-3" style="border-color: var(--panel-border);">
        <div>
          <h2 id="modal-title" class="font-serif-display text-2xl font-bold"></h2>
          <p id="modal-subtitle" class="text-xs mt-0.5 neo-muted"></p>
        </div>
        <button type="button" id="modal-close-top" class="p-2 rounded-lg btn-secondary text-xs">Close</button>
      </div>
      <div id="modal-body" class="p-6 space-y-4 max-h-[70vh] overflow-y-auto"></div>
      <div class="px-6 py-3.5 border-t flex items-center justify-between gap-3" style="border-color: var(--panel-border);">
        <span id="modal-footer-note" class="text-xs neo-muted"></span>
        <div class="flex items-center gap-2">
          <a id="modal-download-link" href="#" target="_blank" rel="noopener noreferrer" class="hidden px-3.5 py-2 rounded-[10px] text-xs btn-secondary">Download file</a>
          <button type="button" id="modal-close-bottom" class="px-4 py-2 rounded-[10px] text-xs btn-primary">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast-banner" role="status" aria-live="polite" class="hidden fixed bottom-5 right-5 z-50 flex items-center gap-2.5 px-4 py-3 rounded-[12px] bg-[#101B3A] border border-[#D4AE5E] text-[#EDEFF5] shadow-xl text-sm font-medium">
    <span id="toast-message"></span>
  </div>

  <script>
    (function () {
      'use strict';

      // ---------------- API CLIENT ----------------
      const API = (function () {
        function getCookie(name) {
          const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
          return m ? decodeURIComponent(m[1]) : '';
        }
        async function req(path, opts = {}) {
          const method = (opts.method || 'GET').toUpperCase();
          const isForm = typeof FormData !== 'undefined' && opts.body instanceof FormData;
          const headers = { ...(opts.headers || {}) };
          if (opts.body && !isForm && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
          if (!['GET', 'HEAD', 'OPTIONS'].includes(method)) headers['X-CSRF-Token'] = getCookie('loop_csrf');

          const res = await fetch(path, { ...opts, method, headers, credentials: 'same-origin' });
          if (res.status === 204) return null;
          if (opts.responseType === 'blob') {
            if (!res.ok) throw new Error('Download failed (' + res.status + ')');
            return res.blob();
          }
          const data = await res.json().catch(() => null);
          if (!res.ok) throw new Error((data && data.detail) || 'Request failed (' + res.status + ')');
          return data;
        }
        return {
          getMe: () => req('/api/v1/auth/me'),
          signup: (email, password, consent_accepted) => req('/api/v1/auth/signup', { method: 'POST', body: JSON.stringify({ email, password, consent_accepted }) }),
          login: (email, password) => req('/api/v1/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) }),
          devDemoSignIn: () => req('/api/v1/auth/dev-demo-signin', { method: 'POST' }),
          logout: () => req('/api/v1/auth/logout', { method: 'POST' }),
          updateSettings: (payload) => req('/api/v1/settings', { method: 'PATCH', body: JSON.stringify(payload) }),
          createUploadUrl: (filename, mime_type, size_bytes) => req('/api/v1/documents/upload-url', { method: 'POST', body: JSON.stringify({ filename, mime_type, size_bytes }) }),
          uploadToSignedUrl: async (url, file) => {
            const res = await fetch(url, { method: 'PUT', headers: { 'Content-Type': file.type }, body: file });
            if (!res.ok) throw new Error('File upload failed (' + res.status + ')');
          },
          confirmUpload: (docId) => req(`/api/v1/documents/${encodeURIComponent(docId)}/confirm-upload`, { method: 'POST' }),
          submitText: (text, title) => req('/api/v1/documents/text', { method: 'POST', body: JSON.stringify({ text, title: title || null }) }),
          getDocStatus: (docId) => req(`/api/v1/documents/${encodeURIComponent(docId)}/status`),
          getDocDraft: (docId) => req(`/api/v1/documents/${encodeURIComponent(docId)}/draft`),
          resolveChoice: (docId, payload) => req(`/api/v1/documents/${encodeURIComponent(docId)}/resolve-choice`, { method: 'POST', body: JSON.stringify(payload) }),
          approveDoc: (docId, payload) => req(`/api/v1/documents/${encodeURIComponent(docId)}/approve`, { method: 'POST', body: JSON.stringify(payload) }),
          dismissDoc: (docId) => req(`/api/v1/documents/${encodeURIComponent(docId)}/dismiss`, { method: 'POST' }),
          listRecords: (params = {}) => {
            const qs = new URLSearchParams();
            if (params.q) qs.set('q', params.q);
            if (params.category && params.category !== 'All') qs.set('category', params.category);
            return req('/api/v1/records' + (qs.toString() ? '?' + qs.toString() : ''));
          },
          getRecord: (id) => req(`/api/v1/records/${encodeURIComponent(id)}`),
          updateRecordStatus: (id, status) => req(`/api/v1/records/${encodeURIComponent(id)}/status`, { method: 'PATCH', body: JSON.stringify({ status }) }),
          deleteRecord: (id) => req(`/api/v1/records/${encodeURIComponent(id)}`, { method: 'DELETE' }),
          ask: (query) => req('/api/v1/ask', { method: 'POST', body: JSON.stringify({ query }) }),
          exportZip: () => req('/api/v1/account/export', { responseType: 'blob' }),
          deleteAccount: () => req('/api/v1/account', { method: 'DELETE', body: JSON.stringify({ confirm: 'DELETE' }) }),
        };
      })();

      // ---------------- STATE ----------------
      const state = {
        bootstrapping: true,
        route: 'landing',
        appTab: 'today',
        lightMode: false,
        mobileMenuOpen: false,

        isAuthenticated: false,
        devDemoEnabled: false,
        userName: '',
        userEmail: '',
        permissionsGranted: false,
        permissions: { documentAccess: true, notifications: true, microphone: false, leadDays: 2 },

        authEmail: '',
        authPassword: '',
        authConsent: false,
        authErrors: {},
        authBusy: false,

        landingAmbiguousChoice: null,
        openFaqIndex: 0,

        records: [],
        selectedRingItemId: null,

        addInputTab: 'file',
        pastedText: '',
        pastedTitle: '',
        uploadError: '',
        scanningDocId: null,
        scanStatusText: '',
        draft: null,
        draftIssuer: '',
        draftCategory: 'Bill',
        draftAmountMajor: '',
        draftDueDate: '',
        draftLeadDays: 2,
        approving: false,

        vaultSearch: '',
        vaultFilter: 'All',

        askQuery: '',
        askLoading: false,
        askResult: null,

        deleteConfirmText: '',
      };

      let toastTimer = null;

      // ---------------- HELPERS ----------------
      function escapeHtml(s) {
        return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }
      function showToast(msg) {
        const el = document.getElementById('toast-banner');
        document.getElementById('toast-message').textContent = msg;
        el.classList.remove('hidden');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.add('hidden'), 3800);
      }
      function syncTheme() {
        document.documentElement.classList.toggle('light', state.lightMode);
      }
      function logoSvg(cls = 'w-8 h-9') {
        return `<svg viewBox="0 0 36 42" fill="none" class="${cls} shrink-0"><path d="M3 39V17C3 8.71573 9.71573 2 18 2C26.2843 2 33 8.71573 33 17V39H3Z" stroke="var(--brass-accent)" stroke-width="2"/><path d="M9.5 39V17.5C9.5 12.8056 13.3056 9 18 9C22.6944 9 26.5 12.8056 26.5 17.5V39" stroke="var(--brass-accent)" stroke-width="1.35" stroke-opacity="0.85"/><circle cx="18" cy="17.5" r="2" fill="var(--brass-accent)"/></svg>`;
      }
      function formatAmount(minor, currency = 'INR') {
        if (minor === null || minor === undefined) return '—';
        const v = (minor / 100).toLocaleString('en-IN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
        return currency === 'INR' ? `₹${v}` : `${currency} ${v}`;
      }
      function formatDateDisplay(iso) {
        if (!iso) return '—';
        const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const p = iso.slice(0, 10).split('-').map(Number);
        if (p.length !== 3 || p.some(isNaN)) return iso;
        return `${p[2]} ${m[p[1] - 1]} ${p[0]}`;
      }
      function daysUntil(iso) {
        if (!iso) return 0;
        const p = iso.slice(0, 10).split('-').map(Number);
        const target = new Date(p[0], p[1] - 1, p[2]);
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        return Math.max(0, Math.round((target - today) / 86400000));
      }
      function normalizeRecord(r) {
        const primaryIso = (r.category === 'Booking' ? r.checkin_date : r.due_date) || (r.due_at ? r.due_at.slice(0, 10) : '');
        return {
          ...r,
          primaryIso,
          dueDateDisplay: formatDateDisplay(primaryIso),
          daysFromToday: daysUntil(primaryIso),
          amountDisplay: formatAmount(r.amount_minor, r.currency),
        };
      }
      function getActiveRecords() {
        return state.records.filter((r) => r.status !== 'paid').sort((a, b) => a.daysFromToday - b.daysFromToday);
      }
      function badgeHtml(cat) {
        if (cat === 'Bill') return `<span class="text-xs font-medium px-2.5 py-0.5 rounded-full border" style="background:var(--brass-soft);color:var(--brass-accent);border-color:var(--brass-border);">Bill</span>`;
        if (cat === 'Booking') return `<span class="text-xs font-medium px-2.5 py-0.5 rounded-full border" style="background:rgba(154,166,192,0.12);border-color:var(--panel-border);">Booking</span>`;
        return `<span class="text-xs font-medium px-2.5 py-0.5 rounded-full border" style="background:var(--verdigris-soft);color:var(--verdigris);border-color:var(--highlight-green-border);">${escapeHtml(cat)}</span>`;
      }

      // ---------------- ROUTING & BOOTSTRAP ----------------
      function navigateTo(route, tab) {
        if (tab) state.appTab = tab;
        if (route === 'app') {
          if (!state.isAuthenticated) route = 'login';
          else if (!state.permissionsGranted) route = 'permissions';
        }
        if (route === 'permissions' && !state.isAuthenticated) route = 'login';
        state.route = route;
        state.mobileMenuOpen = false;
        const map = { landing: '#/', login: '#/login', signup: '#/signup', permissions: '#/permissions', app: state.appTab === 'today' ? '#/app' : `#/app/${state.appTab}` };
        const nextHash = map[route] || '#/';
        if (location.hash !== nextHash) history.replaceState(null, '', nextHash);
        render();
        window.scrollTo({ top: 0, behavior: 'auto' });
      }

      function syncFromHash() {
        const raw = (location.hash || '#/').replace(/^#/, '');
        if (raw === '/signup') state.route = 'signup';
        else if (raw === '/login') state.route = 'login';
        else if (raw === '/permissions') state.route = state.isAuthenticated ? 'permissions' : 'login';
        else if (raw.startsWith('/app')) {
          const sub = raw.split('/')[2] || 'today';
          if (['today', 'add', 'vault', 'ask', 'settings'].includes(sub)) state.appTab = sub;
          state.route = !state.isAuthenticated ? 'login' : !state.permissionsGranted ? 'permissions' : 'app';
        } else {
          state.route = 'landing';
        }
      }

      async function loadRecords() {
        const data = await API.listRecords();
        state.records = (data.items || []).map(normalizeRecord);
        const active = getActiveRecords();
        if (!active.find((r) => r.id === state.selectedRingItemId)) {
          state.selectedRingItemId = active[0] ? active[0].id : null;
        }
      }

      async function bootstrap() {
        try {
          const me = await API.getMe();
          state.devDemoEnabled = Boolean(me.dev_demo_enabled);
          if (me.authenticated && me.user) {
            state.isAuthenticated = true;
            state.userEmail = me.user.email;
            state.userName = me.user.name || me.user.email;
            state.permissionsGranted = Boolean(me.user.permissions_granted);
            if (me.settings && me.settings.permissions) {
              state.permissions = {
                documentAccess: me.settings.permissions.document_access,
                notifications: me.settings.permissions.notifications,
                microphone: me.settings.permissions.microphone,
                leadDays: me.settings.permissions.lead_days || 2,
              };
              state.draftLeadDays = state.permissions.leadDays;
            }
            await loadRecords();
          } else {
            state.isAuthenticated = false;
            state.permissionsGranted = false;
          }
        } catch (err) {
          showToast(err.message);
        } finally {
          state.bootstrapping = false;
          syncFromHash();
          if (state.isAuthenticated && (state.route === 'login' || state.route === 'signup')) {
            navigateTo(state.permissionsGranted ? 'app' : 'permissions', 'today');
            return;
          }
          render();
        }
      }

      // ---------------- LANDING PAGE ----------------
      function renderLanding() {
        const faqs = [
          { q: 'What files can I save to LOOP?', a: 'Upload PDF bills, JPG/PNG receipts, or paste raw email/SMS text. LOOP extracts dates and amounts for your review.' },
          { q: 'Does LOOP create reminders automatically?', a: 'Never. Every extracted date and amount is shown for your approval first, and ambiguous dates like 03/12/2026 ask you to choose.' },
          { q: 'Can I export or permanently delete my data?', a: 'Yes. Download a full ZIP archive (records + original files) or permanently delete your account anytime from Settings.' }
        ];
        const brass = state.lightMode ? '#A67C2E' : '#D4AE5E';
        const verdigris = state.lightMode ? '#1E8A6E' : '#6CCBB2';
        const borderSubtle = state.lightMode ? '#CBD3E1' : '#26365F';
        const bgRing = state.lightMode ? '#FFFFFF' : '#0A1228';

        let ticks = '';
        for (let d = 0; d < 30; d++) {
          const rad = ((-90 + d * 12) * Math.PI) / 180;
          const major = d % 7 === 0;
          const r1 = major ? 79 : 83;
          ticks += `<line x1="${(130 + r1 * Math.cos(rad)).toFixed(1)}" y1="${(130 + r1 * Math.sin(rad)).toFixed(1)}" x2="${(130 + 90 * Math.cos(rad)).toFixed(1)}" y2="${(130 + 90 * Math.sin(rad)).toFixed(1)}" stroke="${major ? brass : borderSubtle}" stroke-width="${major ? 1.8 : 1}"/>`;
        }

        return `
          <div class="min-h-screen">
            <header class="sticky top-0 z-40 backdrop-blur-md border-b" style="background:var(--panel-bg);border-color:var(--panel-border);">
              <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
                <button type="button" data-go-route="landing" class="flex items-center gap-3 cursor-pointer">
                  ${logoSvg('w-7 h-8')}
                  <span class="font-serif-display font-bold text-xl tracking-[0.14em]">LOOP</span>
                </button>
                <div class="flex items-center gap-3">
                  <button type="button" id="landing-theme-btn" class="px-3 py-1.5 rounded-xl text-xs btn-secondary">${state.lightMode ? 'Dark' : 'Light'}</button>
                  ${
                    state.isAuthenticated
                      ? `<button type="button" data-go-route="app" class="px-4 py-2 text-sm rounded-xl btn-primary">Open dashboard</button>`
                      : `<button type="button" data-go-route="login" class="px-3.5 py-2 text-sm font-medium rounded-xl cursor-pointer">Log in</button>
                         <button type="button" data-go-route="signup" class="px-4 py-2 text-sm rounded-xl btn-primary">Start free</button>`
                  }
                </div>
              </div>
            </header>

            <section class="pt-14 pb-16 px-4 sm:px-6 max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
              <div class="lg:col-span-7 space-y-6">
                <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full border text-xs font-medium" style="background:var(--panel-bg);border-color:var(--brass-border);">
                  <span class="w-2 h-2 rounded-full" style="background:var(--verdigris);"></span>
                  <span>Personal archive &amp; user-approved reminders</span>
                </div>
                <h1 class="font-serif-display text-4xl sm:text-5xl lg:text-[56px] font-bold leading-[1.08]">
                  Save the bill. LOOP finds the due date.
                </h1>

      // ---------------- PERMISSIONS PAGE ----------------

      // ---------------- DASHBOARD TABS ----------------
      function renderTodayTab() {
        const active = getActiveRecords();
        const within30 = active.filter((r) => r.daysFromToday <= 30);
        const sel = active.find((r) => r.id === state.selectedRingItemId) || active[0] || null;
        if (sel) state.selectedRingItemId = sel.id;

        const brass = state.lightMode ? '#A67C2E' : '#D4AE5E';
        const verdigris = state.lightMode ? '#1E8A6E' : '#6CCBB2';
        const track = state.lightMode ? '#CBD3E1' : '#26365F';
        const bg = state.lightMode ? '#FFFFFF' : '#0A1228';

        let ticks = '';
        for (let d = 0; d < 30; d++) {
          const rad = ((-90 + d * 12) * Math.PI) / 180;
          const r1 = d % 7 === 0 ? 109 : 114;
          ticks += `<line x1="${(160 + r1 * Math.cos(rad)).toFixed(1)}" y1="${(160 + r1 * Math.sin(rad)).toFixed(1)}" x2="${(160 + 120 * Math.cos(rad)).toFixed(1)}" y2="${(160 + 120 * Math.sin(rad)).toFixed(1)}" stroke="${d % 7 === 0 ? brass : track}" stroke-width="${d % 7 === 0 ? 1.8 : 1}"/>`;
        }
        const markers = within30.map((item) => {
          const rad = ((-90 + item.daysFromToday * 12) * Math.PI) / 180;
          const mx = (160 + 120 * Math.cos(rad)).toFixed(1);
          const my = (160 + 120 * Math.sin(rad)).toFixed(1);
          const isSel = sel && sel.id === item.id;
          return `<g data-select-id="${item.id}" class="cursor-pointer">${isSel ? `<circle cx="${mx}" cy="${my}" r="14" fill="${brass}" fill-opacity="0.2"/>` : ''}<circle cx="${mx}" cy="${my}" r="${isSel ? 7.5 : 5.5}" fill="${brass}" stroke="${bg}" stroke-width="1.8"/></g>`;
        }).join('');

        return `
          <section class="space-y-6">
            <div class="flex flex-wrap items-end justify-between gap-4">
              <div>
                <h1 class="font-serif-display text-3xl sm:text-4xl font-bold">Today</h1>
                <p class="text-sm neo-muted mt-1">Your approved bills and bookings on a 30-day dial.</p>
              </div>
              <button type="button" data-app-tab="add" class="px-4 py-2.5 rounded-[10px] text-sm btn-primary">+ Add document</button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              <div class="lg:col-span-5 p-6 neo-panel flex flex-col items-center">
                <div class="w-full flex justify-between text-sm font-serif-display font-bold mb-2">
                  <span>Next 30 days · ${within30.length} on ring</span>
                </div>
                <div class="relative w-full max-w-[300px] aspect-square flex items-center justify-center">
                  <svg viewBox="0 0 320 320" class="w-full h-full">
                    <circle cx="160" cy="160" r="132" fill="none" stroke="${track}" stroke-width="1"/>
                    <circle cx="160" cy="160" r="120" fill="none" stroke="${track}" stroke-width="1.8"/>
                    ${ticks}
                    <circle cx="160" cy="40" r="6" fill="${verdigris}" stroke="${bg}" stroke-width="1.8"/>
                    <text x="160" y="26" text-anchor="middle" fill="${verdigris}" font-size="11" font-weight="600">Today</text>
                    ${markers}
                  </svg>
                  <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-12 pointer-events-none">
                    ${sel ? `
                      <span class="font-serif-display text-6xl font-bold leading-none">${sel.daysFromToday}</span>
                      <span class="text-xs neo-muted mt-1">${sel.daysFromToday === 1 ? 'day left' : 'days left'}</span>
                      <p class="font-serif-display text-lg font-bold leading-tight mt-2">${escapeHtml(sel.title)}</p>
                      <span class="text-xs neo-brass-text mt-1">${escapeHtml(sel.dueDateDisplay)} · ${escapeHtml(sel.amountDisplay)}</span>
                    ` : `<p class="font-serif-display text-xl font-bold">All caught up</p>`}
                  </div>
                </div>
                ${sel ? `<button type="button" id="mark-paid-btn" data-id="${escapeHtml(sel.id)}" class="mt-3 px-4 py-2 rounded-[10px] text-xs btn-secondary">Mark as paid</button>` : ''}
              </div>

              <div class="lg:col-span-7 p-6 neo-panel space-y-3">
                <h2 class="font-serif-display text-2xl font-bold">Coming up</h2>
                ${active.length === 0 ? `
                  <div class="py-10 text-center space-y-2">
                    <p class="font-serif-display text-xl font-bold">Nothing coming up yet</p>
                    <p class="text-sm neo-muted">Upload a bill PDF or paste text to approve your first reminder.</p>
                  </div>
                ` : active.map((item) => `
                  <div data-select-id="${item.id}" class="p-4 neo-subpanel cursor-pointer flex items-center justify-between gap-4" style="${sel && sel.id === item.id ? 'border-color:var(--brass-accent);' : ''}">
                    <div class="flex items-center gap-4 min-w-0">
                      <div class="w-14 text-center pr-3 border-r" style="border-color:var(--panel-border);">
                        <span class="font-serif-display text-3xl font-bold block leading-none neo-brass-text">${item.daysFromToday}d</span>
                        <span class="text-[11px] neo-muted">${escapeHtml(item.dueDateDisplay.slice(0, 6))}</span>
                      </div>
                      <div class="min-w-0">
                        <div class="flex flex-wrap items-center gap-2">
                          <h3 class="font-semibold text-sm truncate">${escapeHtml(item.title)}</h3>
                          ${badgeHtml(item.category)}
                        </div>
                        <p class="text-xs neo-muted mt-1">${escapeHtml(item.issuer)} • <strong>${escapeHtml(item.amountDisplay)}</strong></p>
                      </div>
                    </div>
                    <span class="text-xs px-2.5 py-1 rounded-full border shrink-0" style="background:var(--highlight-green-bg);color:var(--verdigris);border-color:var(--highlight-green-border);">Confirmed</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </section>
        `;
      }

      function renderAddTab() {
        if (state.scanningDocId && !state.draft) {
          return `
            <section class="max-w-xl mx-auto p-8 neo-panel text-center space-y-4 relative overflow-hidden">

        if (state.draft) {
          const d = state.draft;
          const needsChoice = (d.choices || []).length > 0 && !d.resolved_choice_id;

          return `

              <div>

                <div class="lg:col-span-6 space-y-4">
                  ${needsChoice ? `
                    <div class="p-5 rounded-[14px] border-2 space-y-3" style="background:var(--amber-card-bg);border-color:var(--amber-card-border);">

                      </div>
                    </div>
                  ` : ''}

                  <div class="p-6 neo-panel space-y-4">
                    <div>
                      <label class="block text-xs neo-muted mb-1">Issuer</label>
                      <input id="draft-issuer" type="text" value="${escapeHtml(state.draftIssuer)}" class="w-full px-3 py-2 rounded-[10px] text-sm neo-input"/>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                      <div>
                        <label class="block text-xs neo-muted mb-1">Category</label>
                        <select id="draft-cat" class="w-full px-3 py-2 rounded-[10px] text-sm neo-input">
                          <option value="Bill" ${state.draftCategory === 'Bill' ? 'selected' : ''}>Bill</option>
                          <option value="Booking" ${state.draftCategory === 'Booking' ? 'selected' : ''}>Booking</option>
                        </select>
                      </div>
                      <div>
                        <label class="block text-xs neo-muted mb-1">Amount (₹)</label>
                        <input id="draft-amt" type="number" step="0.01" min="0" value="${escapeHtml(state.draftAmountMajor)}" class="w-full px-3 py-2 rounded-[10px] text-sm neo-input"/>
                      </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                      <div>
                        <label class="block text-xs neo-muted mb-1">Due / Check-in Date</label>
                        <input id="draft-date" type="date" value="${escapeHtml(state.draftDueDate)}" class="w-full px-3 py-2 rounded-[10px] text-sm neo-input"/>
                      </div>
                      <div>
                        <label class="block text-xs neo-muted mb-1">Remind me</label>
                        <select id="draft-lead" class="w-full px-3 py-2 rounded-[10px] text-sm neo-input">
                          ${[1, 2, 3, 7].map((n) => `<option value="${n}" ${state.draftLeadDays === n ? 'selected' : ''}>${n} day${n > 1 ? 's' : ''} before</option>`).join('')}
                        </select>
                      </div>
                    </div>
                    <button type="button" id="approve-btn" ${canApprove ? '' : 'disabled'} class="w-full py-2.5 rounded-[10px] text-sm btn-primary">
                      ${state.approving ? 'Approving…' : 'Approve & schedule reminder'}
                    </button>
                    <button type="button" id="dismiss-btn" class="w-full py-2 rounded-[10px] text-sm btn-secondary">Dismiss</button>
                  </div>
                </div>

        return `

              <div class="p-6 neo-panel space-y-4">
                <div class="flex justify-between items-center">
                  <label class="text-sm font-medium">Paste bill or booking text</label>
                  <button type="button" id="fill-sample-text" class="text-xs underline neo-brass-text cursor-pointer">Fill ambiguous sample bill</button>

      // ---------------- ASYNC WORKFLOWS ----------------
      async function pollDocument(docId) {
        state.scanningDocId = docId;
        state.draft = null;
        state.uploadError = '';
        render();
        for (let i = 0; i < 45; i++) {
          const st = await API.getDocStatus(docId);
          state.scanStatusText = `Stage: ${st.status}…`;
          if (st.status === 'needs_review') {
            const draft = await API.getDocDraft(docId);
            state.draft = draft;
            state.draftIssuer = draft.issuer || '';
            state.draftCategory = draft.category || 'Bill';
            state.draftAmountMajor = draft.amount_minor != null ? (draft.amount_minor / 100).toFixed(2) : '';
            state.draftDueDate = (draft.category === 'Booking' ? draft.dates?.checkin_date : draft.dates?.due_date) || '';
            state.draftLeadDays = draft.default_lead_days || 2;
            render();
            return;
          }
          if (st.status === 'failed') {
            state.scanningDocId = null;
            state.uploadError = `Extraction failed (${st.error_code || 'error'}). Try pasting the text instead.`;
            render();
            return;
          }
          render();
          await new Promise((r) => setTimeout(r, 1500));
        }
        state.scanningDocId = null;
        state.uploadError = 'Processing timed out. Please try again.';
        render();
      }

      async function openRecordModal(id) {
        try {
          const rec = normalizeRecord(await API.getRecord(id));
          document.getElementById('modal-title').textContent = rec.title;
          document.getElementById('modal-subtitle').textContent = `${rec.category} • ${rec.issuer}`;
          document.getElementById('modal-footer-note').textContent = `Due ${rec.dueDateDisplay} · ${rec.amountDisplay}`;
          const dl = document.getElementById('modal-download-link');
          if (rec.original_file_url) {
            dl.href = rec.original_file_url;
            dl.classList.remove('hidden');
          } else {
            dl.classList.add('hidden');
          }
          document.getElementById('modal-body').innerHTML = `
            <p class="text-sm neo-muted">${escapeHtml(rec.summary_snippet || '')}</p>
            ${(rec.evidence_fields || []).map((f) => `
              <div class="p-3.5 rounded-[10px] border" style="background:var(--highlight-green-bg);border-color:var(--highlight-green-border);">
                <span class="block text-xs neo-muted">${escapeHtml(f.label)}</span>
                <p class="text-sm font-medium">${escapeHtml(f.evidence ? f.evidence.snippet : f.value)}</p>
              </div>
            `).join('')}
          `;
          document.getElementById('certificate-modal').classList.remove('hidden');
        } catch (err) {
          showToast(err.message);
        }
      }

      // ---------------- EVENT BINDING ----------------
      function bindEvents() {
        document.querySelectorAll('[data-go-route]').forEach((b) => b.addEventListener('click', () => navigateTo(b.dataset.goRoute)));
        document.querySelectorAll('[data-app-tab]').forEach((b) => b.addEventListener('click', () => navigateTo('app', b.dataset.appTab)));

        const lt = document.getElementById('landing-theme-btn');
        if (lt) lt.addEventListener('click', () => { state.lightMode = !state.lightMode; render(); });
        const dt = document.getElementById('dash-theme-btn');
        if (dt) dt.addEventListener('click', () => { state.lightMode = !state.lightMode; render(); });
        const mm = document.getElementById('mobile-menu-btn');
        if (mm) mm.addEventListener('click', () => { state.mobileMenuOpen = !state.mobileMenuOpen; render(); });

        document.querySelectorAll('[data-ambiguous-pick]').forEach((b) => b.addEventListener('click', () => { state.landingAmbiguousChoice = b.dataset.ambiguousPick; render(); }));
        document.querySelectorAll('[data-faq-idx]').forEach((b) => b.addEventListener('click', () => { const i = Number(b.dataset.faqIdx); state.openFaqIndex = state.openFaqIndex === i ? null : i; render(); }));

        // Auth form
        const authForm = document.getElementById('auth-form');
        if (authForm) {
          document.getElementById('auth-email').addEventListener('input', (e) => { state.authEmail = e.target.value; });
          document.getElementById('auth-password').addEventListener('input', (e) => { state.authPassword = e.target.value; });
          const c = document.getElementById('auth-consent');
          if (c) c.addEventListener('change', (e) => { state.authConsent = e.target.checked; });
          authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            state.authBusy = true;
            state.authErrors = {};
            render();
            try {
              if (state.route === 'signup') {
                const res = await API.signup(state.authEmail.trim(), state.authPassword, state.authConsent);
                if (res.email_confirmation_required) {
                  showToast(res.message || 'Check your email to confirm, then log in.');
                  state.authBusy = false;
                  navigateTo('login');
                  return;
                }
              } else {
                await API.login(state.authEmail.trim(), state.authPassword);
              }
              state.authBusy = false;
              await bootstrap();
            } catch (err) {
              state.authBusy = false;
              state.authErrors = { form: err.message };
              render();
            }
          });
        }
        const demoBtn = document.getElementById('dev-demo-btn');
        if (demoBtn) demoBtn.addEventListener('click', async () => { try { await API.devDemoSignIn(); await bootstrap(); } catch (err) { showToast(err.message); } });

        // Permissions
        const permDoc = document.getElementById('perm-doc');
        if (permDoc) permDoc.addEventListener('change', (e) => { state.permissions.documentAccess = e.target.checked; render(); });
        const permNotif = document.getElementById('perm-notif');
        if (permNotif) permNotif.addEventListener('change', (e) => { state.permissions.notifications = e.target.checked; });
        document.querySelectorAll('[data-perm-lead]').forEach((b) => b.addEventListener('click', () => { state.permissions.leadDays = Number(b.dataset.permLead); render(); }));
        const confirmPerms = document.getElementById('confirm-perms-btn');
        if (confirmPerms) {
          confirmPerms.addEventListener('click', async () => {
            try {
              await API.updateSettings({
                complete_onboarding: true,
                permissions: {
                  document_access: state.permissions.documentAccess,
                  notifications: state.permissions.notifications,
                  lead_days: state.permissions.leadDays,
                },
              });
              state.permissionsGranted = true;
              showToast('Permissions saved');
              navigateTo('app', 'today');
            } catch (err) { showToast(err.message); }
          });
        }

        // Today
        document.querySelectorAll('[data-select-id]').forEach((el) => el.addEventListener('click', () => { state.selectedRingItemId = el.dataset.selectId; render(); }));
        const markPaid = document.getElementById('mark-paid-btn');
        if (markPaid) {
          markPaid.addEventListener('click', async () => {
            try {
              await API.updateRecordStatus(markPaid.dataset.id, 'paid');
              await loadRecords();
              showToast('Marked as paid');
              render();
            } catch (err) { showToast(err.message); }
          });
        }

        // Add & Review
        document.querySelectorAll('[data-add-tab]').forEach((b) => b.addEventListener('click', () => { state.addInputTab = b.dataset.addTab; render(); }));
        const pickFile = document.getElementById('pick-file-btn');
        const fileIn = document.getElementById('file-input');
        if (pickFile && fileIn) {
          pickFile.addEventListener('click', () => fileIn.click());
          fileIn.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            try {
              const init = await API.createUploadUrl(file.name, file.type, file.size);
              await API.uploadToSignedUrl(init.upload_url, file);
              await API.confirmUpload(init.doc_id);
              await pollDocument(init.doc_id);
            } catch (err) { state.uploadError = err.message; render(); }
          });
        }
        const fillSample = document.getElementById('fill-sample-text');
        if (fillSample) fillSample.addEventListener('click', () => {
          state.pastedTitle = 'BESCOM Electricity Bill';
          state.pastedText = 'BESCOM Electricity Supply — Account ID: 849201742. Amount Due: INR 3420.00. Due Date: 03/12/2026.';
          render();
        });
        const pt = document.getElementById('paste-title');
        if (pt) pt.addEventListener('input', (e) => { state.pastedTitle = e.target.value; });
        const px = document.getElementById('paste-text');
        if (px) px.addEventListener('input', (e) => { state.pastedText = e.target.value; });
        const scanTxt = document.getElementById('scan-text-btn');
        if (scanTxt) {
          scanTxt.addEventListener('click', async () => {
            if (state.pastedText.trim().length < 8) { state.uploadError = 'Paste at least 8 characters.'; render(); return; }
            try {
              const res = await API.submitText(state.pastedText.trim(), state.pastedTitle.trim());
              await pollDocument(res.doc_id);
            } catch (err) { state.uploadError = err.message; render(); }
          });
        }

        document.querySelectorAll('[data-choice-id]').forEach((b) => b.addEventListener('click', async () => {
          try {
            const res = await API.resolveChoice(state.scanningDocId, { choice_id: b.dataset.choiceId });
            state.draft = await API.getDocDraft(state.scanningDocId);
            state.draftDueDate = res.primary_date || state.draftDueDate;
            showToast('Date choice saved');
            render();
          } catch (err) { showToast(err.message); }
        }));

        const di = document.getElementById('draft-issuer'); if (di) di.addEventListener('input', (e) => { state.draftIssuer = e.target.value; });
        const dc = document.getElementById('draft-cat'); if (dc) dc.addEventListener('change', (e) => { state.draftCategory = e.target.value; });
        const da = document.getElementById('draft-amt'); if (da) da.addEventListener('input', (e) => { state.draftAmountMajor = e.target.value; });
        const dd = document.getElementById('draft-date'); if (dd) dd.addEventListener('change', (e) => { state.draftDueDate = e.target.value; render(); });
        const dl = document.getElementById('draft-lead'); if (dl) dl.addEventListener('change', (e) => { state.draftLeadDays = Number(e.target.value); });

        const approveBtn = document.getElementById('approve-btn');
        if (approveBtn) {
          approveBtn.addEventListener('click', async () => {
            state.approving = true; render();
            try {
              const amtMinor = state.draftAmountMajor === '' ? null : Math.round(Number(state.draftAmountMajor) * 100);
              await API.approveDoc(state.scanningDocId, {
                issuer: state.draftIssuer.trim(),
                category: state.draftCategory,
                amount_minor: amtMinor,
                currency: state.draft.currency || 'INR',
                primary_date: state.draftDueDate,
                lead_days: state.draftLeadDays,
              });
              state.scanningDocId = null;
              state.draft = null;
              state.approving = false;
              await loadRecords();
              showToast('Reminder approved & scheduled');
              navigateTo('app', 'today');
            } catch (err) {
              state.approving = false;
              showToast(err.message);
              render();
            }
          });
        }
        const dismissBtn = document.getElementById('dismiss-btn');
        if (dismissBtn) dismissBtn.addEventListener('click', async () => {
          try { await API.dismissDoc(state.scanningDocId); } catch (_e) {}
          state.scanningDocId = null; state.draft = null; render();
        });

        // Vault
        const vs = document.getElementById('vault-search');
        if (vs) vs.addEventListener('input', (e) => { state.vaultSearch = e.target.value; render(); const el = document.getElementById('vault-search'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); } });
        document.querySelectorAll('[data-vfilter]').forEach((b) => b.addEventListener('click', () => { state.vaultFilter = b.dataset.vfilter; render(); }));
        document.querySelectorAll('[data-open-rec]').forEach((b) => b.addEventListener('click', () => openRecordModal(b.dataset.openRec)));
        document.querySelectorAll('[data-del-rec]').forEach((b) => b.addEventListener('click', async () => {
          try { await API.deleteRecord(b.dataset.delRec); await loadRecords(); showToast('Record deleted'); render(); } catch (err) { showToast(err.message); }
        }));

        // Ask
        const ai = document.getElementById('ask-input'); if (ai) ai.addEventListener('input', (e) => { state.askQuery = e.target.value; });
        const af = document.getElementById('ask-form');
        if (af) af.addEventListener('submit', async (e) => {
          e.preventDefault();
          if (!state.askQuery.trim()) return;
          state.askLoading = true; render();
          try { state.askResult = await API.ask(state.askQuery.trim()); } catch (err) { showToast(err.message); }
          state.askLoading = false; render();
        });

        // Settings
        const so = document.getElementById('signout-btn');
        if (so) so.addEventListener('click', async () => { await API.logout(); state.isAuthenticated = false; state.records = []; navigateTo('landing'); });
        const ez = document.getElementById('export-zip-btn');
        if (ez) ez.addEventListener('click', async () => {
          try {
            const blob = await API.exportZip();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'loop-archive.zip'; a.click(); URL.revokeObjectURL(url);
            showToast('ZIP archive downloaded');
          } catch (err) { showToast(err.message); }
        });
        const dci = document.getElementById('del-confirm-input'); if (dci) dci.addEventListener('input', (e) => { state.deleteConfirmText = e.target.value; });
        const dab = document.getElementById('del-account-btn');
        if (dab) dab.addEventListener('click', async () => {
          if (state.deleteConfirmText.trim() !== 'DELETE') return showToast('Type DELETE to confirm');
          try { await API.deleteAccount(); state.isAuthenticated = false; state.records = []; showToast('Account deleted'); navigateTo('landing'); } catch (err) { showToast(err.message); }
        });
      }

      // ---------------- MASTER RENDER ----------------
      function render() {
        syncTheme();
        const root = document.getElementById('root-app');
        if (state.bootstrapping) {
          root.innerHTML = `<div class="min-h-screen flex items-center justify-center text-sm neo-muted">Loading LOOP…</div>`;
          return;
        }
        if (state.route === 'landing') root.innerHTML = renderLanding();
        else if (state.route === 'login') root.innerHTML = renderAuth('login');
        else if (state.route === 'signup') root.innerHTML = renderAuth('signup');
        else if (state.route === 'permissions') root.innerHTML = renderPermissions();
        else {
          const inner =
            state.appTab === 'today' ? renderTodayTab() :
            state.appTab === 'add' ? renderAddTab() :
            state.appTab === 'vault' ? renderVaultTab() :
            state.appTab === 'ask' ? renderAskTab() : renderSettingsTab();
          root.innerHTML = renderShell(inner);
        }
        bindEvents();
      }

      document.getElementById('modal-close-top').addEventListener('click', () => document.getElementById('certificate-modal').classList.add('hidden'));
      document.getElementById('modal-close-bottom').addEventListener('click', () => document.getElementById('certificate-modal').classList.add('hidden'));
      window.addEventListener('hashchange', () => { syncFromHash(); render(); });

      bootstrap();
    })();
