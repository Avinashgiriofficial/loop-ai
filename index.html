<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOOP — Personal Archive &amp; Reminders</title>

  <!-- Google Fonts: Cormorant Garamond (600/700) & Hanken Grotesk (400/500/600/700) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase JS Client (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Your 3-line public config file -->
  <script src="./config.js"></script>

  <style>
    :root {
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;

      /* Dark-first Neoclassical Navy & Antique Brass */
      --bg-page: #0A1228;
      --text-primary: #EDEFF5;
      --text-muted: #9AA6C0;
      --panel-bg: rgba(16, 27, 58, 0.88);
      --panel-border: #26365F;
      --subpanel-bg: rgba(10, 18, 40, 0.86);
      --subpanel-border: #26365F;
      --brass-accent: #D4AE5E;
      --brass-soft: rgba(212, 174, 94, 0.14);
      --brass-border: rgba(212, 174, 94, 0.44);
      --verdigris: #6CCBB2;
      --verdigris-soft: rgba(108, 203, 178, 0.14);
      --input-bg: rgba(10, 18, 40, 0.94);
      --input-border: #26365F;
      --btn-primary-bg: #D4AE5E;
      --btn-primary-hover: #E0BE74;
      --btn-primary-text: #0A1228;
      --btn-secondary-bg: rgba(16, 27, 58, 0.88);
      --btn-secondary-text: #EDEFF5;
      --amber-card-bg: #271E12;
      --amber-card-border: #D4AE5E;
      --highlight-green-bg: rgba(22, 48, 43, 0.82);
      --highlight-green-border: #6CCBB2;
      --highlight-brass-bg: rgba(45, 34, 18, 0.9);
      --highlight-brass-border: #D4AE5E;
      --danger-border: rgba(248, 113, 113, 0.55);
      --danger-bg: rgba(127, 29, 29, 0.25);
      --danger-text: #FCA5A5;
    }

    html.light {
      /* Light Marble & Antique Brass */
      --bg-page: #ECEFF2;
      --text-primary: #101B33;
      --text-muted: #4E5B78;
      --panel-bg: rgba(255, 255, 255, 0.84);
      --panel-border: #CBD3E1;
      --subpanel-bg: rgba(246, 248, 250, 0.94);
      --subpanel-border: #CBD3E1;
      --brass-accent: #A67C2E;
      --brass-soft: rgba(166, 124, 46, 0.12);
      --brass-border: rgba(166, 124, 46, 0.45);
      --verdigris: #1E8A6E;
      --verdigris-soft: rgba(30, 138, 110, 0.12);
      --input-bg: rgba(255, 255, 255, 0.96);
      --input-border: #CBD3E1;
      --btn-primary-bg: #A67C2E;
      --btn-primary-hover: #8E6822;
      --btn-primary-text: #FFFFFF;
      --btn-secondary-bg: rgba(255, 255, 255, 0.94);
      --btn-secondary-text: #101B33;
      --amber-card-bg: #FDF6E7;
      --amber-card-border: #A67C2E;
      --highlight-green-bg: rgba(30, 138, 110, 0.11);
      --highlight-green-border: #1E8A6E;
      --highlight-brass-bg: #FDF6E7;
      --highlight-brass-border: #A67C2E;
      --danger-border: rgba(220, 38, 38, 0.45);
      --danger-bg: rgba(254, 226, 226, 0.65);
      --danger-text: #991B1B;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
      background-color: var(--bg-page);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.22s ease, color 0.22s ease;
    }

    .font-serif-display { font-family: var(--font-serif); }

    .fluted-surface {
      background-image: repeating-linear-gradient(
        90deg,
        rgba(212, 174, 94, 0.035) 0px,
        rgba(212, 174, 94, 0.035) 1px,
        transparent 1px,
        transparent 18px,
        rgba(255, 255, 255, 0.018) 18px,
        rgba(255, 255, 255, 0.018) 28px,
        transparent 28px,
        transparent 44px
      );
    }

    html.light .fluted-surface {
      background-image: repeating-linear-gradient(
        90deg,
        rgba(166, 124, 46, 0.045) 0px,
        rgba(166, 124, 46, 0.045) 1px,
        transparent 1px,
        transparent 18px,
        rgba(16, 27, 51, 0.025) 18px,
        rgba(16, 27, 51, 0.025) 28px,
        transparent 28px,
        transparent 44px
      );
    }

    .fluted-navy-sidebar {
      background-color: #0A1228;
      background-image: repeating-linear-gradient(
        90deg,
        rgba(212, 174, 94, 0.04) 0px,
        rgba(212, 174, 94, 0.04) 1px,
        transparent 1px,
        transparent 18px,
        rgba(255, 255, 255, 0.02) 18px,
        rgba(255, 255, 255, 0.02) 28px,
        transparent 28px,
        transparent 44px
      );
    }

    .neo-panel {
      background-color: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
    }

    .neo-subpanel {
      background-color: var(--subpanel-bg);
      border: 1px solid var(--subpanel-border);
      border-radius: 12px;
    }

    .neo-muted { color: var(--text-muted); }
    .neo-brass-text { color: var(--brass-accent); }
    .neo-verdigris-text { color: var(--verdigris); }
    .neoclassical-arch { border-radius: 9999px 9999px 16px 16px; }

    .btn-primary {
      background-color: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.12s ease, opacity 0.15s ease;
    }
    .btn-primary:hover:not(:disabled) { background-color: var(--btn-primary-hover); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-secondary {
      background-color: var(--btn-secondary-bg);
      color: var(--btn-secondary-text);
      border: 1px solid var(--input-border);
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }
    .btn-secondary:hover:not(:disabled) { border-color: var(--brass-accent); }
    .btn-secondary:disabled { opacity: 0.45; cursor: not-allowed; }

    .neo-input {
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-primary);
    }
    .neo-input::placeholder { color: var(--text-muted); opacity: 0.72; }

    .pricing-card-glow {
      border-color: var(--panel-border);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .pricing-card-glow:hover {
      border-color: var(--brass-accent) !important;
      box-shadow: 0 0 32px rgba(212, 174, 94, 0.22);
    }

    .pricing-card-plus {
      border-color: var(--brass-border);
      box-shadow: 0 0 22px rgba(212, 174, 94, 0.10);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .pricing-card-plus:hover {
      border-color: var(--brass-accent) !important;
      box-shadow: 0 0 36px rgba(212, 174, 94, 0.26);
    }

    @keyframes scanSweepLoop {
      0% { top: 4%; opacity: 0.95; }
      50% { top: 92%; opacity: 0.95; }
      100% { top: 4%; opacity: 0.95; }
    }

    .scan-beam-loop {
      position: absolute;
      left: 0;
      right: 0;
      z-index: 20;
      pointer-events: none;
      animation: scanSweepLoop 2.2s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .scan-beam-loop { animation: none !important; }
    }
  </style>
</head>
<body class="min-h-screen fluted-surface">

  <!-- ROOT CONTAINER -->
  <div id="root-app"></div>

  <!-- CERTIFICATE MODAL ("Open original" / "Open source") -->
  <div
    id="certificate-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
    class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#0A1228]/75 backdrop-blur-xs"
  >
    <div class="w-full max-w-xl neo-panel shadow-2xl overflow-hidden">
      <div class="pt-2 px-2">
        <div class="border-t-[4px] border-double" style="border-color: var(--brass-accent);"></div>
      </div>
      <div class="px-6 py-4 border-b flex items-center justify-between gap-3" style="border-color: var(--panel-border);">
        <div>
          <h2 id="modal-title" class="font-serif-display text-2xl font-bold"></h2>
          <p id="modal-subtitle" class="text-xs mt-0.5 neo-muted"></p>
        </div>
        <button type="button" id="modal-close-top" aria-label="Close certificate preview" class="p-2 rounded-lg btn-secondary">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div id="modal-body" class="p-6 space-y-4 max-h-[70vh] overflow-y-auto"></div>
      <div class="px-6 py-3.5 border-t flex items-center justify-between gap-3" style="border-color: var(--panel-border);">
        <span id="modal-footer-note" class="text-xs neo-muted"></span>
        <div class="flex items-center gap-2">
          <a id="modal-original-link" href="#" target="_blank" rel="noopener noreferrer" class="hidden px-3.5 py-2 rounded-[10px] text-xs btn-secondary">
            View uploaded file ↗
          </a>
          <button type="button" id="modal-close-bottom" class="px-4 py-2 rounded-[10px] text-xs btn-primary">
            Close
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- PILOT FEEDBACK MODAL -->
  <div
    id="feedback-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="feedback-modal-title"
    class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#0A1228]/75 backdrop-blur-xs"
  >
    <div class="w-full max-w-md neo-panel shadow-2xl overflow-hidden">
      <div class="px-6 py-4 border-b flex items-center justify-between" style="border-color: var(--panel-border);">
        <div>
          <h2 id="feedback-modal-title" class="font-serif-display text-2xl font-bold">Pilot feedback</h2>
          <p class="text-xs neo-muted mt-0.5">Tell us what worked well or what felt confusing.</p>
        </div>
        <button type="button" id="feedback-close-btn" class="p-2 rounded-lg btn-secondary text-xs">✕</button>
      </div>
      <form id="feedback-form" class="p-6 space-y-4">
        <div>
          <label class="block text-xs font-medium mb-2 neo-muted">How is your experience so far?</label>
          <div id="feedback-stars" class="flex items-center gap-2">
            <button type="button" data-star="1" class="px-3 py-1.5 rounded-lg text-xs btn-secondary">1 ★</button>
            <button type="button" data-star="2" class="px-3 py-1.5 rounded-lg text-xs btn-secondary">2 ★</button>
            <button type="button" data-star="3" class="px-3 py-1.5 rounded-lg text-xs btn-secondary">3 ★</button>
            <button type="button" data-star="4" class="px-3 py-1.5 rounded-lg text-xs btn-secondary">4 ★</button>
            <button type="button" data-star="5" class="px-3 py-1.5 rounded-lg text-xs btn-primary">5 ★</button>
          </div>
        </div>
        <div>
          <label for="feedback-message" class="block text-xs font-medium mb-1.5 neo-muted">Your note</label>
          <textarea id="feedback-message" rows="4" required placeholder="Example: Date scanning worked great on my electricity bill, would love WhatsApp alerts too..." class="w-full px-3.5 py-2.5 rounded-xl text-sm neo-input"></textarea>
        </div>
        <div class="flex items-center justify-end gap-2 pt-1">
          <button type="button" id="feedback-cancel-btn" class="px-4 py-2 rounded-[10px] text-xs btn-secondary">Cancel</button>
          <button type="submit" id="feedback-submit-btn" class="px-4 py-2 rounded-[10px] text-xs btn-primary">Send feedback</button>
        </div>
      </form>
    </div>
  </div>

  <!-- WAITLIST MODAL -->
  <div
    id="waitlist-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="waitlist-modal-title"
    class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#0A1228]/75 backdrop-blur-xs"
  >
    <div class="w-full max-w-md neo-panel shadow-2xl overflow-hidden">
      <div class="px-6 py-4 border-b flex items-center justify-between" style="border-color: var(--panel-border);">
        <div>
          <h2 id="waitlist-modal-title" class="font-serif-display text-2xl font-bold">Join early access</h2>
          <p id="waitlist-modal-tier-label" class="text-xs neo-brass-text mt-0.5"></p>
        </div>
        <button type="button" id="waitlist-close-btn" class="p-2 rounded-lg btn-secondary text-xs">✕</button>
      </div>
      <form id="waitlist-form" class="p-6 space-y-4">
        <p class="text-xs neo-muted">Leave your email and we’ll notify you first when paid plans launch—with early pilot pricing.</p>
        <div>
          <label for="waitlist-email-input" class="block text-xs font-medium mb-1.5 neo-muted">Email address</label>
          <input id="waitlist-email-input" type="email" required placeholder="you@domain.in" class="w-full px-3.5 py-2.5 rounded-xl text-sm neo-input" />
        </div>
        <div class="flex items-center justify-end gap-2">
          <button type="button" id="waitlist-cancel-btn" class="px-4 py-2 rounded-[10px] text-xs btn-secondary">Cancel</button>
          <button type="submit" id="waitlist-submit-btn" class="px-4 py-2 rounded-[10px] text-xs btn-primary">Join waitlist</button>
        </div>
      </form>
    </div>
  </div>

  <!-- TOAST NOTIFICATION BANNER -->
  <div
    id="toast-banner"
    role="status"
    aria-live="polite"
    class="hidden fixed bottom-5 right-5 z-50 flex items-center gap-2.5 px-4 py-3 rounded-[12px] bg-[#101B3A] border border-[#D4AE5E] text-[#EDEFF5] shadow-xl text-sm font-medium max-w-sm"
  >
    <svg class="w-4 h-4 text-[#6CCBB2] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
      <polyline points="22 4 12 14.01 9 11.01" />
    </svg>
    <span id="toast-message">Action completed</span>
  </div>

  <script>
    (function () {
      'use strict';

      const CONFIG = window.LOOP_CONFIG || {};
      const SUPABASE_URL = (CONFIG.SUPABASE_URL || '').trim();
      const SUPABASE_ANON_KEY = (CONFIG.SUPABASE_ANON_KEY || '').trim();
      const API_BASE_URL = (CONFIG.API_BASE_URL || '').replace(/\/+$/, '');

      const isConfigured =
        SUPABASE_URL &&
        SUPABASE_ANON_KEY &&
        API_BASE_URL &&
        !SUPABASE_URL.includes('YOUR_PROJECT_ID') &&
        !SUPABASE_ANON_KEY.includes('YOUR_SUPABASE_ANON_KEY') &&
        !API_BASE_URL.includes('YOUR_RENDER_BACKEND');

      let supabaseClient = null;
      if (isConfigured && window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }

      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // ----------------------------------------------------------------------
      // DYNAMIC IST DATE HELPERS
      // ----------------------------------------------------------------------
      function getTodayIST() {
        const now = new Date();
        const istOffsetMs = 5.5 * 60 * 60 * 1000;
        const utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
        return new Date(utcMs + istOffsetMs);
      }

      function getTodayGreeting() {
        const d = getTodayIST();
        const hour = d.getHours();
        const part = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
        const formatted = d.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'short' });
        return `${part}, ${formatted}`;
      }

      function getTodayShortIST() {
        const d = getTodayIST();
        return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
      }

      function formatDisplayDate(isoDate) {
        if (!isoDate) return '';
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const parts = String(isoDate).split('-').map(Number);
        if (parts.length !== 3 || parts.some(isNaN)) return isoDate;
        return `${parts[2]} ${months[parts[1] - 1]} ${parts[0]}`;
      }

      function formatShortSavedDate(isoString) {
        if (!isoString) return getTodayShortIST();
        const d = new Date(isoString);
        if (isNaN(d.getTime())) return getTodayShortIST();
        return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
      }

      // ----------------------------------------------------------------------
      // APPLICATION STATE
      // ----------------------------------------------------------------------
      const state = {
        booting: true,
        route: 'landing', // 'landing' | 'login' | 'signup' | 'permissions' | 'app'
        appTab: 'today',  // 'today' | 'add' | 'vault' | 'ask' | 'settings'
        lightMode: false,
        mobileMenuOpen: false,

        // Auth & Profile
        session: null,
        isAuthenticated: false,
        userName: '',
        userEmail: '',
        planTier: 'free_pilot',
        maxActiveRecords: 25,
        authEmailInput: '',
        authPasswordInput: '',
        authConsentChecked: false,
        authErrors: {},
        authLoading: false,
        authNotice: '',

        // Permissions
        permissionsGranted: false,
        permissionsSaving: false,
        permissions: {
          documentAccess: true,
          notifications: true,
          microphone: false,
          leadTime: '2 days before'
        },

        // Landing widgets
        landingAmbiguousChoice: null,
        openFaqIndex: 0,
        waitlistMessage: '',
        activeWaitlistTier: 'LOOP Plus',

        // Vault Records (live from FastAPI / Supabase)
        records: [],
        recordsLoading: false,
        selectedRingItemId: null,

        // Add Document & Live AI Extraction
        addInputTab: 'file',
        uploadError: '',
        pastedText: '',
        isRecording: false,
        recordingSeconds: 0,
        isScanning: false,
        scanResult: null, // { extracted, file_path, source_type }
        selectedChoiceId: null,
        draftTitle: '',
        draftIssuer: '',
        draftCategory: 'Bill',
        draftAmount: '',
        draftDueDate: '',
        draftReminderTiming: '2 days before',
        isApproving: false,

        // Vault Search & Filter
        vaultSearch: '',
        vaultFilter: 'All',

        // Ask LOOP
        askQuery: '',
        askLoading: false,
        askResult: null,

        // Settings
        confirmDeleteAll: false,
        deletingAll: false,

        // Pilot Feedback Modal
        feedbackRating: 5
      };

      let mediaRecorder = null;
      let audioChunks = [];
      let recordingInterval = null;
      let toastTimeout = null;

      // ----------------------------------------------------------------------
      // CORE HELPERS & API CLIENT
      // ----------------------------------------------------------------------
      function escapeHtml(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function showToast(message) {
        const banner = document.getElementById('toast-banner');
        const msgEl = document.getElementById('toast-message');
        msgEl.textContent = message;
        banner.classList.remove('hidden');
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => banner.classList.add('hidden'), 3800);
      }

      function syncTheme() {
        document.documentElement.classList.toggle('light', state.lightMode);
      }

      async function apiFetch(path, options = {}) {
        if (!API_BASE_URL || API_BASE_URL.includes('YOUR_RENDER_BACKEND')) {
          throw new Error('Backend URL is not configured in config.js yet.');
        }

        const headers = Object.assign({}, options.headers || {});
        if (state.session && state.session.access_token) {
          headers['Authorization'] = `Bearer ${state.session.access_token}`;
        }
        if (!(options.body instanceof FormData) && options.body && !headers['Content-Type']) {
          headers['Content-Type'] = 'application/json';
        }

        const response = await fetch(`${API_BASE_URL}${path}`, {
          ...options,
          headers
        });

        let data = null;
        try {
          data = await response.json();
        } catch (_) {
          data = null;
        }

        if (!response.ok) {
          const msg = (data && (data.detail || data.message)) || `Request failed (${response.status})`;
          throw new Error(typeof msg === 'string' ? msg : JSON.stringify(msg));
        }
        return data;
      }

      async function loadUserWorkspace() {
        state.recordsLoading = true;
        render();
        try {
          const profile = await apiFetch('/api/me');
          state.userEmail = profile.email || state.userEmail;
          state.userName = profile.full_name || state.userEmail.split('@')[0] || 'Member';
          state.planTier = profile.plan_tier || 'free_pilot';
          state.maxActiveRecords = profile.max_active_records || 25;
          state.permissionsGranted = Boolean(profile.permissions_granted);
          if (profile.permissions) {
            state.permissions = Object.assign({}, state.permissions, profile.permissions);
            state.draftReminderTiming = state.permissions.leadTime || '2 days before';
          }

          if (state.permissionsGranted) {
            const recs = await apiFetch('/api/records');
            state.records = Array.isArray(recs) ? recs : [];
            state.selectedRingItemId = state.records[0] ? state.records[0].id : null;
          }
        } catch (err) {
          showToast(err.message || 'Could not load your archive. Server may be waking up.');
        } finally {
          state.recordsLoading = false;
        }
      }

      // ----------------------------------------------------------------------
      // ROUTER
      // ----------------------------------------------------------------------
      function navigateTo(targetRoute, targetAppTab) {
        if (targetAppTab) state.appTab = targetAppTab;

        if (targetRoute === 'app') {
          if (!state.isAuthenticated) {
            state.route = 'login';
            history.replaceState(null, '', '#/login');
            render();
            window.scrollTo({ top: 0, behavior: 'auto' });
            return;
          }
          if (!state.permissionsGranted) {
            state.route = 'permissions';
            history.replaceState(null, '', '#/permissions');
            render();
            window.scrollTo({ top: 0, behavior: 'auto' });
            return;
          }
        }

        if (targetRoute === 'permissions' && !state.isAuthenticated) {
          state.route = 'login';
          history.replaceState(null, '', '#/login');
          render();
          window.scrollTo({ top: 0, behavior: 'auto' });
          return;
        }

        state.route = targetRoute;
        state.mobileMenuOpen = false;

        const hashMap = {
          landing: '#/',
          login: '#/login',
          signup: '#/signup',
          permissions: '#/permissions',
          app: state.appTab === 'today' ? '#/app' : `#/app/${state.appTab}`
        };
        const nextHash = hashMap[targetRoute] || '#/';
        if (window.location.hash !== nextHash) {
          history.replaceState(null, '', nextHash);
        }

        render();
        window.scrollTo({ top: 0, behavior: 'auto' });
      }

      function syncFromHash() {
        const raw = (window.location.hash || '#/').replace(/^#/, '');
        if (raw === '/signup') {
          state.route = state.isAuthenticated ? (state.permissionsGranted ? 'app' : 'permissions') : 'signup';
        } else if (raw === '/login') {
          state.route = state.isAuthenticated ? (state.permissionsGranted ? 'app' : 'permissions') : 'login';
        } else if (raw === '/permissions') {
          state.route = state.isAuthenticated ? 'permissions' : 'login';
        } else if (raw.startsWith('/app')) {
          const sub = raw.split('/')[2] || 'today';
          if (['today', 'add', 'vault', 'ask', 'settings'].includes(sub)) state.appTab = sub;
          if (!state.isAuthenticated) state.route = 'login';
          else if (!state.permissionsGranted) state.route = 'permissions';
          else state.route = 'app';

          state.route = 'landing';

      function bindAuthEvents(mode) {
        document.querySelectorAll('[data-go-route]').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.authErrors = {};
            state.authNotice = '';
            navigateTo(btn.getAttribute('data-go-route'));
          });
        });

        const emailEl = document.getElementById('auth-email');
        const passEl = document.getElementById('auth-password');
        const consentEl = document.getElementById('auth-consent');
        if (emailEl) emailEl.addEventListener('input', (e) => { state.authEmailInput = e.target.value; });
        if (passEl) passEl.addEventListener('input', (e) => { state.authPasswordInput = e.target.value; });
        if (consentEl) consentEl.addEventListener('change', (e) => { state.authConsentChecked = e.target.checked; });

        const googleBtn = document.getElementById('google-auth-btn');
        if (googleBtn) {
          googleBtn.addEventListener('click', async () => {
            if (!supabaseClient) {
              state.authErrors = { form: 'Configure SUPABASE_URL and SUPABASE_ANON_KEY in config.js first.' };
              render();
              return;
            }
            state.authLoading = true;
            state.authErrors = {};
            render();
            const { error } = await supabaseClient.auth.signInWithOAuth({
              provider: 'google',
              options: { redirectTo: window.location.origin + window.location.pathname }
            });
            if (error) {
              state.authLoading = false;
              state.authErrors = { form: error.message };
              render();
            }
          });
        }

        const form = document.getElementById('auth-form');
        if (form) {
          form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const errs = {};
            const emailVal = state.authEmailInput.trim();
            if (!emailVal || !emailVal.includes('@') || !emailVal.includes('.')) {
              errs.email = 'Enter a valid email address.';
            }
            if (state.authPasswordInput.length < 6) {
              errs.password = 'Use at least 6 characters for your password.';
            }
            if (mode === 'signup' && !state.authConsentChecked) {
              errs.consent = 'Please tick the privacy consent box before continuing.';
            }
            if (!supabaseClient) {
              errs.form = 'Configure SUPABASE_URL, SUPABASE_ANON_KEY, and API_BASE_URL in config.js first.';
            }
            state.authErrors = errs;
            if (Object.keys(errs).length > 0) {
              render();
              return;
            }

            state.authLoading = true;
            state.authNotice = '';
            render();

            try {
              if (mode === 'signup') {
                const { data, error } = await supabaseClient.auth.signUp({
                  email: emailVal,
                  password: state.authPasswordInput
                });
                if (error) throw error;
                if (data.session) {
                  await handleSignedInSession(data.session);
                } else {
                  state.authNotice = 'Account created! Check your inbox for the confirmation email, then log in.';
                  state.authPasswordInput = '';
                }
              } else {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                  email: emailVal,
                  password: state.authPasswordInput
                });
                if (error) throw error;
                if (data.session) {
                  await handleSignedInSession(data.session);
                }
              }
            } catch (err) {
              state.authErrors = { form: err.message || 'Authentication failed.' };
            } finally {
              state.authLoading = false;
              render();
            }
          });
        }
      }

        const signOutBtn = document.getElementById('perm-signout-btn');
        if (signOutBtn) signOutBtn.addEventListener('click', handleSignOut);

        const confirmBtn = document.getElementById('confirm-permissions-btn');
        if (confirmBtn) {
          confirmBtn.addEventListener('click', async () => {
            if (!state.permissions.documentAccess) return;
            state.permissionsSaving = true;
            render();
            try {
              await apiFetch('/api/permissions', {
                method: 'PUT',
                body: JSON.stringify({
                  permissions_granted: true,
                  documentAccess: state.permissions.documentAccess,
                  notifications: state.permissions.notifications,
                  microphone: state.permissions.microphone,
                  leadTime: state.permissions.leadTime
                })
              });
              state.permissionsGranted = true;
              const recs = await apiFetch('/api/records');
              state.records = Array.isArray(recs) ? recs : [];
              state.selectedRingItemId = state.records[0] ? state.records[0].id : null;
              showToast('Permissions saved · Welcome to LOOP');
              navigateTo('app', 'today');
            } catch (err) {
              showToast(err.message || 'Could not save permissions.');
            } finally {
              state.permissionsSaving = false;
              render();
            }
          });
        }
      }

      // ----------------------------------------------------------------------
      // TODAY TAB
      // ----------------------------------------------------------------------
      function buildThirtyDayRingSvg(itemsWithin30, selectedItem) {
        const size = 320, cx = 160, cy = 160, radius = 120;
        const brassColor = state.lightMode ? '#A67C2E' : '#D4AE5E';
        const verdigrisColor = state.lightMode ? '#1E8A6E' : '#6CCBB2';
        const trackColor = state.lightMode ? '#CBD3E1' : '#26365F';
        const ringBg = state.lightMode ? '#FFFFFF' : '#0A1228';

        let ticksSvg = '';
        for (let day = 0; day < 30; day++) {
          const rad = ((-90 + day * 12) * Math.PI) / 180;
          const isWeek = day % 7 === 0;
          const r1 = isWeek ? radius - 11 : radius - 6;
          ticksSvg += `<line x1="${(cx + r1 * Math.cos(rad)).toFixed(2)}" y1="${(cy + r1 * Math.sin(rad)).toFixed(2)}" x2="${(cx + radius * Math.cos(rad)).toFixed(2)}" y2="${(cy + radius * Math.sin(rad)).toFixed(2)}" stroke="${isWeek ? brassColor : trackColor}" stroke-width="${isWeek ? 1.9 : 1.1}" stroke-linecap="round" />`;
        }

        const markersSvg = itemsWithin30
          .map((item) => {
            const rad = ((-90 + (item.daysFromToday ?? 0) * 12) * Math.PI) / 180;
            const mx = (cx + radius * Math.cos(rad)).toFixed(2);
            const my = (cy + radius * Math.sin(rad)).toFixed(2);
            const isSelected = selectedItem && selectedItem.id === item.id;
            return `
              <g role="button" tabindex="0" data-select-ring-id="${item.id}" class="cursor-pointer">
                ${isSelected ? `<circle cx="${mx}" cy="${my}" r="15" fill="${brassColor}" fill-opacity="0.18" /><circle cx="${mx}" cy="${my}" r="10.5" fill="none" stroke="${brassColor}" stroke-width="1.2" />` : ''}
                <circle cx="${mx}" cy="${my}" r="${isSelected ? 7.5 : 5.5}" fill="${brassColor}" stroke="${ringBg}" stroke-width="1.8" />
              </g>
            `;
          })
          .join('');

        return `
          <div class="flex flex-col items-center">
            <div class="relative w-full max-w-[310px] aspect-square flex items-center justify-center">
              <svg viewBox="0 0 ${size} ${size}" class="w-full h-full overflow-visible">
                <circle cx="${cx}" cy="${cy}" r="${radius + 12}" fill="none" stroke="${trackColor}" stroke-width="1" />
                <circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="${trackColor}" stroke-width="1.8" />
                ${ticksSvg}
                <circle cx="${cx}" cy="${cy - radius}" r="6" fill="${verdigrisColor}" stroke="${ringBg}" stroke-width="1.8" />
                <text x="${cx}" y="${cy - radius - 14}" text-anchor="middle" fill="${verdigrisColor}" font-size="11" font-weight="600">Today</text>
                ${markersSvg}
              </svg>

              <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-12 pointer-events-none">
                ${
                  selectedItem
                    ? `
                      <span class="font-serif-display text-6xl font-bold leading-none" style="color: var(--text-primary);">${selectedItem.daysFromToday}</span>
                      <span class="text-xs font-medium mt-1 neo-muted">${selectedItem.daysFromToday === 1 ? 'day left' : 'days left'}</span>
                      <p class="font-serif-display text-lg font-bold leading-tight mt-2 line-clamp-2">${escapeHtml(selectedItem.title)}</p>
                      <span class="text-xs mt-1 font-medium neo-brass-text">${escapeHtml(selectedItem.dueDateDisplay)} · ${escapeHtml(selectedItem.amount)}</span>
                    `
                    : `<p class="font-serif-display text-xl font-bold">Ring is clear</p><span class="text-xs mt-1 neo-muted">Add your first bill</span>`
                }
              </div>
            </div>

            ${selectedItem ? `<div class="mt-2"><button type="button" id="mark-paid-btn" data-mark-paid-id="${selectedItem.id}" class="px-4 py-2 rounded-[10px] text-xs btn-secondary">Mark as paid</button></div>` : ''}

            <div class="flex flex-wrap items-center justify-between w-full pt-4 mt-4 border-t text-xs neo-muted" style="border-color: var(--brass-border);">
              <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full" style="background-color: var(--verdigris);"></span><span>Today (${escapeHtml(getTodayShortIST())})</span></span>
              <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full" style="background-color: var(--brass-accent);"></span><span>Approved marker (next 30 days)</span></span>
            </div>
          </div>
        `;
      }

              })
              .join('');

        return `
          <section class="space-y-7">
            <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
              <div>
                <p class="text-sm font-medium neo-brass-text">${escapeHtml(getTodayGreeting())}</p>
                <h1 class="font-serif-display text-3xl sm:text-4xl font-bold tracking-tight mt-0.5">Today</h1>
                <p class="text-sm mt-1 neo-muted">Your next 30 days of approved bills, bookings, and renewals on a single dial.</p>
              </div>
              <button type="button" id="today-add-btn" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-[10px] text-sm btn-primary self-start sm:self-auto">
                <span>+ Add document</span>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              <div class="lg:col-span-5 p-6 neo-panel">
                <div class="flex items-center justify-between mb-3">
                  <h2 class="font-serif-display text-xl font-bold">Next 30 days · ${itemsWithin30.length} on ring</h2>

                ${buildThirtyDayRingSvg(itemsWithin30, selectedItem)}

              <div class="lg:col-span-7 p-5 sm:p-6 space-y-4 neo-panel">

      // ----------------------------------------------------------------------
      // ADD DOCUMENT TAB — LIVE GEMINI EXTRACTION
      // ----------------------------------------------------------------------
      function resetScanState() {
        state.scanResult = null;
        state.isScanning = false;
        state.selectedChoiceId = null;
        state.uploadError = '';
        state.draftTitle = '';
        state.draftIssuer = '';
        state.draftCategory = 'Bill';
        state.draftAmount = '';
        state.draftDueDate = '';
        state.draftReminderTiming = state.permissions.leadTime || '2 days before';
      }

      async function runLiveExtraction({ file = null, text = null }) {
        state.uploadError = '';
        state.isScanning = true;
        state.scanResult = null;
        state.selectedChoiceId = null;
        render();

        try {
          const formData = new FormData();
          if (file) formData.append('file', file);
          if (text) formData.append('text', text);

          const res = await apiFetch('/api/extract', {
            method: 'POST',
            body: formData
          });

          const ext = res.extracted;
          state.scanResult = res;
          state.draftTitle = ext.title || '';
          state.draftIssuer = ext.issuer || '';
          state.draftCategory = ['Bill', 'Booking', 'Warranty'].includes(ext.category) ? ext.category : 'Bill';
          state.draftAmount = ext.amount || '₹0';
          state.draftDueDate = ext.is_date_ambiguous ? '' : (ext.due_date || '');
          state.draftReminderTiming = state.permissions.leadTime || '2 days before';
        } catch (err) {
          state.uploadError = err.message || 'Could not extract details from this document.';
        } finally {
          state.isScanning = false;
          render();
        }
      }

      // ----------------------------------------------------------------------
      // ASK LOOP TAB — LIVE GROUNDED AI Q&A
      // ----------------------------------------------------------------------
      async function executeGroundedAsk(questionText) {
        const q = (questionText !== undefined ? questionText : state.askQuery).trim();
        if (questionText !== undefined) state.askQuery = questionText;
        if (q.length < 2) return;

        state.askLoading = true;
        state.askResult = null;
        render();

        try {
          const res = await apiFetch('/api/ask', {
            method: 'POST',
            body: JSON.stringify({ question: q })
          });
          state.askResult = res;
        } catch (err) {
          showToast(err.message || 'Could not reach Ask LOOP.');
        } finally {
          state.askLoading = false;
          render();
        }
      }

      async function openCertificateModal(record) {
        if (!record) return;
        const modal = document.getElementById('certificate-modal');
        const linkEl = document.getElementById('modal-original-link');
        linkEl.classList.add('hidden');
        linkEl.href = '#';

        document.getElementById('modal-title').textContent = record.title;
        document.getElementById('modal-subtitle').textContent = `${record.source_type || 'Document'} • Saved ${formatShortSavedDate(record.created_at)}`;
        document.getElementById('modal-footer-note').textContent = `Scheduled for ${record.dueDateDisplay || formatDisplayDate(record.due_date)} (${record.reminder_timing || '2 days before'})`;
        document.getElementById('modal-body').innerHTML = `
          <div class="pb-3 border-b flex items-start justify-between gap-2" style="border-color: var(--panel-border);">
            <div>
              <p class="font-serif-display text-lg font-bold">${escapeHtml(record.doc_header || record.title)}</p>
              <p class="text-xs mt-0.5 neo-muted">${escapeHtml(record.doc_subheader || record.issuer)}</p>
            </div>
            <span class="text-xs font-mono px-2.5 py-1 neo-subpanel neo-muted">${escapeHtml(record.reference_code || 'CERT')}</span>
          </div>
          <div class="space-y-3">
            ${(record.sections || []).map((s) => `<div class="p-3.5 rounded-[10px] border" style="background-color: var(--highlight-green-bg); border-color: var(--highlight-green-border);"><span class="block text-xs font-medium mb-1 neo-muted">${escapeHtml(s.label)}</span><p class="text-sm font-medium">${escapeHtml(s.text)}</p></div>`).join('')}
          </div>
        `;
        modal.classList.remove('hidden');

        if (record.file_path) {
          try {
            const res = await apiFetch(`/api/records/${record.id}/original`);
            if (res && res.signed_url) {
              linkEl.href = res.signed_url;
              linkEl.classList.remove('hidden');
            }
          } catch (_) {
            // Silently keep certificate view even if file URL fails
          }
        }
      }

      // ----------------------------------------------------------------------
      // DASHBOARD EVENT BINDING
      // ----------------------------------------------------------------------
      async function handleSignOut() {
        if (supabaseClient) await supabaseClient.auth.signOut();
        state.session = null;
        state.isAuthenticated = false;
        state.permissionsGranted = false;
        state.records = [];
        state.askResult = null;
        resetScanState();
        showToast('Signed out');
        navigateTo('landing');
      }

      function bindDashboardEvents() {
        document.querySelectorAll('[data-go-route]').forEach((btn) => {
          btn.addEventListener('click', () => navigateTo(btn.getAttribute('data-go-route')));
        });
        document.querySelectorAll('[data-app-tab]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const tab = btn.getAttribute('data-app-tab');
            if (tab === 'add') resetScanState();
            navigateTo('app', tab);
          });
        });

        const toggleTheme = () => { state.lightMode = !state.lightMode; render(); };
        const t1 = document.getElementById('dash-theme-toggle');
        const t2 = document.getElementById('dash-mobile-theme-toggle');
        if (t1) t1.addEventListener('click', toggleTheme);
        if (t2) t2.addEventListener('click', toggleTheme);

        const fb1 = document.getElementById('open-feedback-btn');
        const fb2 = document.getElementById('open-feedback-mobile-btn');
        if (fb1) fb1.addEventListener('click', openFeedbackModal);
        if (fb2) fb2.addEventListener('click', openFeedbackModal);

        const mobileMenuBtn = document.getElementById('dash-mobile-menu-btn');
        if (mobileMenuBtn) {
          mobileMenuBtn.addEventListener('click', () => { state.mobileMenuOpen = !state.mobileMenuOpen; render(); });
        }

        // Today tab
        ['today-add-btn', 'empty-add-first-btn'].forEach((id) => {
          const btn = document.getElementById(id);
          if (btn) btn.addEventListener('click', () => { resetScanState(); navigateTo('app', 'add'); });
        });
        document.querySelectorAll('[data-select-ring-id], [data-select-row-id]').forEach((el) => {
          el.addEventListener('click', () => {
            state.selectedRingItemId = el.getAttribute('data-select-ring-id') || el.getAttribute('data-select-row-id');
            render();
          });
        });
        const markPaid = document.getElementById('mark-paid-btn');
        if (markPaid) {
          markPaid.addEventListener('click', async () => {
            const id = markPaid.getAttribute('data-mark-paid-id');
            try {
              await apiFetch(`/api/records/${id}/pay`, { method: 'PATCH' });
              state.records = state.records.filter((r) => r.id !== id);
              const next = getSortedRecords();
              state.selectedRingItemId = next[0] ? next[0].id : null;
              showToast('Marked as paid');
              render();
            } catch (err) {
              showToast(err.message || 'Could not update record.');
            }
          });
        }

        // Add document tab
        const closeErr = document.getElementById('close-upload-error');
        if (closeErr) closeErr.addEventListener('click', () => { state.uploadError = ''; render(); });

        document.querySelectorAll('[data-add-tab]').forEach((btn) => {
          btn.addEventListener('click', () => { state.addInputTab = btn.getAttribute('data-add-tab'); render(); });
        });

        const sampleBillText = 'BESCOM Electricity Supply — Account ID: 849201742. Billing Period: Nov 2026. Amount Due: ₹3,420.00. Due Date: 12/12/2026 (Billing cycle cutoff: 11 Dec 2026).';
        ['scan-sample-btn', 'scan-sample-from-voice-btn'].forEach((id) => {
          const btn = document.getElementById(id);
          if (btn) btn.addEventListener('click', () => runLiveExtraction({ text: sampleBillText }));
        });

        const chooseFile = document.getElementById('choose-file-btn');
        const fileInput = document.getElementById('file-upload-input');
        if (chooseFile && fileInput) {
          chooseFile.addEventListener('click', () => fileInput.click());
          fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) runLiveExtraction({ file });
          });
        }

        const fillSample = document.getElementById('fill-sample-text-btn');
        if (fillSample) fillSample.addEventListener('click', () => { state.pastedText = sampleBillText; render(); });

        const pasteArea = document.getElementById('paste-doc-textarea');
        if (pasteArea) pasteArea.addEventListener('input', (e) => { state.pastedText = e.target.value; });

        const extractTextBtn = document.getElementById('extract-text-btn');
        if (extractTextBtn) {
          extractTextBtn.addEventListener('click', () => {
            if (state.pastedText.trim().length < 8) {
              state.uploadError = 'Paste at least 8 characters of bill or confirmation text.';
              render();
              return;
            }
            runLiveExtraction({ text: state.pastedText.trim() });
          });
        }

        const voiceBtn = document.getElementById('toggle-voice-btn');
        if (voiceBtn) {
          voiceBtn.addEventListener('click', async () => {
            if (!state.isRecording) {
              try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = (ev) => { if (ev.data.size > 0) audioChunks.push(ev.data); };
                mediaRecorder.onstop = () => {
                  stream.getTracks().forEach((t) => t.stop());
                  const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                  const audioFile = new File([audioBlob], 'voice-note.webm', { type: audioBlob.type });
                  runLiveExtraction({ file: audioFile });
                };
                mediaRecorder.start();
                state.isRecording = true;
                state.recordingSeconds = 0;
                recordingInterval = setInterval(() => { state.recordingSeconds += 1; render(); }, 1000);
                render();
              } catch (_) {
                state.uploadError = 'Microphone access was denied. Enable microphone permission in your browser or paste text instead.';
                render();
              }
            } else {
              state.isRecording = false;
              clearInterval(recordingInterval);
              if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            }
          });
        }

        document.querySelectorAll('[data-date-choice-id]').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.selectedChoiceId = btn.getAttribute('data-date-choice-id');
            state.draftDueDate = btn.getAttribute('data-date-choice-val');
            render();
          });
        });

        const titleIn = document.getElementById('draft-title-input');
        if (titleIn) titleIn.addEventListener('input', (e) => { state.draftTitle = e.target.value; });
        const issuerIn = document.getElementById('draft-issuer-input');
        if (issuerIn) issuerIn.addEventListener('input', (e) => { state.draftIssuer = e.target.value; });
        const catSel = document.getElementById('draft-category-select');
        if (catSel) catSel.addEventListener('change', (e) => { state.draftCategory = e.target.value; });
        const amtIn = document.getElementById('draft-amount-input');
        if (amtIn) amtIn.addEventListener('input', (e) => { state.draftAmount = e.target.value; });
        const dueIn = document.getElementById('draft-duedate-input');
        if (dueIn) dueIn.addEventListener('change', (e) => { state.draftDueDate = e.target.value; render(); });
        const timSel = document.getElementById('draft-timing-select');
        if (timSel) timSel.addEventListener('change', (e) => { state.draftReminderTiming = e.target.value; });

        const approveBtn = document.getElementById('approve-reminder-btn');
        if (approveBtn) {
          approveBtn.addEventListener('click', async () => {
            if (!state.scanResult) return;
            state.isApproving = true;
            state.uploadError = '';
            render();
            try {
              const ext = state.scanResult.extracted;
              const numAmt = parseFloat(String(state.draftAmount).replace(/[^\d.]/g, '')) || 0;
              const saved = await apiFetch('/api/records', {
                method: 'POST',
                body: JSON.stringify({
                  title: state.draftTitle.trim(),
                  issuer: state.draftIssuer.trim(),
                  amount: state.draftAmount.trim() || '₹0',
                  numeric_amount: numAmt,
                  due_date: state.draftDueDate,
                  category: state.draftCategory,
                  reminder_timing: state.draftReminderTiming,
                  source_type: state.scanResult.source_type || 'PDF Document',
                  file_path: state.scanResult.file_path || null,
                  doc_header: ext.doc_header || state.draftTitle.trim(),
                  doc_subheader: ext.doc_subheader || state.draftIssuer.trim(),
                  reference_code: ext.reference_code || 'CERT',
                  sections: ext.sections || [],
                  snippet: ext.snippet || `${state.draftTitle.trim()} (${state.draftAmount.trim()}) due ${state.draftDueDate}`
                })
              });
              state.records.unshift(saved);
              state.selectedRingItemId = saved.id;
              resetScanState();
              showToast('Reminder approved & saved');
              navigateTo('app', 'today');
            } catch (err) {
              state.uploadError = err.message || 'Could not save reminder.';
            } finally {
              state.isApproving = false;
              render();
            }
          });
        }

        const dismissBtn = document.getElementById('dismiss-scan-btn');
        if (dismissBtn) dismissBtn.addEventListener('click', () => { resetScanState(); render(); });

        // Vault tab
        const vaultSearch = document.getElementById('vault-search-input');
        if (vaultSearch) {
          vaultSearch.addEventListener('input', (e) => {
            state.vaultSearch = e.target.value;
            render();
            const refreshed = document.getElementById('vault-search-input');
            if (refreshed) { refreshed.focus(); refreshed.setSelectionRange(refreshed.value.length, refreshed.value.length); }
          });
        }
        document.querySelectorAll('[data-vault-filter]').forEach((btn) => {
          btn.addEventListener('click', () => { state.vaultFilter = btn.getAttribute('data-vault-filter'); render(); });
        });
        document.querySelectorAll('[data-open-original-id]').forEach((btn) => {
          btn.addEventListener('click', () => openCertificateModal(state.records.find((r) => r.id === btn.getAttribute('data-open-original-id'))));
        });

        // Ask LOOP tab
        const askIn = document.getElementById('ask-loop-input');
        if (askIn) askIn.addEventListener('input', (e) => { state.askQuery = e.target.value; });
        const askForm = document.getElementById('ask-loop-form');
        if (askForm) askForm.addEventListener('submit', (e) => { e.preventDefault(); executeGroundedAsk(); });
        document.querySelectorAll('[data-ask-preset]').forEach((btn) => {
          btn.addEventListener('click', () => executeGroundedAsk(btn.getAttribute('data-ask-preset')));
        });
        const askOpenSrc = document.getElementById('ask-open-source-btn');
        if (askOpenSrc) {
          askOpenSrc.addEventListener('click', () => {
            const src = state.askResult && state.askResult.source;
            if (src) openCertificateModal(src);
          });
        }

        // Settings tab
        const signOutBtn = document.getElementById('sign-out-btn');
        if (signOutBtn) signOutBtn.addEventListener('click', handleSignOut);

        const exportBtn = document.getElementById('export-data-btn');
        if (exportBtn) {
          exportBtn.addEventListener('click', async () => {
            try {
              const payload = await apiFetch('/api/export');
              const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = `loop-archive-${getTodayIST().toISOString().slice(0, 10)}.json`;
              a.click();
              URL.revokeObjectURL(url);
              showToast('Archive exported as JSON');
            } catch (err) {
              showToast(err.message || 'Export failed.');
            }
          });
        }

        const reqDel = document.getElementById('request-delete-all-btn');
        if (reqDel) reqDel.addEventListener('click', () => { state.confirmDeleteAll = true; render(); });
        const cancelDel = document.getElementById('cancel-delete-all-btn');
        if (cancelDel) cancelDel.addEventListener('click', () => { state.confirmDeleteAll = false; render(); });
        const confirmDel = document.getElementById('confirm-delete-all-btn');
        if (confirmDel) {
          confirmDel.addEventListener('click', async () => {
            state.deletingAll = true;
            render();
            try {
              await apiFetch('/api/account/records', { method: 'DELETE' });
              state.records = [];
              state.selectedRingItemId = null;
              state.confirmDeleteAll = false;
              showToast('All records permanently deleted');
            } catch (err) {
              showToast(err.message || 'Delete failed.');
            } finally {
              state.deletingAll = false;
              render();
            }
          });
        }
      }

      // ----------------------------------------------------------------------
      // MASTER RENDER
      // ----------------------------------------------------------------------
      function render() {
        syncTheme();
        const root = document.getElementById('root-app');

        if (state.booting) {
          root.innerHTML = `<div class="min-h-screen flex items-center justify-center"><div class="text-center space-y-3">${logoSvgHtml('w-10 h-12 mx-auto')}<p class="text-xs neo-muted">Opening LOOP…</p></div></div>`;
          return;
        }

        if (state.route === 'landing') {
          root.innerHTML = renderLandingPage();
          bindLandingEvents();
        } else if (state.route === 'login') {
          root.innerHTML = renderAuthPage('login');
          bindAuthEvents('login');
        } else if (state.route === 'signup') {
          root.innerHTML = renderAuthPage('signup');
          bindAuthEvents('signup');
        } else if (state.route === 'permissions') {
          root.innerHTML = renderPermissionsPage();
          bindPermissionsEvents();
        } else {
          let tabHtml = '';
          if (state.appTab === 'today') tabHtml = renderTodayTab();
          else if (state.appTab === 'add') tabHtml = renderAddTab();
          else if (state.appTab === 'vault') tabHtml = renderVaultTab();
          else if (state.appTab === 'ask') tabHtml = renderAskTab();
          else if (state.appTab === 'settings') tabHtml = renderSettingsTab();

          root.innerHTML = renderDashboardShell(tabHtml);
          bindDashboardEvents();
        }
      }

      // ----------------------------------------------------------------------
      // STATIC MODAL WIRING (Certificate, Feedback, Waitlist)
      // ----------------------------------------------------------------------
      document.getElementById('modal-close-top').addEventListener('click', closeCertificateModal);
      document.getElementById('modal-close-bottom').addEventListener('click', closeCertificateModal);
      document.getElementById('certificate-modal').addEventListener('click', (e) => {
        if (e.target.id === 'certificate-modal') closeCertificateModal();
      });

      document.getElementById('feedback-close-btn').addEventListener('click', closeFeedbackModal);
      document.getElementById('feedback-cancel-btn').addEventListener('click', closeFeedbackModal);
      document.querySelectorAll('#feedback-stars [data-star]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.feedbackRating = Number(btn.getAttribute('data-star'));
          document.querySelectorAll('#feedback-stars [data-star]').forEach((b) => {
            const active = Number(b.getAttribute('data-star')) === state.feedbackRating;
            b.className = `px-3 py-1.5 rounded-lg text-xs ${active ? 'btn-primary' : 'btn-secondary'}`;
          });
        });
      });
      document.getElementById('feedback-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msgEl = document.getElementById('feedback-message');
        const submitBtn = document.getElementById('feedback-submit-btn');
        const message = msgEl.value.trim();
        if (message.length < 3) return;
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending…';
        try {
          await apiFetch('/api/feedback', {
            method: 'POST',
            body: JSON.stringify({ screen: state.appTab, rating: state.feedbackRating, message })
          });
          msgEl.value = '';
          closeFeedbackModal();
          showToast('Thank you! Pilot feedback received.');
        } catch (err) {
          showToast(err.message || 'Could not send feedback.');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send feedback';
        }
      });

      document.getElementById('waitlist-close-btn').addEventListener('click', closeWaitlistModal);
      document.getElementById('waitlist-cancel-btn').addEventListener('click', closeWaitlistModal);
      document.getElementById('waitlist-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const emailIn = document.getElementById('waitlist-email-input');
        const submitBtn = document.getElementById('waitlist-submit-btn');
        const email = emailIn.value.trim();
        if (!email) return;
        submitBtn.disabled = true;
        submitBtn.textContent = 'Joining…';
        try {
          await apiFetch('/api/waitlist', {
            method: 'POST',
            body: JSON.stringify({ email, tier: state.activeWaitlistTier })
          });
          state.waitlistMessage = `You are on the early-access list for ${state.activeWaitlistTier}.`;
          emailIn.value = '';
          closeWaitlistModal();
          showToast(`Joined ${state.activeWaitlistTier} waitlist`);
          render();
        } catch (err) {
          showToast(err.message || 'Could not join waitlist.');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Join waitlist';
        }
      });

      // ----------------------------------------------------------------------
      // SESSION BOOTSTRAP
      // ----------------------------------------------------------------------
      async function handleSignedInSession(session) {
        state.session = session;
        state.isAuthenticated = true;
        state.userEmail = session.user ? session.user.email : '';
        await loadUserWorkspace();
        if (state.permissionsGranted) {
          navigateTo('app', 'today');
        } else {
          navigateTo('permissions');
        }
      }

      async function bootApp() {
        render();
        try {
          if (supabaseClient) {
            const { data } = await supabaseClient.auth.getSession();
            if (data && data.session) {
              state.session = data.session;
              state.isAuthenticated = true;
              state.userEmail = data.session.user ? data.session.user.email : '';
              await loadUserWorkspace();
            }

            supabaseClient.auth.onAuthStateChange(async (event, session) => {
              if (event === 'SIGNED_IN' && session && !state.isAuthenticated) {
                await handleSignedInSession(session);
              } else if (event === 'SIGNED_OUT') {
                state.session = null;
                state.isAuthenticated = false;
                state.permissionsGranted = false;
                state.records = [];
              }
            });
          }
        } catch (_) {
          // Keep landing accessible even if config is not set yet
        } finally {
          state.booting = false;
          syncFromHash();
          render();
        }
      }

      window.addEventListener('hashchange', () => {
        syncFromHash();
        render();
      });

      bootApp();
    })();
  </script>
</body>
</html>
