<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOOP — Personal Archive &amp; Reminders</title>

  <!-- Google Fonts: Cormorant Garamond (600/700) & Hanken Grotesk (400/500/600/700) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS CDN (swap to /static/styles.css once you add a build step) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;

      /* Dark-first Neoclassical Navy & Antique Brass */
      --bg-page: #0A1228;
      --text-primary: #EDEFF5;
      --text-muted: #9AA6C0;
      --panel-bg: rgba(16, 27, 58, 0.88);
      --panel-border: #26365F;
      --subpanel-bg: rgba(10, 18, 40, 0.86);
      --subpanel-border: #26365F;
      --brass-accent: #D4AE5E;
      --brass-soft: rgba(212, 174, 94, 0.14);
      --brass-border: rgba(212, 174, 94, 0.44);
      --verdigris: #6CCBB2;
      --verdigris-soft: rgba(108, 203, 178, 0.14);
      --input-bg: rgba(10, 18, 40, 0.94);
      --input-border: #26365F;
      --btn-primary-bg: #D4AE5E;
      --btn-primary-hover: #E0BE74;
      --btn-primary-text: #0A1228;
      --btn-secondary-bg: rgba(16, 27, 58, 0.88);
      --btn-secondary-text: #EDEFF5;
      --brass-glow: rgba(212, 174, 94, 0.14);
      --amber-card-bg: #271E12;
      --amber-card-border: #D4AE5E;
      --highlight-green-bg: rgba(22, 48, 43, 0.82);
      --highlight-green-border: #6CCBB2;
      --highlight-brass-bg: rgba(45, 34, 18, 0.9);
      --highlight-brass-border: #D4AE5E;
    }

    html.light {
      /* Light Marble & Antique Brass */
      --bg-page: #ECEFF2;
      --text-primary: #101B33;
      --text-muted: #4E5B78;
      --panel-bg: rgba(255, 255, 255, 0.84);
      --panel-border: #CBD3E1;
      --subpanel-bg: rgba(246, 248, 250, 0.94);
      --subpanel-border: #CBD3E1;
      --brass-accent: #A67C2E;
      --brass-soft: rgba(166, 124, 46, 0.12);
      --brass-border: rgba(166, 124, 46, 0.45);
      --verdigris: #1E8A6E;
      --verdigris-soft: rgba(30, 138, 110, 0.12);
      --input-bg: rgba(255, 255, 255, 0.96);
      --input-border: #CBD3E1;
      --btn-primary-bg: #A67C2E;
      --btn-primary-hover: #8E6822;
      --btn-primary-text: #FFFFFF;
      --btn-secondary-bg: rgba(255, 255, 255, 0.94);
      --btn-secondary-text: #101B33;
      --brass-glow: rgba(166, 124, 46, 0.10);
      --amber-card-bg: #FDF6E7;
      --amber-card-border: #A67C2E;
      --highlight-green-bg: rgba(30, 138, 110, 0.11);
      --highlight-green-border: #1E8A6E;
      --highlight-brass-bg: #FDF6E7;
      --highlight-brass-border: #A67C2E;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
      background-color: var(--bg-page);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.22s ease, color 0.22s ease;
    }

    .font-serif-display { font-family: var(--font-serif); }

    .fluted-surface {
      background-image: repeating-linear-gradient(
        90deg,
        rgba(212, 174, 94, 0.035) 0px,
        rgba(212, 174, 94, 0.035) 1px,
        transparent 1px,
        transparent 18px,
        rgba(255, 255, 255, 0.018) 18px,
        rgba(255, 255, 255, 0.018) 28px,
        transparent 28px,
        transparent 44px
      );
    }

    html.light .fluted-surface {
      background-image: repeating-linear-gradient(
        90deg,
        rgba(166, 124, 46, 0.045) 0px,
        rgba(166, 124, 46, 0.045) 1px,
        transparent 1px,
        transparent 18px,
        rgba(16, 27, 51, 0.025) 18px,
        rgba(16, 27, 51, 0.025) 28px,
        transparent 28px,
        transparent 44px
      );
    }

    .fluted-navy-sidebar {
      background-color: #0A1228;
      background-image: repeating-linear-gradient(
        90deg,
        rgba(212, 174, 94, 0.04) 0px,
        rgba(212, 174, 94, 0.04) 1px,
        transparent 1px,
        transparent 18px,
        rgba(255, 255, 255, 0.02) 18px,
        rgba(255, 255, 255, 0.02) 28px,
        transparent 28px,
        transparent 44px
      );
    }

    .neo-panel {
      background-color: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
    }

    .neo-subpanel {
      background-color: var(--subpanel-bg);
      border: 1px solid var(--subpanel-border);
      border-radius: 12px;
    }

    .neo-muted { color: var(--text-muted); }
    .neo-brass-text { color: var(--brass-accent); }
    .neo-verdigris-text { color: var(--verdigris); }
    .neoclassical-arch { border-radius: 9999px 9999px 16px 16px; }

    .btn-primary {
      background-color: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.12s ease, opacity 0.15s ease;
    }
    .btn-primary:hover:not(:disabled) { background-color: var(--btn-primary-hover); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-secondary {
      background-color: var(--btn-secondary-bg);
      color: var(--btn-secondary-text);
      border: 1px solid var(--input-border);
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }
    .btn-secondary:hover { border-color: var(--brass-accent); }

    .neo-input {
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--text-primary);
    }
    .neo-input::placeholder { color: var(--text-muted); opacity: 0.72; }

    .pricing-card-glow {
      border-color: var(--panel-border);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .pricing-card-glow:hover {
      border-color: var(--brass-accent) !important;
      box-shadow: 0 0 32px rgba(212, 174, 94, 0.22);
    }

    .pricing-card-plus {
      border-color: var(--brass-border);
      box-shadow: 0 0 22px rgba(212, 174, 94, 0.10);
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .pricing-card-plus:hover {
      border-color: var(--brass-accent) !important;
      box-shadow: 0 0 36px rgba(212, 174, 94, 0.26);
    }

    @keyframes drawBrassRing {
      from { stroke-dashoffset: 805; opacity: 0.45; }
      to { stroke-dashoffset: 0; opacity: 1; }
    }
    .ring-draw-path {
      stroke-dasharray: 805;
      stroke-dashoffset: 0;
      animation: drawBrassRing 1.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes scanSweep {
      0% { top: 2%; opacity: 0.95; }
      95% { top: 96%; opacity: 0.95; }
      100% { top: 98%; opacity: 0; }
    }
    .scan-beam {
      position: absolute;
      left: 0;
      right: 0;
      z-index: 20;
      pointer-events: none;
      animation: scanSweep 2.4s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .ring-draw-path, .scan-beam { animation: none !important; }
    }
  </style>
</head>
<body class="min-h-screen fluted-surface">

  <!-- ROOT CONTAINER RENDERED BY UNIFIED ROUTER -->
  <div id="root-app"></div>

  <!-- CERTIFICATE MODAL ("Open original" / "Open source") -->
  <div
    id="certificate-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
    class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#0A1228]/70 backdrop-blur-xs"
  >
    <div id="certificate-modal-card" class="w-full max-w-xl neo-panel shadow-2xl overflow-hidden">
      <div class="pt-2 px-2">
        <div class="border-t-[4px] border-double" style="border-color: var(--brass-accent);"></div>
      </div>
      <div class="px-6 py-4 border-b flex items-center justify-between gap-3" style="border-color: var(--panel-border);">
        <div>
          <h2 id="modal-title" class="font-serif-display text-2xl font-bold"></h2>
          <p id="modal-subtitle" class="text-xs mt-0.5 neo-muted"></p>
        </div>
        <button type="button" id="modal-close-top" aria-label="Close certificate preview" class="p-2 rounded-lg btn-secondary">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div id="modal-body" class="p-6 space-y-4 max-h-[70vh] overflow-y-auto"></div>
      <div class="px-6 py-3.5 border-t flex items-center justify-between gap-3" style="border-color: var(--panel-border);">
        <span id="modal-footer-note" class="text-xs neo-muted"></span>
        <button type="button" id="modal-close-bottom" class="px-4 py-2 rounded-[10px] text-xs btn-primary">
          Close
        </button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION BANNER -->
  <div
    id="toast-banner"
    role="status"
    aria-live="polite"
    class="hidden fixed bottom-5 right-5 z-50 flex items-center gap-2.5 px-4 py-3 rounded-[12px] bg-[#101B3A] border border-[#D4AE5E] text-[#EDEFF5] shadow-xl text-sm font-medium"
  >
    <svg class="w-4 h-4 text-[#6CCBB2] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
      <polyline points="22 4 12 14.01 9 11.01" />
    </svg>
    <span id="toast-message">Action completed</span>
  </div>

  <script>
    (function () {
      'use strict';

      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // ----------------------------------------------------------------------
      // CENTRALIZED API MODULE (HttpOnly cookie session + CSRF + friendly errors)
      // ----------------------------------------------------------------------
      const API = (function () {
        let onUnauthorized = null;

        function getCookie(name) {
          const match = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
          return match ? decodeURIComponent(match[1]) : '';
        }

        function friendlyMessage(status, detail) {
          if (status === 0) return 'Unable to reach LOOP right now. Check your connection and try again.';
          if (status === 401) return 'Your session expired. Please sign in again.';
          if (status === 403) return detail || 'Action blocked. Please refresh the page and try again.';
          if (status === 404) return detail || 'That item could not be found.';
          if (status === 409) return detail || 'This item changed state. Please refresh and try again.';
          if (status === 413) return 'File is too large. Please upload a file under 10 MB.';
          if (status === 415) return detail || 'Unsupported file type. Use PDF, JPG, or PNG.';
          if (status === 429) return 'Too many requests. Wait a moment and try again.';
          if (status >= 500) return 'Something went wrong on our side. Please try again in a moment.';
          return detail || 'Request failed. Please try again.';
        }

        async function request(path, options = {}) {
          const method = (options.method || 'GET').toUpperCase();
          const isFormData = typeof FormData !== 'undefined' && options.body instanceof FormData;
          const headers = { ...(options.headers || {}) };

          if (options.body && !isFormData && !headers['Content-Type']) {
            headers['Content-Type'] = 'application/json';
          }
          if (!['GET', 'HEAD', 'OPTIONS'].includes(method)) {
            headers['X-CSRF-Token'] = getCookie('loop_csrf');
          }

          let res;
          try {
            res = await fetch(path, { ...options, method, headers, credentials: 'same-origin' });
          } catch (_netErr) {
            const err = new Error(friendlyMessage(0));
            err.status = 0;
            throw err;
          }

          if (res.status === 204) return null;

          if (options.responseType === 'blob') {
            if (!res.ok) {
              const err = new Error(friendlyMessage(res.status));
              err.status = res.status;
              throw err;
            }
            return res.blob();
          }

          const ct = res.headers.get('content-type') || '';
          const data = ct.includes('application/json') ? await res.json().catch(() => null) : null;

          if (!res.ok) {
            const detail = data && typeof data.detail === 'string' ? data.detail : '';
            if (res.status === 401 && typeof onUnauthorized === 'function' && !options.skipAuthRedirect) {
              onUnauthorized();
            }
            const err = new Error(friendlyMessage(res.status, detail));
            err.status = res.status;
            throw err;
          }
          return data;
        }

        return {
          setUnauthorizedHandler(fn) { onUnauthorized = fn; },
          getMe() { return request('/api/v1/auth/me', { skipAuthRedirect: true }); },
          signup(email, password, consentAccepted) {
            return request('/api/v1/auth/signup', {
              method: 'POST',
              skipAuthRedirect: true,
              body: JSON.stringify({ email, password, consent_accepted: consentAccepted })
            });
          },
          login(email, password) {
            return request('/api/v1/auth/login', {
              method: 'POST',
              skipAuthRedirect: true,
              body: JSON.stringify({ email, password })
            });
          },
          devDemoSignIn() {
            return request('/api/v1/auth/dev-demo-signin', { method: 'POST', skipAuthRedirect: true });
          },
          logout() {
            return request('/api/v1/auth/logout', { method: 'POST', skipAuthRedirect: true });
          },
          updateSettings(payload) {
            return request('/api/v1/settings', { method: 'PATCH', body: JSON.stringify(payload) });
          },
          createUploadUrl(filename, mimeType, sizeBytes) {
            return request('/api/v1/documents/upload-url', {
              method: 'POST',
              body: JSON.stringify({ filename, mime_type: mimeType, size_bytes: sizeBytes })
            });
          },
          async uploadFileToSignedUrl(uploadUrl, file) {
            let res;
            try {
              res = await fetch(uploadUrl, { method: 'PUT', headers: { 'Content-Type': file.type }, body: file });
            } catch (_e) {
              throw new Error('File upload failed due to a network error. Please try again.');
            }
            if (!res.ok) throw new Error('Direct file upload failed. Please try again.');
          },
          confirmUpload(docId) {
            return request(`/api/v1/documents/${encodeURIComponent(docId)}/confirm-upload`, { method: 'POST' });
          },
          submitText(text) {
            return request('/api/v1/documents/text', { method: 'POST', body: JSON.stringify({ text }) });
          },
          submitVoice(blob) {
            const form = new FormData();
            form.append('file', blob, 'voice-note.webm');
            return request('/api/v1/documents/voice', { method: 'POST', body: form });
          },
          getDocumentStatus(docId) {
            return request(`/api/v1/documents/${encodeURIComponent(docId)}/status`);
          },
          getDocumentDraft(docId) {
            return request(`/api/v1/documents/${encodeURIComponent(docId)}/draft`);
          },
          patchDocumentDraft(docId, payload) {
            return request(`/api/v1/documents/${encodeURIComponent(docId)}/draft`, {
              method: 'PATCH',
              body: JSON.stringify(payload)
            });
          },
          resolveChoice(docId, payload) {
            return request(`/api/v1/documents/${encodeURIComponent(docId)}/resolve-choice`, {
              method: 'POST',
              body: JSON.stringify(payload)
            });
          },
          approveDocument(docId, payload) {
            return request(`/api/v1/documents/${encodeURIComponent(docId)}/approve`, {
              method: 'POST',
              body: JSON.stringify(payload)
            });
          },
          dismissDocument(docId) {
            return request(`/api/v1/documents/${encodeURIComponent(docId)}/dismiss`, { method: 'POST' });
          },
          listRecords(params = {}) {
            const qs = new URLSearchParams();
            if (params.q) qs.set('q', params.q);
            if (params.category && params.category !== 'All') qs.set('category', params.category);
            if (params.status) qs.set('status', params.status);
            const suffix = qs.toString() ? `?${qs.toString()}` : '';
            return request(`/api/v1/records${suffix}`);
          },
          getRecord(recordId) {
            return request(`/api/v1/records/${encodeURIComponent(recordId)}`);
          },
          updateRecordStatus(recordId, status) {
            return request(`/api/v1/records/${encodeURIComponent(recordId)}/status`, {
              method: 'PATCH',
              body: JSON.stringify({ status })
            });
          },
          deleteRecord(recordId) {
            return request(`/api/v1/records/${encodeURIComponent(recordId)}`, { method: 'DELETE' });
          },
          ask(query, category) {
            return request('/api/v1/ask', { method: 'POST', body: JSON.stringify({ query, category: category || null }) });
          },
          getUnreadNotifications() {
            return request('/api/v1/notifications/unread', { skipAuthRedirect: true });
          },
          markNotificationRead(deliveryId) {
            return request(`/api/v1/notifications/${encodeURIComponent(deliveryId)}/read`, { method: 'POST' });
          },
          exportAccountZip() {
            return request('/api/v1/account/export', { responseType: 'blob' });
          },
          deleteAccount() {
            return request('/api/v1/account', { method: 'DELETE', body: JSON.stringify({ confirm: 'DELETE' }) });
          },
          resetDemoData() {
            return request('/api/v1/dev/reset-demo-data', { method: 'POST' });
          }
        };
      })();

      // ----------------------------------------------------------------------
      // UNIFIED APPLICATION STATE
      // ----------------------------------------------------------------------
      const state = {
        route: 'landing',
        appTab: 'today',
        lightMode: false,
        mobileMenuOpen: false,
        isBootstrapping: true,

        isAuthenticated: false,
        devDemoEnabled: false,
        userName: '',
        userEmail: '',
        userTimezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Kolkata',
        authEmailInput: '',
        authConsentChecked: false,
        authErrors: {},
        authSubmitting: false,

        permissionsGranted: false,
        permissions: {
          documentAccess: true,
          notifications: true,
          microphone: false,
          leadTime: '2 days before'
        },

        landingAmbiguousChoice: null,
        openFaqIndex: 0,
        waitlistMessage: '',

        records: [],
        recordsLoading: false,
        recordsError: '',
        selectedRingItemId: null,

        addInputTab: 'file',
        uploadError: '',
        pastedText: '',
        isRecording: false,
        recordingSeconds: 0,
        scanDoc: null,
        isScanning: false,
        scanStage: 0,
        selectedChoiceId: null,
        draftIssuer: '',
        draftCategory: 'Bill',
        draftAmount: '',
        draftDueDate: '',
        draftReminderTiming: '2 days before',
        isApproving: false,

        vaultSearch: '',
        vaultFilter: 'All',
        vaultRecords: [],
        vaultLoading: false,
        vaultError: '',

        askQuery: '',
        askLoading: false,
        askResult: null,
        typedAnswer: '',
        typingComplete: false,

        channels: {
          emailDigest: true,
          pushNotifications: true,
          smsFallback: false
        },
        consents: {
          localParsing: true,
          patternInsights: true,
          modelTraining: false
        },
        confirmDelete: false
      };

      let pollTimer = null;
      let typewriterTimer = null;
      let recordingInterval = null;
      let mediaRecorder = null;
      let audioChunks = [];
      let vaultSearchTimer = null;
      let notifPollInterval = null;
      let toastTimeout = null;

      // ----------------------------------------------------------------------
      // HELPERS (XSS escaping, safe URLs, real timezone dates, integer minor units)
      // ----------------------------------------------------------------------
      function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function isSafeHttpUrl(url) {
        if (!url || typeof url !== 'string') return false;
        try {
          const parsed = new URL(url, window.location.origin);
          return parsed.protocol === 'https:' || parsed.protocol === 'http:';
        } catch (_e) {
          return false;
        }
      }

      function showToast
