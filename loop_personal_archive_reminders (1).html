      --bg-page: #0A1228;

      --highlight-brass-bg: #FDF6E7;

    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
      background-color: var(--bg-page);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.45s cubic-bezier(0.22, 1, 0.36, 1), color 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Slow, smooth neoclassical page, tab, and step transitions */
    @keyframes pageEnterSmooth {
      0% {
        opacity: 0;
        transform: translateY(18px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes tabGlideSmooth {
      0% {
        opacity: 0;
        transform: translateY(12px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes modalRevealSmooth {
      0% {
        opacity: 0;
        transform: translateY(14px) scale(0.975);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .page-stage {
      will-change: opacity, transform;
      transition: opacity 0.34s cubic-bezier(0.22, 1, 0.36, 1), transform 0.34s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .page-stage.is-leaving {
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
    }

    .page-enter {
      animation: pageEnterSmooth 0.68s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .tab-enter {
      animation: tabGlideSmooth 0.56s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .step-enter {
      animation: tabGlideSmooth 0.52s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .modal-enter {
      animation: modalRevealSmooth 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .font-serif-display {
      font-family: var(--font-serif);
    }

    /* Fluted Neoclassical Column Stripes */
    .fluted-surface {
      background-image: repeating-linear-gradient(
        90deg,
        rgba(212, 174, 94, 0.035) 0px,
        rgba(212, 174, 94, 0.035) 1px,
        transparent 1px,
        transparent 18px,
        rgba(255, 255, 255, 0.018) 18px,
        rgba(255, 255, 255, 0.018) 28px,
        transparent 28px,
        transparent 44px
      );
    }

    html.light .fluted-surface {
      background-image: repeating-linear-gradient(
        90deg,
        rgba(166, 124, 46, 0.045) 0px,
        rgba(166, 124, 46, 0.045) 1px,
        transparent 1px,
        transparent 18px,
        rgba(16, 27, 51, 0.025) 18px,
        rgba(16, 27, 51, 0.025) 28px,
        transparent 28px,
        transparent 44px

      background-color: #0A1228;
      background-image: repeating-linear-gradient(

        rgba(212, 174, 94, 0.04) 0px,
        rgba(212, 174, 94, 0.04) 1px,
        transparent 1px,
        transparent 18px,
        rgba(255, 255, 255, 0.02) 18px,
        rgba(255, 255, 255, 0.02) 28px,
        transparent 28px,
        transparent 44px
      );
    }

    /* Frosted Glass Neoclassical Panels (16px radius) */
    .neo-panel {
      background-color: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
    }

    .neo-subpanel {
      background-color: var(--subpanel-bg);
      border: 1px solid var(--subpanel-border);
      border-radius: 12px;
    }

    .neo-muted {
      color: var(--text-muted);
    }

    .neo-brass-text {
      color: var(--brass-accent);
    }

    .neo-verdigris-text {
      color: var(--verdigris);
    }

    .neoclassical-arch {
      border-radius: 9999px 9999px 16px 16px;
    }

    .btn-primary {
      background-color: var(--btn-primary-bg);
      color: var(--btn-primary-text);
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.12s ease, opacity 0.15s ease;
    }
    .btn-primary:hover:not(:disabled) {
      background-color: var(--btn-primary-hover);
    }
    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: var(--btn-secondary-bg);
      color: var(--btn-secondary-text);
      border: 1px solid var(--input-border);
      font-weight: 500;
      cursor: pointer;

    .pricing-card-plus:hover {

      from {
        stroke-dashoffset: 805;
        opacity: 0.45;
      }
      to {

        opacity: 1;
      }
    }

    .ring-draw-path {
      stroke-dasharray: 805;
      stroke-dashoffset: 0;
      animation: drawBrassRing 1.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes scanSweep {
      0% { top: 2%; opacity: 0.95; }

    .scan-beam {
      position: absolute;
      left: 0;
      right: 0;
      z-index: 20;
      pointer-events: none;
      animation: scanSweep 2.4s linear forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
      .ring-draw-path, .scan-beam, .page-enter, .tab-enter, .step-enter, .modal-enter {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>

      function getCookie(name) {
        const prefix = `${name}=`;
        const parts = (document.cookie || '').split(';');
        for (let i = 0; i < parts.length; i++) {
          const item = parts[i].trim();
          if (item.startsWith(prefix)) {
            return decodeURIComponent(item.slice(prefix.length));
          }
        }
        return '';
      }

      async function apiFetch(path, options = {}) {
        const method = (options.method || 'GET').toUpperCase();
        const headers = { ...(options.headers || {}) };
        if (options.body && !(options.body instanceof FormData) && !headers['Content-Type']) {
          headers['Content-Type'] = 'application/json';
        }
        if (method !== 'GET' && method !== 'HEAD' && method !== 'OPTIONS') {
          const csrf = getCookie('loop_csrf');
          if (csrf) headers['X-CSRF-Token'] = csrf;
        }
        const res = await fetch(path, {
          ...options,
          method,
          headers,
          credentials: 'same-origin'
        });
        let data = null;
        const ct = (res.headers.get('content-type') || '').toLowerCase();
        if (ct.includes('application/json')) {
          try {
            data = await res.json();
          } catch (_e) {
            data = null;
          }
        }
        return { ok: res.ok, status: res.status, data };
      }

        } catch (_e) {}
      }

      function deriveDisplayName(email) {
        const base = (email || '').split('@')[0].replace(/[._-]+/g, ' ').trim();
        return (
          base
            .split(/\s+/)
            .filter(Boolean)
            .map((w) => w.charAt(0).toUpperCase() + w.slice(1))
            .join(' ') || 'LOOP Member'
        );
      }

      function applyOAuthErrorFromHash() {
        const raw = window.location.hash || '';
        const qIndex = raw.indexOf('?');
        if (qIndex === -1) return;
        const params = new URLSearchParams(raw.slice(qIndex + 1));
        const err = params.get('error');
        if (!err) return;
        const errorMap = {
          google_not_enabled:
            'Google sign-in is not enabled in Supabase yet. Enable Google under Supabase → Authentication → Providers, or sign in with email below.',
          oauth_failed: 'Google sign-in was cancelled or failed. Please try again.',
          oauth_state: 'Sign-in verification expired. Please try Google sign-in again.',
          oauth_exchange: 'Could not complete Google sign-in with Supabase. Please try again.'
        };
        state.authErrors = { form: errorMap[err] || 'Unable to complete sign-in. Please try again.' };
      }

      async function hydrateSessionOnBoot() {
        const isHttp = window.location.protocol === 'http:' || window.location.protocol === 'https:';
        const isPreviewHost =
          !isHttp ||
          window.location.hostname.includes('usercontent.goog') ||
          window.location.hostname === '' ||
          window.location.origin === 'null';

        if (!isPreviewHost) {
          try {
            const res = await apiFetch('/api/v1/auth/me', { method: 'GET' });
            if (res.ok && res.data && typeof res.data.authenticated === 'boolean') {
              state.backendAvailable = true;
              state.googleOauthEnabled = res.data.google_oauth_enabled !== false;
              state.devDemoEnabled = Boolean(res.data.dev_demo_enabled);
              if (res.data.authenticated && res.data.user) {
                state.isAuthenticated = true;
                state.userEmail = res.data.user.email || '';
                state.userName = res.data.user.name || deriveDisplayName(state.userEmail);
                state.permissionsGranted = Boolean(res.data.user.permissions_granted);
                if (res.data.settings && res.data.settings.permissions) {
                  const p = res.data.settings.permissions;
                  state.permissions.documentAccess = Boolean(p.document_access);
                  state.permissions.notifications = Boolean(p.notifications);
                  state.permissions.microphone = Boolean(p.microphone);
                  const ld = Number(p.lead_days);
                  state.permissions.leadTime =
                    ld === 1 ? '1 day before' : ld === 7 ? '1 week before' : '2 days before';
                }
              }
              syncFromHash();
              applyOAuthErrorFromHash();
              render();
              return;
            }
          } catch (_e) {
            state.backendAvailable = false;
          }
        }

        // Standalone preview mode: restore saved local preview session if present
        state.backendAvailable = false;
        const localSess = loadPreviewSession();
        if (localSess && localSess.email) {
          state.isAuthenticated = true;
          state.userEmail = localSess.email;
          state.userName = localSess.name || deriveDisplayName(localSess.email);
          state.permissionsGranted = Boolean(localSess.permissionsGranted);
        }
        syncFromHash();
        applyOAuthErrorFromHash();
        render();
      }

      let navTransitionTimer = null;

      function transitionAndRender(kind, applyStateFn, scrollTop) {
        const root = document.getElementById('root-app');
        if (navTransitionTimer) {
          clearTimeout(navTransitionTimer);
          navTransitionTimer = null;
        }

        if (prefersReducedMotion || !root || !root.innerHTML.trim()) {
          applyStateFn();
          state.animateNext = null;
          render();
          if (scrollTop) window.scrollTo({ top: 0, behavior: 'auto' });
          return;
        }

        const isFullPage = kind === 'page';
        const targetEl = isFullPage ? root : (document.getElementById('dash-tab-stage') || root);
        targetEl.classList.add('is-leaving');

        navTransitionTimer = setTimeout(() => {
          navTransitionTimer = null;
          applyStateFn();
          state.animateNext = kind;
          render();
          const refreshedRoot = document.getElementById('root-app');
          if (refreshedRoot) refreshedRoot.classList.remove('is-leaving');
          if (scrollTop) window.scrollTo({ top: 0, behavior: 'smooth' });
        }, isFullPage ? 300 : 210);
      }

      function navigateTo(targetRoute, targetAppTab) {
        let resolvedRoute = targetRoute;
        const resolvedTab = targetAppTab || state.appTab;

        // Guard dashboard routes so user passes through Sign In & Permissions first
        if (resolvedRoute === 'app') {
          if (!state.isAuthenticated) {
            resolvedRoute = 'login';
          } else if (!state.permissionsGranted) {
            resolvedRoute = 'permissions';
          }
        } else if (resolvedRoute === 'permissions' && !state.isAuthenticated) {
          resolvedRoute = 'login';
        }

        const routeChanged = resolvedRoute !== state.route;
        const tabChanged = resolvedRoute === 'app' && resolvedTab !== state.appTab;
        if (!routeChanged && !tabChanged) {
          state.mobileMenuOpen = false;
          render();
          return;
        }

        const transitionKind = routeChanged ? 'page' : 'tab';
        transitionAndRender(
          transitionKind,
          () => {
            state.route = resolvedRoute;
            if (targetAppTab) state.appTab = targetAppTab;
            state.mobileMenuOpen = false;

            const hashMap = {
              landing: '#/',
              login: '#/login',
              signup: '#/signup',
              permissions: '#/permissions',
              app: state.appTab === 'today' ? '#/app' : `#/app/${state.appTab}`
            };
            const nextHash = hashMap[resolvedRoute] || '#/';
            if (window.location.hash !== nextHash) {
              history.replaceState(null, '', nextHash);
            }
          },
          true
        );
      }

      function syncFromHash() {
        const rawWithQuery = (window.location.hash || '#/').replace(/^#/, '');
        const raw = rawWithQuery.split('?')[0];
        if (raw === '/signup') {
          state.route = 'signup';
        } else if (raw === '/login') {
          state.route = 'login';
        } else if (raw === '/permissions') {
          state.route = state.isAuthenticated ? 'permissions' : 'login';
        } else if (raw.startsWith('/app')) {
          const sub = raw.split('/')[2] || 'today';
          if (['today', 'add', 'vault', 'ask', 'settings'].includes(sub)) {
            state.appTab = sub;
          }
          if (!state.isAuthenticated) {
            state.route = 'login';
          } else if (!state.permissionsGranted) {
            state.route = 'permissions';
          } else {
            state.route = 'app';
          }
        } else {
          state.route = 'landing';
        }
      }

      function calculateDaysFromRefToday(isoDate) {
        const ref = new Date(2026, 10, 26); // Thu 26 Nov 2026
        const parts = isoDate.split('-').map(Number);
        if (parts.length !== 3 || parts.some(isNaN)) return 12;
        const target = new Date(parts[0], parts[1] - 1, parts[2]);
        return Math.max(0, Math.round((target - ref) / (1000 * 60 * 60 * 24)));
      }

      function formatDisplayDate(isoDate) {
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        if (parts.length !== 3 || parts.some(isNaN)) return isoDate;
        return `${parts[2]} ${months[parts[1] - 1]} ${parts[0]}`;
      }

      function bindLandingEvents() {
        document.querySelectorAll('[data-go-route]').forEach((btn) => {
          btn.addEventListener('click', () => {
            navigateTo(btn.getAttribute('data-go-route'));
          });
        });

        document.querySelectorAll('[data-scroll-id]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const el = document.getElementById(btn.getAttribute('data-scroll-id'));
            if (el) el.scrollIntoView({ behavior: prefersReducedMotion ? 'auto' : 'smooth' });
          });
        });

        const toggleThemeHandler = () => {
          state.lightMode = !state.lightMode;
          render();
        };
        const t1 = document.getElementById('landing-theme-btn');
        const t2 = document.getElementById('landing-theme-mobile-btn');
        if (t1) t1.addEventListener('click', toggleThemeHandler);
        if (t2) t2.addEventListener('click', toggleThemeHandler);

        document.querySelectorAll('[data-ambiguous-pick]').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.landingAmbiguousChoice = btn.getAttribute('data-ambiguous-pick');
            render();
          });
        });

        document.querySelectorAll('[data-waitlist-tier]').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.waitlistMessage = `You are on the early-access list for ${btn.getAttribute('data-waitlist-tier')}.`;
            render();
          });
        });

        document.querySelectorAll('[data-faq-idx]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const idx = Number(btn.getAttribute('data-faq-idx'));
            state.openFaqIndex = state.openFaqIndex === idx ? null : idx;
            render();
          });
        });
      }

      function bindAuthEvents(mode) {
        document.querySelectorAll('[data-go-route]').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.authErrors = {};
            state.authNotice = '';
            state.authSubmitting = false;
            navigateTo(btn.getAttribute('data-go-route'));
          });
        });

        const emailEl = document.getElementById('auth-email');
        const passEl = document.getElementById('auth-password');
        const consentEl = document.getElementById('auth-consent');
        const toggleVisBtn = document.getElementById('toggle-password-vis-btn');

        if (emailEl) {
          emailEl.addEventListener('input', (e) => {
            state.authEmailInput = e.target.value;
          });
        }
        if (passEl) {
          passEl.addEventListener('input', (e) => {
            state.authPasswordInput = e.target.value;
          });
        }
        if (consentEl) {
          consentEl.addEventListener('change', (e) => {
            state.authConsentChecked = e.target.checked;
          });
        }
        if (toggleVisBtn) {
          toggleVisBtn.addEventListener('click', () => {
            if (emailEl) state.authEmailInput = emailEl.value;
            if (passEl) state.authPasswordInput = passEl.value;
            state.authShowPassword = !state.authShowPassword;
            render();
          });
        }

        const finishAuthenticated = (userObj, goPermissions) => {
          state.isAuthenticated = true;
          state.userEmail = (userObj && userObj.email) || state.authEmailInput.trim().toLowerCase() || 'aarav.sharma@domain.in';
          state.userName = (userObj && userObj.name) || deriveDisplayName(state.userEmail);
          state.permissionsGranted = !goPermissions;
          state.authPasswordInput = '';
          state.authShowPassword = false;
          state.authSubmitting = false;
          state.authErrors = {};
          state.authNotice = '';
          if (!state.backendAvailable) {
            savePreviewSession({
              email: state.userEmail,
              name: state.userName,
              permissionsGranted: state.permissionsGranted
            });
          }
          if (goPermissions) {
            navigateTo('permissions');
          } else {
            navigateTo('app', 'today');
          }
        };

        const googleBtn = document.getElementById('google-auth-btn');
        if (googleBtn) {
          googleBtn.addEventListener('click', () => {
            if (state.authSubmitting) return;
            state.authErrors = {};
            state.authNotice = '';
            if (state.backendAvailable) {
              if (!state.googleOauthEnabled) {
                state.authErrors = {
                  form: 'Google sign-in is not enabled in Supabase yet. Enable Google under Supabase → Authentication → Providers, or continue with email below.'
                };
                render();
                return;
              }
              state.authSubmitting = true;
              render();
              window.location.assign('/api/v1/auth/google');
              return;
            }
            showToast('Signed in with Google (preview mode)');
            finishAuthenticated(
              { email: 'aarav.sharma@gmail.com', name: 'Aarav Sharma' },
              mode === 'signup'
            );
          });
        }

        const quickDemoBtn = document.getElementById('quick-demo-signin-btn');
        if (quickDemoBtn) {
          quickDemoBtn.addEventListener('click', async () => {
            if (state.authSubmitting) return;
            state.authErrors = {};
            state.authNotice = '';
            if (state.backendAvailable) {
              state.authSubmitting = true;
              render();
              try {
                const res = await apiFetch('/api/v1/auth/dev-demo-signin', { method: 'POST' });
                if (!res.ok || !res.data || !res.data.authenticated) {
                  state.authSubmitting = false;
                  state.authErrors = { form: (res.data && res.data.detail) || 'Demo sign-in is disabled on this server.' };
                  render();
                  return;
                }
                const goPerms = !res.data.user.permissions_granted;
                showToast('Signed in to demo workspace');
                finishAuthenticated(res.data.user, goPerms);
              } catch (_e) {
                state.authSubmitting = false;
                state.authErrors = { form: 'Could not reach the server. Please try again.' };
                render();
              }
              return;
            }
            showToast('Signed in to demo workspace');
            finishAuthenticated({ email: 'demo@loop.local', name: 'Aarav Sharma' }, mode === 'signup');
          });
        }

        const form = document.getElementById('auth-form');
        if (form) {
          form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (state.authSubmitting) return;

            // Read directly from DOM inputs so browser autofill always works
            const emailVal = (emailEl ? emailEl.value : state.authEmailInput).trim().toLowerCase();
            const passVal = passEl ? passEl.value : state.authPasswordInput;
            const consentVal = consentEl ? consentEl.checked : state.authConsentChecked;

            state.authEmailInput = emailVal;
            state.authPasswordInput = passVal;
            state.authConsentChecked = consentVal;
            state.authNotice = '';

            const errs = {};
            if (!emailVal || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailVal)) {
              errs.email = 'Enter a valid email address (for example, aarav@domain.in) to receive your approved reminders.';
            }
            if (passVal.length < 6) {
              errs.password = 'Use at least 6 characters for your password.';
            }
            if (mode === 'signup' && !consentVal) {
              errs.consent = 'Please tick the privacy consent box before continuing.';
            }
            state.authErrors = errs;
            if (Object.keys(errs).length > 0) {
              render();
              return;
            }

            if (state.backendAvailable) {
              state.authSubmitting = true;
              render();
              try {
                const endpoint = mode === 'signup' ? '/api/v1/auth/signup' : '/api/v1/auth/login';
                const payload =
                  mode === 'signup'
                    ? { email: emailVal, password: passVal, consent_accepted: true }
                    : { email: emailVal, password: passVal };
                const res = await apiFetch(endpoint, { method: 'POST', body: JSON.stringify(payload) });

                if (!res.ok) {
                  state.authSubmitting = false;
                  state.authErrors = {
                    form: (res.data && res.data.detail) || (mode === 'signup' ? 'Could not create account.' : 'Invalid email or password.')
                  };
                  render();
                  return;
                }

                if (res.data && res.data.email_confirmation_required) {
                  state.authSubmitting = false;
                  state.authPasswordInput = '';
                  state.authNotice = res.data.message || 'Check your email to confirm your account, then log in.';
                  render();
                  return;
                }

                const userObj = (res.data && res.data.user) || { email: emailVal };
                const goPerms = mode === 'signup' || !userObj.permissions_granted;
                showToast(mode === 'signup' ? 'Account created' : 'Signed in');
                finishAuthenticated(userObj, goPerms);
              } catch (_e) {
                state.authSubmitting = false;
                state.authErrors = { form: 'Network error while connecting to LOOP server. Please try again.' };
                render();
              }
              return;
            }

            // Standalone preview mode: real localStorage account storage & password check
            const accounts = loadPreviewAccounts();
            if (mode === 'signup') {
              if (accounts[emailVal]) {
                state.authErrors = { form: 'An account with this email already exists. Click Log in below.' };
                render();
                return;
              }
              accounts[emailVal] = {
                email: emailVal,
                password: passVal,
                name: deriveDisplayName(emailVal),
                permissionsGranted: false,
                createdAt: new Date().toISOString()
              };
              savePreviewAccounts(accounts);
              showToast('Account saved');
              finishAuthenticated(accounts[emailVal], true);
            } else {
              const existing = accounts[emailVal];
              if (!existing) {
                state.authErrors = { form: 'No account found for this email yet. Click Create free account first.' };
                render();
                return;
              }
              if (existing.password !== passVal) {
                state.authErrors = { form: 'Incorrect password. Please check and try again.' };
                render();
                return;
              }
              showToast('Signed in');
              finishAuthenticated(existing, !existing.permissionsGranted);
            }
          });
        }
      }

      function bindPermissionsEvents() {
        document.querySelectorAll('[data-go-route]').forEach((btn) => {
          btn.addEventListener('click', () => navigateTo(btn.getAttribute('data-go-route')));
        });

        document.querySelectorAll('[data-perm-toggle]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const key = btn.getAttribute('data-perm-toggle');
            state.permissions[key] = !state.permissions[key];
            render();
          });
        });

        document.querySelectorAll('[data-perm-lead]').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.permissions.leadTime = btn.getAttribute('data-perm-lead');
            state.draftReminderTiming = state.permissions.leadTime;
            render();
          });
        });

        const confirmBtn = document.getElementById('confirm-permissions-btn');
        if (confirmBtn) {
          confirmBtn.addEventListener('click', () => {
            if (!state.permissions.documentAccess) return;
            state.permissionsGranted = true;
            state.channels.pushNotifications = state.permissions.notifications;
            state.consents.localParsing = state.permissions.documentAccess;
            if (!state.backendAvailable && state.userEmail) {
              const accounts = loadPreviewAccounts();
              if (accounts[state.userEmail]) {
                accounts[state.userEmail].permissionsGranted = true;
                savePreviewAccounts(accounts);
              }
              savePreviewSession({
                email: state.userEmail,
                name: state.userName,
                permissionsGranted: true
              });
            } else if (state.backendAvailable) {
              const leadDays =
                state.permissions.leadTime === '1 day before'
                  ? 1
                  : state.permissions.leadTime === '1 week before'
                    ? 7
                    : 2;
              apiFetch('/api/v1/settings', {
                method: 'PATCH',
                body: JSON.stringify({
                  complete_onboarding: true,
                  permissions: {
                    document_access: state.permissions.documentAccess,
                    notifications: state.permissions.notifications,
                    microphone: state.permissions.microphone,
                    lead_days: leadDays
                  }
                })
              }).catch(() => {});
            }
            showToast('Permissions saved · Welcome to LOOP');
            navigateTo('app', 'today');
          });
        }
      }

      // ----------------------------------------------------------------------
      // TODAY TAB CONTENT
      // ----------------------------------------------------------------------
      function buildThirtyDayRingSvg(itemsWithin30, selectedItem) {
        const size = 320;
        const cx = 160;
        const cy = 160;
        const radius = 120;

        const brassColor = state.lightMode ? '#A67C2E' : '#D4AE5E';
        const verdigrisColor = state.lightMode ? '#1E8A6E' : '#6CCBB2';
        const trackColor = state.lightMode ? '#CBD3E1' : '#26365F';
        const ringBg = state.lightMode ? '#FFFFFF' : '#0A1228';

        let ticksSvg = '';
        for (let day = 0; day < 30; day++) {
          const angleDeg = -90 + day * 12;
          const rad = (angleDeg * Math.PI) / 180;
          const isWeek = day % 7 === 0;
          const r1 = isWeek ? radius - 11 : radius - 6;
          const r2 = radius;
          ticksSvg += `<line x1="${(cx + r1 * Math.cos(rad)).toFixed(2)}" y1="${(cy + r1 * Math.sin(rad)).toFixed(2)}" x2="${(cx + r2 * Math.cos(rad)).toFixed(2)}" y2="${(cy + r2 * Math.sin(rad)).toFixed(2)}" stroke="${isWeek ? brassColor : trackColor}" stroke-width="${isWeek ? 1.9 : 1.1}" stroke-linecap="round" />`;
        }

        const markersSvg = itemsWithin30
          .map((item) => {
            const angleDeg = -90 + item.daysFromToday * 12;
            const rad = (angleDeg * Math.PI) / 180;
            const mx = (cx + radius * Math.cos(rad)).toFixed(2);
            const my = (cy + radius * Math.sin(rad)).toFixed(2);
            const isSelected = selectedItem && selectedItem.id === item.id;
            return `
              <g role="button" tabindex="0" data-select-ring-id="${item.id}" class="cursor-pointer">
                ${
                  isSelected
                    ? `<circle cx="${mx}" cy="${my}" r="15" fill="${brassColor}" fill-opacity="0.18" /><circle cx="${mx}" cy="${my}" r="10.5" fill="none" stroke="${brassColor}" stroke-width="1.2" />`
                    : ''
                }
                <circle cx="${mx}" cy="${my}" r="${isSelected ? 7.5 : 5.5}" fill="${brassColor}" stroke="${ringBg}" stroke-width="1.8" />
              </g>
            `;
          })
          .join('');

        return `
          <div class="flex flex-col items-center">
            <div class="relative w-full max-w-[310px] aspect-square flex items-center justify-center">
              <svg viewBox="0 0 ${size} ${size}" class="w-full h-full overflow-visible">
                <circle cx="${cx}" cy="${cy}" r="${radius + 12}" fill="none" stroke="${trackColor}" stroke-width="1" />
                <circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="${trackColor}" stroke-width="1.8" />
                ${ticksSvg}
                <circle cx="${cx}" cy="${cy - radius}" r="6" fill="${verdigrisColor}" stroke="${ringBg}" stroke-width="1.8" />
                <text x="${cx}" y="${cy - radius - 14}" text-anchor="middle" fill="${verdigrisColor}" font-size="11" font-weight="600">Today</text>
                ${markersSvg}
              </svg>

              <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-12 pointer-events-none">
                ${
                  selectedItem
                    ? `
                      <span class="font-serif-display text-6xl font-bold leading-none" style="color: var(--text-primary);">${selectedItem.daysFromToday}</span>
                      <span class="text-xs font-medium mt-1 neo-muted">${selectedItem.daysFromToday === 1 ? 'day left' : 'days left'}</span>
                      <p class="font-serif-display text-lg font-bold leading-tight mt-2 line-clamp-2">${escapeHtml(selectedItem.title)}</p>
                      <span class="text-xs mt-1 font-medium neo-brass-text">${escapeHtml(selectedItem.dueDateDisplay)} · ${escapeHtml(selectedItem.amount)}</span>
                    `
                    : `<p class="font-serif-display text-xl font-bold">All caught up</p>`
                }
              </div>
            </div>

            ${
              selectedItem
                ? `
                  <div class="mt-2">
                    <button type="button" id="mark-paid-btn" data-mark-paid-id="${selectedItem.id}" class="px-4 py-2 rounded-[10px] text-xs btn-secondary">
                      Mark as paid
                    </button>
                  </div>
                `
                : ''
            }

            <div class="flex flex-wrap items-center justify-between w-full pt-4 mt-4 border-t text-xs neo-muted" style="border-color: var(--brass-border);">
              <span class="inline-flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full" style="background-color: var(--verdigris);"></span>
                <span>Today (26 Nov)</span>
              </span>
              <span class="inline-flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full" style="background-color: var(--brass-accent);"></span>
                <span>Approved marker (next 30 days)</span>
              </span>
            </div>
          </div>
        `;
      }

      function renderTodayTab() {
        const sorted = getSortedRecords();
        const itemsWithin30 = sorted.filter((r) => r.daysFromToday <= 30);
        const selectedItem = sorted.find((r) => r.id === state.selectedRingItemId) || sorted[0] || null;
        if (selectedItem) state.selectedRingItemId = selectedItem.id;

        const rowsHtml =
          sorted.length === 0
            ? `<div class="py-10 text-center space-y-2"><p class="font-serif-display text-xl font-bold">Nothing coming up</p><p class="text-sm neo-muted">Add a document to review and approve your first reminder.</p></div>`
            : sorted
                .map((item) => {
                  const isSelected = selectedItem && selectedItem.id === item.id;
                  const beyond30 = item.daysFromToday > 30;
                  return `
                    <div
                      role="button"
                      tabindex="0"
                      data-select-row-id="${item.id}"
                      style="${isSelected ? 'border-color: var(--brass-accent); background-color: var(--input-bg);' : ''}"

                          <span class="font-serif-display text-3xl font-bold block leading-none neo-brass-text">${item.daysFromToday}d</span>
                          <span class="text-[11px] block mt-1 neo-muted">${escapeHtml(item.dueDateDisplay.replace(' 2026', '').replace(' 2027', ''))}</span>
                        </div>
                        <div class="min-w-0">
                          <div class="flex flex-wrap items-center gap-2">
                            <h3 class="font-semibold text-sm sm:text-base truncate">${escapeHtml(item.title)}</h3>

                            ${beyond30 ? `<span class="text-[11px] font-medium px-2 py-0.5 rounded-full border neo-muted" style="border-color: var(--panel-border);">Beyond 30-day ring</span>` : ''}
                          </div>
                          <p class="text-xs sm:text-sm mt-1 neo-muted">${escapeHtml(item.issuer)} • <span class="font-semibold">${escapeHtml(item.amount)}</span></p>

                      <span class="hidden sm:inline-flex items-center gap-1 text-xs font-medium px-2.5 py-1 rounded-full border shrink-0" style="background-color: var(--highlight-green-bg); color: var(--verdigris); border-color: var(--highlight-green-border);">
                        <span>${escapeHtml(item.status)}</span>
                      </span>
                    </div>
                  `;
                })
                .join('');

        return `
          <section class="space-y-7">
            <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
              <div>
                <p class="text-sm font-medium neo-brass-text">Good morning, Thursday, 26 Nov</p>
                <h1 class="font-serif-display text-3xl sm:text-4xl font-bold tracking-tight mt-0.5">Today</h1>
                <p class="text-sm mt-1 neo-muted">Your next 30 days of approved bills, bookings, and renewals on a single dial.</p>
              </div>
              <button type="button" id="today-add-btn" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-[10px] text-sm btn-primary self-start sm:self-auto">
                <span>+ Add document</span>
              </button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              <div class="lg:col-span-5 p-6 neo-panel">
                <div class="flex items-center justify-between mb-3">
                  <h2 class="font-serif-display text-xl font-bold">Next 30 days · ${itemsWithin30.length} on ring</h2>
                </div>
                ${buildThirtyDayRingSvg(itemsWithin30, selectedItem)}
              </div>

              <div class="lg:col-span-7 p-5 sm:p-6 space-y-4 neo-panel">
                <div class="flex items-center justify-between">
                  <h2 class="font-serif-display text-2xl font-bold">Coming up</h2>
                  <span class="text-xs neo-muted">Select a row to inspect on the ring</span>
                </div>
                <div class="space-y-2.5">${rowsHtml}</div>
              </div>
            </div>

            <div class="p-5 sm:p-6 neo-panel flex flex-col sm:flex-row sm:items-center justify-between gap-4" style="border-color: var(--brass-border);">
              <div class="space-y-1">
                <span class="text-xs font-medium neo-brass-text">Schedule pattern</span>
                <h3 class="font-serif-display text-xl sm:text-2xl font-bold">
                  Three renewals and bookings fall in December across your accounts.
                </h3>
              </div>
              <button type="button" data-app-tab="vault" class="text-sm font-medium neo-brass-text underline shrink-0 cursor-pointer">
                Review them together →
              </button>
            </div>
          </section>
        `;
      }

      // ----------------------------------------------------------------------
      // ADD DOCUMENT & LIVE SCAN TAB CONTENT
      // ----------------------------------------------------------------------
      function clearScanTimers() {
        scanTimers.forEach((t) => clearTimeout(t));
        scanTimers = [];
      }

      function resetScanState() {
        clearScanTimers();
        state.scanDoc = null;
        state.isScanning = false;
        state.scanStage = 0;
        state.selectedChoiceId = null;
        state.uploadError = '';
        state.draftIssuer = '';
        state.draftCategory = 'Bill';
        state.draftAmount = '';
        state.draftDueDate = '';
        state.draftReminderTiming = state.permissions.leadTime || '3 days before';
      }

      function startLiveScan(docPayload) {
        clearScanTimers();
        state.uploadError = '';
        state.scanDoc = docPayload;
        state.selectedChoiceId = null;

        if (prefersReducedMotion) {
          state.isScanning = false;
          state.scanStage = 4;
          state.draftIssuer = docPayload.issuer;
          state.draftCategory = docPayload.category;
          state.draftAmount = docPayload.amount;
          state.draftReminderTiming = docPayload.reminderTiming;
          render();
          return;
        }

        state.isScanning = true;
        state.scanStage = 0;
        state.draftIssuer = '';
        state.draftAmount = '';
        state.draftDueDate = '';
        render();

        scanTimers.push(setTimeout(() => { state.scanStage = 1; state.draftIssuer = docPayload.issuer; state.draftCategory = docPayload.category; render(); }, 550));
        scanTimers.push(setTimeout(() => { state.scanStage = 2; state.draftAmount = docPayload.amount; render(); }, 1150));
        scanTimers.push(setTimeout(() => { state.scanStage = 3; state.draftReminderTiming = docPayload.reminderTiming; render(); }, 1750));
        scanTimers.push(setTimeout(() => { state.scanStage = 4; state.isScanning = false; render(); }, 2400));
      }

      function renderAddTab() {
        const errorBanner = state.uploadError
          ? `<div role="alert" class="p-4 rounded-[14px] border flex items-center justify-between gap-3" style="background-color: var(--amber-card-bg); border-color: var(--amber-card-border);"><span class="text-sm">${escapeHtml(state.uploadError)}</span><button type="button" id="close-upload-error" class="text-xs underline">Close</button></div>`
          : '';

        if (!state.scanDoc) {
          const tabsHtml = [
            { id: 'file', label: 'Upload file' },
            { id: 'text', label: 'Paste text' },
            { id: 'voice', label: 'Voice note' }
          ]
            .map((t) => `<button type="button" data-add-tab="${t.id}" class="py-2.5 px-3 rounded-[10px] text-sm font-medium ${state.addInputTab === t.id ? 'btn-primary' : 'neo-muted'}">${t.label}</button>`)
            .join('');

          let bodyHtml = '';
          if (state.addInputTab === 'file') {
            bodyHtml = `
              <div class="p-6 sm:p-8 flex flex-col items-center neo-panel">
                <div id="arch-dropzone" class="neoclassical-arch w-full max-w-md p-2 border-2" style="border-color: var(--brass-accent); background-color: var(--subpanel-bg);">
                  <div class="neoclassical-arch w-full pt-14 pb-9 px-6 border flex flex-col items-center text-center" style="border-color: var(--panel-border); background-color: var(--input-bg);">
                    <input id="file-upload-input" type="file" accept=".pdf,.jpg,.jpeg,.png" class="hidden" />

                    <p class="text-xs sm:text-sm mt-1.5 max-w-xs neo-muted">Supports PDF, JPG, or PNG bills, travel bookings, receipts, and warranties</p>
                    <div class="mt-6 flex flex-col sm:flex-row items-center gap-2.5 w-full justify-center">
                      <button type="button" id="scan-sample-btn" class="px-4 py-2.5 rounded-[10px] text-sm btn-primary">Scan a sample bill</button>
                      <button type="button" id="choose-file-btn" class="px-4 py-2.5 rounded-[10px] text-sm btn-secondary">Choose file</button>
                    </div>
                  </div>
                </div>
              </div>
            `;
          } else if (state.addInputTab === 'text') {
            bodyHtml = `
              <div class="p-6 sm:p-8 space-y-4 neo-panel">
                <div class="flex items-center justify-between gap-2">
                  <label for="paste-doc-textarea" class="text-sm font-medium">Paste bill or confirmation text</label>
                  <button type="button" id="fill-sample-text-btn" class="text-xs font-medium underline neo-brass-text">Fill sample bill text</button>
                </div>
                <textarea id="paste-doc-textarea" rows="5" placeholder="Paste the text of your electricity bill, booking confirmation, or receipt…" class="w-full rounded-[10px] p-3.5 text-sm neo-input">${escapeHtml(state.pastedText)}</textarea>
                <div class="flex items-center justify-between">
                  <button type="button" id="scan-sample-from-text-btn" class="text-xs underline neo-muted">Or scan a sample bill</button>
                  <button type="button" id="extract-text-btn" class="px-4 py-2.5 rounded-[10px] text-sm btn-primary">Scan text</button>
                </div>
              </div>
            `;
          } else {
            bodyHtml = `
              <div class="p-8 text-center space-y-5 neo-panel">
                <h2 class="font-serif-display text-2xl font-bold">${state.isRecording ? `Recording… 00:${String(state.recordingSeconds).padStart(2, '0')}` : 'Record a spoken bill or reminder'}</h2>
                <p class="text-sm max-w-md mx-auto neo-muted">Speak the issuer, amount, and due date, then stop recording to inspect the extracted evidence.</p>
                <div class="flex items-center justify-center gap-3">
                  <button type="button" id="toggle-voice-btn" class="px-5 py-2.5 rounded-[10px] text-sm btn-primary">${state.isRecording ? 'Stop recording' : 'Start recording'}</button>
                  <button type="button" id="scan-sample-from-voice-btn" class="px-4 py-2.5 rounded-[10px] text-sm btn-secondary">Scan a sample bill</button>
                </div>
              </div>
            `;
          }

          return `
            <section class="space-y-6">
              <div>
                <h1 class="font-serif-display text-3xl sm:text-4xl font-bold">Add document</h1>
                <p class="text-sm mt-1 neo-muted">Upload a bill, booking, receipt, or warranty. Nothing is scheduled without your approval.</p>
              </div>
              ${errorBanner}
              <div class="max-w-2xl mx-auto space-y-6">
                <div class="grid grid-cols-3 gap-1.5 p-1.5 neo-panel">${tabsHtml}</div>
                ${bodyHtml}
              </div>
            </section>
          `;
        }

        const doc = state.scanDoc;
        const beamHtml = state.isScanning && !prefersReducedMotion ? `<div class="scan-beam"><div class="h-[2px] w-full bg-[#D4AE5E]"></div></div>` : '';
        const questionCard =
          state.scanStage >= 4 && !state.selectedChoiceId
            ? `
              <div class="p-5 rounded-[14px] border-2 space-y-3" style="background-color: var(--amber-card-bg); border-color: var(--amber-card-border);">
                <h3 class="font-serif-display text-xl font-bold">Which date is the due date?</h3>
                <p class="text-xs neo-muted">The statement prints "12/12/2026" alongside a "11 Dec 2026" billing cycle cutoff.</p>
                <div class="space-y-2">
                  ${doc.choices.map((c) => `<button type="button" data-date-choice-id="${c.id}" class="w-full text-left p-3 rounded-[10px] text-xs font-medium flex items-center justify-between btn-secondary"><span>${escapeHtml(c.label)}</span><span class="px-2 py-0.5 rounded bg-[#D4AE5E] text-[#0A1228] font-semibold">Choose</span></button>`).join('')}
                </div>
              </div>
            `
            : '';

        const isApproveEnabled = !state.isScanning && Boolean(state.selectedChoiceId || state.draftDueDate) && Boolean(state.draftIssuer.trim());

        return `
          <section class="space-y-6">
            <div>
              <h1 class="font-serif-display text-3xl sm:text-4xl font-bold">Review extracted evidence</h1>
              <p class="text-sm mt-1 neo-muted">Confirm the highlighted fields before adding to your 30-day ring.</p>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
              <div class="lg:col-span-7 relative overflow-hidden neo-panel p-5 sm:p-6 space-y-4">
                ${beamHtml}
                <div class="pb-3 border-b flex items-center justify-between" style="border-color: var(--panel-border);">
                  <div>
                    <h2 class="font-serif-display text-2xl font-bold">${escapeHtml(doc.title)}</h2>
                    <p class="text-xs neo-muted">${escapeHtml(doc.billingPeriod)}</p>
                  </div>
                  <span class="text-xs font-mono px-2.5 py-1 neo-subpanel neo-muted">${escapeHtml(doc.accountNumber)}</span>
                </div>
                <div class="p-3.5 neo-subpanel" style="${state.scanStage >= 1 ? 'background-color: var(--highlight-green-bg); border-color: var(--highlight-green-border);' : ''}">
                  <span class="text-xs neo-muted block">Issuing authority</span>
                  <p class="text-sm font-semibold">${escapeHtml(doc.issuer)}</p>
                </div>
                <div class="p-3.5 neo-subpanel" style="${state.scanStage >= 2 ? 'background-color: var(--highlight-green-bg); border-color: var(--highlight-green-border);' : ''}">
                  <span class="text-xs neo-muted block">Amount due</span>
                  <p class="text-sm font-semibold">Amount Due: ${escapeHtml(doc.amountRaw)}</p>
                </div>
                <div class="p-3.5 neo-subpanel" style="${state.scanStage >= 4 ? (state.selectedChoiceId ? 'background-color: var(--highlight-green-bg); border-color: var(--highlight-green-border);' : 'background-color: var(--highlight-brass-bg); border-color: var(--highlight-brass-border);') : ''}">
                  <span class="text-xs neo-muted block">Printed due date stub</span>
                  <p class="text-sm font-semibold">Due Date: 12/12/2026 (Cutoff: 11 Dec 2026)</p>
                </div>
              </div>

              <div class="lg:col-span-5 space-y-4">
                ${questionCard}
                <div class="p-5 space-y-4 neo-panel">
                  <h3 class="font-serif-display text-xl font-bold">Extracted details</h3>

                  </div>
                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="block text-xs font-medium mb-1 neo-muted">Category</label>
                      <select id="draft-category-select" class="w-full px-3 py-2 rounded-[10px] text-sm neo-input">

                        <option value="Booking" ${state.draftCategory === 'Booking' ? 'selected' : ''}>Booking</option>

                      </select>
                    </div>
                    <div>

                    <button type="button" id="dismiss-scan-btn" class="w-full py-2 px-4 rounded-[10px] text-sm btn-secondary">
                      Dismiss
                    </button>
                  </div>
                </div>
              </div>

      // ----------------------------------------------------------------------
      // VAULT TAB CONTENT
      // ----------------------------------------------------------------------
      function renderVaultTab() {
        const q = state.vaultSearch.trim().toLowerCase();
        const filtered = getSortedRecords().filter((rec) => {
          const matchesType = state.vaultFilter === 'All' || rec.category === state.vaultFilter;
          const matchesSearch = !q || rec.title.toLowerCase().includes(q) || rec.issuer.toLowerCase().includes(q) || rec.snippet.toLowerCase().includes(q);
          return matchesType && matchesSearch;
        });

        const filterButtons = ['All', 'Bill', 'Booking', 'Warranty']

        return `

            <div>
              <h1 class="font-serif-display text-3xl sm:text-4xl font-bold">Vault</h1>
              <p class="text-sm mt-1 neo-muted">Searchable archive of approved bills, bookings, and warranties with certificate originals.</p>
            </div>
            <div class="flex flex-col sm:flex-row gap-3">
              <input id="vault-search-input" type="search" value="${escapeHtml(state.vaultSearch)}" placeholder="Search saved records…" class="flex-1 px-4 py-2.5 rounded-[12px] text-sm neo-input" />
              <div class="flex flex-wrap items-center gap-1.5">${filterButtons}</div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${filtered
                .map(
                  (rec) => `
                  <div class="p-5 flex flex-col justify-between gap-4 neo-panel">
                    <div class="space-y-2">
                      <div class="flex items-center justify-between gap-2">${getCategoryBadgeHtml(rec.category)}<span class="text-xs neo-muted">Saved ${escapeHtml(rec.savedAt)}</span></div>
                      <h2 class="font-serif-display text-xl font-bold">${escapeHtml(rec.title)}</h2>
                      <p class="text-xs neo-muted">${escapeHtml(rec.issuer)}</p>
                      <p class="text-xs leading-relaxed neo-muted">${escapeHtml(rec.snippet)}</p>
                    </div>
                    <div class="pt-3.5 border-t flex items-center justify-between gap-2" style="border-color: var(--panel-border);">
                      <div class="text-xs"><span class="font-semibold">${escapeHtml(rec.amount)}</span> <span class="neo-muted">• ${escapeHtml(rec.dueDateDisplay)}</span></div>
                      <button type="button" data-open-original-id="${rec.id}" class="px-3 py-1.5 rounded-lg text-xs btn-secondary">Open original</button>

      // ----------------------------------------------------------------------
      // ASK LOOP TAB CONTENT
      // ----------------------------------------------------------------------
      function executeGroundedAsk(questionText) {
        const q = (questionText !== undefined ? questionText : state.askQuery).trim();
        if (questionText !== undefined) state.askQuery = questionText;
        if (!q) return;

        if (typewriterTimer) clearInterval(typewriterTimer);
        const lower = q.toLowerCase();
        const stopWords = new Set(['when', 'what', 'how', 'much', 'does', 'the', 'for', 'are', 'and', 'with', 'my', 'is', 'date']);
        const keywords = lower.replace(/[?.,!]/g, '').split(/\s+/).filter((w) => w.length > 2 && !stopWords.has(w));

        let bestMatch = null;
        let bestScore = 0;
        state.records.forEach((rec) => {
          const corpus = `${rec.title} ${rec.issuer} ${rec.category} ${rec.amount} ${rec.dueDateDisplay} ${rec.snippet}`.toLowerCase();
          let score = 0;
          keywords.forEach((kw) => { if (corpus.includes(kw)) score += 1; });
          if (score > bestScore) { bestScore = score; bestMatch = rec; }
        });

        if (bestMatch && bestScore > 0) {
          state.askResult = {
            found: true,
            fullAnswer: `Your ${bestMatch.title} (${bestMatch.amount}) is scheduled for ${bestMatch.dueDateDisplay}, which is ${bestMatch.daysFromToday} days from today.`,
            source: bestMatch
          };
        } else {
          state.askResult = {
            found: false,
            fullAnswer: 'No matching record is saved in your Vault yet. Add and approve a document first so LOOP can answer from verified records.',
            source: null
          };
        }

        state.typedAnswer = state.askResult.fullAnswer;
        state.typingComplete = true;
        render();
      }

      function renderAskTab() {
        const presets = [
          'When is my next credit card bill?',
          'What is the Goa trip check-in date?',
          'When does my refrigerator warranty expire?',
          'What is my broadband renewal amount?'
        ];

        const resultHtml = state.askResult
          ? `

              <span class="text-xs font-medium" style="color: ${state.askResult.found ? 'var(--verdigris)' : 'var(--brass-accent)'};">
                ${state.askResult.found ? 'Grounded in saved Vault record' : 'No matching record'}
              </span>
              <p class="font-serif-display text-2xl sm:text-3xl font-semibold leading-snug">${escapeHtml(state.typedAnswer)}</p>
              ${
                state.askResult.found && state.askResult.source
                  ? `
                    <div class="p-4 space-y-2 neo-subpanel">
                      <div class="flex items-center justify-between gap-2">
                        <span class="font-semibold text-sm">${escapeHtml(state.askResult.source.title)}</span>
                        <button type="button" id="ask-open-source-btn" data-open-source-id="${state.askResult.source.id}" class="px-3 py-1.5 rounded-lg text-xs btn-primary">Open source</button>
                      </div>
                      <p class="text-xs neo-muted">“${escapeHtml(state.askResult.source.snippet)}”</p>

                  `

          `

        return `

            <div>
              <h1 class="font-serif-display text-3xl sm:text-4xl font-bold">Ask LOOP</h1>
              <p class="text-sm mt-1 neo-muted">Answers come exclusively from your saved Vault records and cite the verified source document.</p>
            </div>
            <form id="ask-loop-form" class="p-2 flex items-center gap-2 neo-panel">
              <input id="ask-loop-input" type="text" value="${escapeHtml(state.askQuery)}" placeholder="Ask about your bills, Goa trip, or appliance warranty…" class="flex-1 bg-transparent py-2 px-3 text-sm focus:outline-none" />
              <button type="submit" class="px-4 py-2 rounded-[10px] text-sm btn-primary">Ask</button>
            </form>
            <div class="flex flex-wrap gap-2">
              ${presets.map((q) => `<button type="button" data-ask-preset="${escapeHtml(q)}" class="px-3 py-1.5 rounded-[10px] text-xs btn-secondary">${escapeHtml(q)}</button>`).join('')}
            </div>
            ${resultHtml}
          </section>
        `;
      }

      // ----------------------------------------------------------------------
      // SETTINGS TAB CONTENT
      // ----------------------------------------------------------------------
      function renderSettingsTab() {
        return `
          <section class="max-w-3xl mx-auto space-y-6">
            <div>
              <h1 class="font-serif-display text-3xl sm:text-4xl font-bold">Settings</h1>
              <p class="text-sm mt-1 neo-muted">Manage account session, permissions, reminder channels, and archive export.</p>
            </div>

            <div class="p-6 space-y-4 neo-panel">
              <div class="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <h2 class="font-serif-display text-xl font-bold">${escapeHtml(state.userName)}</h2>
                  <p class="text-xs neo-muted">${escapeHtml(state.userEmail || 'aarav.sharma@domain.in')}</p>
                </div>
                <div class="flex items-center gap-2">
                  <button type="button" data-go-route="permissions" class="px-3.5 py-2 rounded-[10px] text-xs btn-secondary">Review permissions</button>
                  <button type="button" id="sign-out-btn" class="px-3.5 py-2 rounded-[10px] text-xs btn-primary">Sign out</button>
                </div>
              </div>
            </div>

            <div class="p-6 space-y-4 neo-panel">
              <h2 class="font-serif-display text-xl font-bold">Archive management</h2>
              <div class="flex flex-wrap items-center justify-between gap-3">
                <button type="button" id="export-data-btn" class="px-4 py-2.5 rounded-[10px] text-sm btn-secondary">Export data (JSON)</button>
                <button type="button" id="reset-demo-data-btn" class="px-4 py-2.5 rounded-[10px] text-sm btn-secondary">Restore sample archive</button>
              </div>

      }

      // ----------------------------------------------------------------------
      // CERTIFICATE MODAL
      // ----------------------------------------------------------------------
      function openCertificateModal(record) {
        if (!record) return;
        const modal = document.getElementById('certificate-modal');
        document.getElementById('modal-title').textContent = record.title;
        document.getElementById('modal-subtitle').textContent = `${record.sourceType} • Saved ${record.savedAt}`;
        document.getElementById('modal-footer-note').textContent = `Scheduled for ${record.dueDateDisplay} (${record.reminderTiming})`;
        document.getElementById('modal-body').innerHTML = `
          <div class="pb-3 border-b flex items-start justify-between gap-2" style="border-color: var(--panel-border);">
            <div>
              <p class="font-serif-display text-lg font-bold">${escapeHtml(record.docHeader || record.title)}</p>
              <p class="text-xs mt-0.5 neo-muted">${escapeHtml(record.docSubheader || record.issuer)}</p>
            </div>
            <span class="text-xs font-mono px-2.5 py-1 neo-subpanel neo-muted">${escapeHtml(record.referenceCode || 'CERT-2026')}</span>
          </div>
          <div class="space-y-3">
            ${(record.sections || []).map((s) => `<div class="p-3.5 rounded-[10px] border" style="background-color: var(--highlight-green-bg); border-color: var(--highlight-green-border);"><span class="block text-xs font-medium mb-1 neo-muted">${escapeHtml(s.label)}</span><p class="text-sm font-medium">${escapeHtml(s.text)}</p></div>`).join('')}
          </div>
        `;
        const card = document.getElementById('certificate-modal-card');
        if (card && !prefersReducedMotion) {
          card.classList.remove('modal-enter');
          void card.offsetWidth;
          card.classList.add('modal-enter');
        }
        modal.classList.remove('hidden');
      }

      function closeCertificateModal() {
        document.getElementById('certificate-modal').classList.add('hidden');
      }

      // ----------------------------------------------------------------------
      // BIND DASHBOARD EVENTS
      // ----------------------------------------------------------------------
      function bindDashboardEvents() {
        document.querySelectorAll('[data-go-route]').forEach((btn) => {
          btn.addEventListener('click', () => navigateTo(btn.getAttribute('data-go-route')));
        });

        document.querySelectorAll('[data-app-tab]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const tab = btn.getAttribute('data-app-tab');
            if (tab === 'add') resetScanState();
            navigateTo('app', tab);
          });
        });

        const t1 = document.getElementById('dash-theme-toggle');
        const t2 = document.getElementById('dash-mobile-theme-toggle');
        const toggleTheme = () => { state.lightMode = !state.lightMode; render(); };
        if (t1) t1.addEventListener('click', toggleTheme);
        if (t2) t2.addEventListener('click', toggleTheme);

        const mobileMenuBtn = document.getElementById('dash-mobile-menu-btn');
        if (mobileMenuBtn) {
          mobileMenuBtn.addEventListener('click', () => {
            state.mobileMenuOpen = !state.mobileMenuOpen;
            render();
          });
        }

        // Today tab events
        const todayAdd = document.getElementById('today-add-btn');
        if (todayAdd) todayAdd.addEventListener('click', () => { resetScanState(); navigateTo('app', 'add'); });

        document.querySelectorAll('[data-select-ring-id], [data-select-row-id]').forEach((el) => {
          el.addEventListener('click', () => {
            state.selectedRingItemId = el.getAttribute('data-select-ring-id') || el.getAttribute('data-select-row-id');
            render();
          });
        });

        const markPaid = document.getElementById('mark-paid-btn');
        if (markPaid) {
          markPaid.addEventListener('click', () => {
            const id = markPaid.getAttribute('data-mark-paid-id');
            state.records = state.records.filter((r) => r.id !== id);
            const next = getSortedRecords();
            state.selectedRingItemId = next[0] ? next[0].id : null;
            showToast('Marked as paid');
            render();
          });
        }

        // Add tab events
        document.querySelectorAll('[data-add-tab]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const nextTab = btn.getAttribute('data-add-tab');
            if (nextTab === state.addInputTab) return;
            state.addInputTab = nextTab;
            state.animateNext = 'step';
            render();
          });
        });

        ['scan-sample-btn', 'scan-sample-from-text-btn', 'scan-sample-from-voice-btn'].forEach((id) => {
          const btn = document.getElementById(id);
          if (btn) btn.addEventListener('click', () => startLiveScan({ ...SAMPLE_BESCOM_BILL }));
        });

        const chooseFile = document.getElementById('choose-file-btn');
        const fileInput = document.getElementById('file-upload-input');
        if (chooseFile && fileInput) {
          chooseFile.addEventListener('click', () => fileInput.click());
          fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const title = file.name.replace(/\.[^/.]+$/, '').replace(/[-_]/g, ' ') || 'Uploaded Bill';
            startLiveScan({ ...SAMPLE_BESCOM_BILL, id: `scan-${Date.now()}`, title });
          });
        }

        const fillSample = document.getElementById('fill-sample-text-btn');
        if (fillSample) {
          fillSample.addEventListener('click', () => {
            state.pastedText = 'BESCOM Electricity Supply — Account ID: 849201742. Billing Period: Nov 2026. Amount Due: ₹3,420.00. Due Date: 12/12/2026 (Cutoff: 11 Dec 2026).';
            render();
          });
        }

        const pasteArea = document.getElementById('paste-doc-textarea');
        if (pasteArea) pasteArea.addEventListener('input', (e) => { state.pastedText = e.target.value; });

        const extractBtn = document.getElementById('extract-text-btn');
        if (extractBtn) {
          extractBtn.addEventListener('click', () => {
            if (state.pastedText.trim().length < 8) {
              state.uploadError = 'Paste a bill or confirmation snippet first.';
              render();
              return;
            }
            startLiveScan({ ...SAMPLE_BESCOM_BILL, id: `scan-txt-${Date.now()}`, sourceType: 'Pasted Text' });
          });
        }

        const voiceBtn = document.getElementById('toggle-voice-btn');
        if (voiceBtn) {
          voiceBtn.addEventListener('click', () => {
            if (!state.isRecording) {
              state.isRecording = true;
              state.recordingSeconds = 0;
              recordingInterval = setInterval(() => { state.recordingSeconds += 1; render(); }, 1000);
              render();
            } else {
              state.isRecording = false;
              clearInterval(recordingInterval);
              startLiveScan({ ...SAMPLE_BESCOM_BILL, id: `scan-voice-${Date.now()}`, sourceType: 'Voice Note' });
            }
          });
        }

        document.querySelectorAll('[data-date-choice-id]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const c = state.scanDoc.choices.find((x) => x.id === btn.getAttribute('data-date-choice-id'));
            if (c) { state.selectedChoiceId = c.id; state.draftDueDate = c.dueDate; render(); }
          });
        });

        const issuerIn = document.getElementById('draft-issuer-input');
        if (issuerIn) issuerIn.addEventListener('input', (e) => { state.draftIssuer = e.target.value; });
        const catSel = document.getElementById('draft-category-select');
        if (catSel) catSel.addEventListener('change', (e) => { state.draftCategory = e.target.value; });
        const amtIn = document.getElementById('draft-amount-input');
        if (amtIn) amtIn.addEventListener('input', (e) => { state.draftAmount = e.target.value; });
        const dueIn = document.getElementById('draft-duedate-input');
        if (dueIn) dueIn.addEventListener('change', (e) => { state.draftDueDate = e.target.value; state.selectedChoiceId = 'manual'; render(); });

        const approveBtn = document.getElementById('approve-reminder-btn');
        if (approveBtn) {
          approveBtn.addEventListener('click', () => {
            const chosen = state.scanDoc.choices.find((c) => c.id === state.selectedChoiceId);
            const daysFromToday = chosen ? chosen.daysFromToday : calculateDaysFromRefToday(state.draftDueDate);
            const dueDateDisplay = chosen ? chosen.dueDateDisplay : formatDisplayDate(state.draftDueDate);
            const newRec = {
              id: `rec-${Date.now()}`,
              title: state.scanDoc.title,
              issuer: state.draftIssuer.trim(),
              amount: state.draftAmount.trim(),
              numericAmount: parseInt(String(state.draftAmount).replace(/[^\d]/g, ''), 10) || 0,
              dueDate: state.draftDueDate,
              dueDateDisplay,
              daysFromToday,
              category: state.draftCategory,
              status: 'Confirmed',
              reminderTiming: state.draftReminderTiming,
              sourceType: state.scanDoc.sourceType,
              savedAt: '26 Nov 2026',
              docHeader: `${state.draftIssuer.trim()} — Statement`,
              docSubheader: `${state.scanDoc.accountNumber} • ${state.scanDoc.billingPeriod}`,
              referenceCode: 'CERT-2026-8492',
              sections: [
                { label: 'Issuing authority', text: state.draftIssuer.trim() },
                { label: 'Amount payable', text: state.draftAmount.trim() },
                { label: 'Confirmed due date', text: `${dueDateDisplay} (${daysFromToday} days from today)` }
              ],
              snippet: `${state.scanDoc.title} from ${state.draftIssuer.trim()} for ${state.draftAmount.trim()} due on ${dueDateDisplay}.`
            };
            state.records.unshift(newRec);
            state.selectedRingItemId = newRec.id;
            resetScanState();
            showToast('Reminder approved');
            navigateTo('app', 'today');
          });
        }

        const dismissBtn = document.getElementById('dismiss-scan-btn');
        if (dismissBtn) dismissBtn.addEventListener('click', () => { resetScanState(); render(); });

        // Vault tab events
        const vaultSearch = document.getElementById('vault-search-input');
        if (vaultSearch) {
          vaultSearch.addEventListener('input', (e) => {
            state.vaultSearch = e.target.value;
            render();
            const refreshed = document.getElementById('vault-search-input');
            if (refreshed) { refreshed.focus(); refreshed.setSelectionRange(refreshed.value.length, refreshed.value.length); }
          });
        }
        document.querySelectorAll('[data-vault-filter]').forEach((btn) => {
          btn.addEventListener('click', () => { state.vaultFilter = btn.getAttribute('data-vault-filter'); render(); });
        });
        document.querySelectorAll('[data-open-original-id]').forEach((btn) => {
          btn.addEventListener('click', () => openCertificateModal(state.records.find((r) => r.id === btn.getAttribute('data-open-original-id'))));
        });

        // Ask LOOP events
        const askForm = document.getElementById('ask-loop-form');
        const askIn = document.getElementById('ask-loop-input');
        if (askIn) askIn.addEventListener('input', (e) => { state.askQuery = e.target.value; });
        if (askForm) askForm.addEventListener('submit', (e) => { e.preventDefault(); executeGroundedAsk(); });
        document.querySelectorAll('[data-ask-preset]').forEach((btn) => {
          btn.addEventListener('click', () => executeGroundedAsk(btn.getAttribute('data-ask-preset')));
        });
        const askOpenSrc = document.getElementById('ask-open-source-btn');
        if (askOpenSrc) askOpenSrc.addEventListener('click', () => openCertificateModal(state.records.find((r) => r.id === askOpenSrc.getAttribute('data-open-source-id'))));

        // Settings events
        const signOutBtn = document.getElementById('sign-out-btn');
        if (signOutBtn) {
          signOutBtn.addEventListener('click', async () => {
            if (state.backendAvailable) {
              try {
                await apiFetch('/api/v1/auth/logout', { method: 'POST' });
              } catch (_e) {}
            } else {
              savePreviewSession(null);
            }
            state.isAuthenticated = false;
            state.permissionsGranted = false;
            state.authPasswordInput = '';
            state.userEmail = '';
            showToast('Signed out');
            navigateTo('landing');
          });
        }

        const exportBtn = document.getElementById('export-data-btn');
        if (exportBtn) {
          exportBtn.addEventListener('click', () => {
            const blob = new Blob([JSON.stringify({ exportedAt: '2026-11-26', user: state.userEmail, records: state.records }, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'loop-archive-2026-11-26.json';
            a.click();
            URL.revokeObjectURL(url);
            showToast('Archive exported as JSON');
          });
        }

        const resetDemoBtn = document.getElementById('reset-demo-data-btn');
        if (resetDemoBtn) {
          resetDemoBtn.addEventListener('click', () => {
            state.records = [...INITIAL_RECORDS];
            state.selectedRingItemId = INITIAL_RECORDS[0].id;
            showToast('Sample archive restored');
            render();
          });
        }
      }

      // ----------------------------------------------------------------------
      // MASTER RENDER
      // ----------------------------------------------------------------------
      function render() {
        syncTheme();
        const root = document.getElementById('root-app');
        const animKind = state.animateNext;
        state.animateNext = null;

        if (state.route === 'landing') {
          root.innerHTML = renderLandingPage();
          bindLandingEvents();
        } else if (state.route === 'login') {
          root.innerHTML = renderAuthPage('login');
          bindAuthEvents('login');
        } else if (state.route === 'signup') {
          root.innerHTML = renderAuthPage('signup');
          bindAuthEvents('signup');
        } else if (state.route === 'permissions') {
          root.innerHTML = renderPermissionsPage();
          bindPermissionsEvents();
        } else {
          let tabHtml = '';
          if (state.appTab === 'today') tabHtml = renderTodayTab();
          else if (state.appTab === 'add') tabHtml = renderAddTab();
          else if (state.appTab === 'vault') tabHtml = renderVaultTab();
          else if (state.appTab === 'ask') tabHtml = renderAskTab();
          else if (state.appTab === 'settings') tabHtml = renderSettingsTab();

          root.innerHTML = renderDashboardShell(tabHtml);
          bindDashboardEvents();
        }

        if (!prefersReducedMotion && animKind) {
          if (animKind === 'page' && root.firstElementChild) {
            root.firstElementChild.classList.add('page-enter');
          } else if (animKind === 'tab' || animKind === 'step') {
            const tabStage = document.getElementById('dash-tab-stage');
            if (tabStage && tabStage.firstElementChild) {
              tabStage.firstElementChild.classList.add(animKind === 'tab' ? 'tab-enter' : 'step-enter');
            }
          }
        }
      }

      // Modal close wiring
      document.getElementById('modal-close-top').addEventListener('click', closeCertificateModal);
      document.getElementById('modal-close-bottom').addEventListener('click', closeCertificateModal);
      document.getElementById('certificate-modal').addEventListener('click', (e) => {
        if (e.target.id === 'certificate-modal') closeCertificateModal();
      });

      window.addEventListener('hashchange', () => {
        syncFromHash();
        state.animateNext = 'page';
        render();
      });

      // Boot
      syncFromHash();
      applyOAuthErrorFromHash();
      render();
      hydrateSessionOnBoot();
    })();
  </script>
